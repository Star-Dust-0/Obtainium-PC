name: Build Windows (Obtainium-PC)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'windows/**'
      - '.github/workflows/build-windows.yml'
      - 'global.json'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Test
        run: dotnet test windows/ObtainiumPC.Tests/ObtainiumPC.Tests.csproj -c Release -p:Platform=x64
      - name: Restore
        run: msbuild windows/ObtainiumPC.sln /t:Restore /p:Configuration=Release /p:Platform=x64
      - name: Build
        run: msbuild windows/ObtainiumPC.sln /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:SelfContained=true
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ObtainiumPC-win-x64
          path: windows/ObtainiumPC/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64/
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer (version read from csproj; never bumped here)
        shell: pwsh
        run: |
          $v = ([xml](Get-Content windows/ObtainiumPC/ObtainiumPC.csproj)).Project.PropertyGroup.Version | Select-Object -First 1
          iscc /DMyAppVersion=$v "/DBuildDir=$PWD\windows\ObtainiumPC\bin\x64\Release\net8.0-windows10.0.19041.0\win-x64" windows\packaging\ObtainiumPC.iss
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ObtainiumPC-Setup-win-x64
          path: installer-out/
      - name: Installer smoke (install / upgrade-in-place / uninstall registration, user data preserved)
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer-out\*.exe | Select-Object -First 1
          if ($null -eq $setup) { throw 'installer exe missing' }
          $dir = Join-Path $env:ProgramFiles 'Obtainium-PC'
          $data = Join-Path $env:LOCALAPPDATA 'ObtainiumPC'
          # The /VERYSILENT flags drive OUR OWN packaging in CI; this is the
          # harness installing our product, unrelated to the app's
          # interactive-only boundary for downloaded third-party installers.
          & $setup.FullName /VERYSILENT /SUPPRESSMSGBOXES /NORESTART | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "install exit $LASTEXITCODE" }
          if (-not (Test-Path (Join-Path $dir 'ObtainiumPC.exe'))) { throw 'exe missing after install' }
          $reg = Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -eq 'Obtainium-PC' }
          if ($null -eq $reg) { throw 'uninstall registry entry missing after install' }
          "installed at $dir; registered version: $($reg.DisplayVersion)"
          New-Item -ItemType Directory -Force $data | Out-Null
          Set-Content (Join-Path $data 'settings.json') '{"Theme":2,"Language":"en"}'
          Set-Content (Join-Path $data 'apps.json') '[]'
          & $setup.FullName /VERYSILENT /SUPPRESSMSGBOXES /NORESTART | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "upgrade-in-place exit $LASTEXITCODE" }
          if ((Get-Content (Join-Path $data 'settings.json') -Raw) -notmatch '"Theme":2') { throw 'user settings lost on upgrade-in-place' }
          if (-not (Test-Path (Join-Path $data 'apps.json'))) { throw 'user store lost on upgrade-in-place' }
          'upgrade-in-place preserved user data'
          $unins = Join-Path $dir 'unins000.exe'
          if (-not (Test-Path $unins)) { throw 'uninstaller missing' }
          & $unins /VERYSILENT /SUPPRESSMSGBOXES /NORESTART | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "uninstall exit $LASTEXITCODE" }
          if (Test-Path (Join-Path $dir 'ObtainiumPC.exe')) { throw 'exe still present after uninstall' }
          if (-not (Test-Path (Join-Path $data 'settings.json'))) { throw 'user data removed by uninstall' }
          $reg2 = Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -eq 'Obtainium-PC' }
          if ($null -ne $reg2) { throw 'uninstall registry entry left behind' }
          'uninstall clean: program files and registry entry removed, user data preserved'
