          $g = [System.Drawing.Graphics]::FromImage($bm); $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bm.Save('about-original-fullscreen.png')
          $w = $r.R - $r.L; $ht = $r.B - $r.T
          $cr = New-Object System.Drawing.Bitmap $w, $ht
          $g2 = [System.Drawing.Graphics]::FromImage($cr); $g2.CopyFromScreen($r.L, $r.T, 0, 0, (New-Object System.Drawing.Size $w, $ht))
          $cr.Save('about-window-only.png')
          "screen $($b.Width)x$($b.Height)" | Tee-Object -FilePath about-info.txt -Append
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: about-shot
          path: |
            about-*.png
            about-info.txt
