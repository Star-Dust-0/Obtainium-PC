# ============================================================================
# windows-vm-test - Real Windows 11 GUI test on a dockur/windows VM
# ============================================================================
# REUSABLE TEMPLATE (canonical copy: Star-Dust-0/fluent-prayer-times, main)
#
# To add this to a new Windows app repo:
#   1. Copy this file to .github/workflows/windows-vm-test.yml
#   2. Copy the .dockur-test/ folder (run.ps1, oem/install.bat)
#   3. In .dockur-test/run.ps1 set the three variables at the top:
#        $Repo, $AssetMatch, $ExeMatch
#   That's it. Nothing else in these files is repo-specific.
#
# WHEN TO USE THIS (vs the normal CI runner):
#   - The VM takes ~8-11 minutes just to boot Windows 11, so for plain
#     build / compile / unit-test checks the normal runner stays faster.
#   - Use this VM for what a headless runner cannot prove: GUI launch,
#     installer behaviour, first-run experience, theme/RTL rendering and
#     real screenshots of the app on a real Windows 11 desktop.
#
# SAFETY RULES (standing, per repo owner):
#   - MANUAL TRIGGER ONLY (workflow_dispatch). Never add push, PR or
#     schedule triggers to this workflow. It boots a full Windows VM and
#     downloads a release - heavy. Repeated automated heavy runs risk the
#     account (two previous accounts were suspended).
#   - One proof run is enough; re-run only when GUI behaviour changes.
#   - Concurrency below cancels an older still-running dispatch.
#
# HOW IT WORKS:
#   ubuntu runner -> docker dockurr/windows (Win 11, KVM) -> shared folder
#   -> oem/install.bat runs at first boot -> run.ps1 screenshots desktop,
#   downloads the latest release portable zip, launches the app, screenshots
#   it -> screenshots + logs uploaded as the "windows-vm-test-out" artifact.
# ============================================================================
name: windows-vm-test
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to test (empty = latest stable release)'
        required: false
        default: ''
      artifact_run_id:
        description: 'Build Windows run id; when set with target=runner, run the candidate preview job instead of the release verify job'
        required: false
        default: ''
      target:
        description: 'vm = dockur Windows 11 VM; runner = standard Windows runner (no VM)'
        required: true
        default: 'vm'
      icon_check:
        description: 'runner target only: run the icon render verification job instead of the standard candidate preview'
        required: false
        default: 'false'
      feat_check:
        description: 'runner target only: run the tray/download/notification verification job instead of the standard candidate preview'
        required: false
        default: 'false'

concurrency:
  group: windows-vm-test
  cancel-in-progress: true

jobs:
  win:
    if: inputs.target != 'runner'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: KVM check
        run: |
          nproc; free -g | head -2; df -h / | tail -1
          ls -l /dev/kvm || true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules; sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm
      - name: Start dockur/windows
        run: |
          mkdir -p shared; cp .dockur-test/run.ps1 shared/run.ps1
          if [ -n "${{ inputs.release_tag }}" ]; then printf '%s' "${{ inputs.release_tag }}" > shared/release-tag.txt; fi
          docker run -d --name win -e VERSION=11l -e RAM_SIZE=6G -e CPU_CORES=3 -e DISK_SIZE=40G \
            --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN \
            -p 8006:8006 -p 7100:7100 -e ARGUMENTS="-monitor telnet:0.0.0.0:7100,server,nowait" \
            -v $PWD/shared:/shared -v $PWD/.dockur-test/oem:/oem docker.io/dockurr/windows
          sleep 20; docker logs win | tail -20
      - name: Wait for Windows
        run: |
          start=$(date +%s)
          for i in $(seq 1 130); do
            grep -q DONE shared/result.txt 2>/dev/null && break
            if [ $((i%6)) -eq 0 ]; then
              echo "t=$(( $(date +%s)-start ))s"; docker logs win 2>&1 | tail -3
              python3 - <<PY
          import socket,time,os,zlib,struct
          def mon(cmd):
            try:
              s=socket.create_connection(("127.0.0.1",7100),timeout=5); time.sleep(1)
              s.sendall(cmd.encode()+b"\n"); time.sleep(3)
              s.settimeout(2)
              try: print("monitor:", s.recv(4096).decode("utf-8","replace")[-200:])
              except Exception: pass
              s.close()
            except Exception as e: print("monitor-error:", e)
          def ppm2png(ppm,png):
            data=open(ppm,"rb").read()
            parts=[]; i0=0
            while len(parts)<4:
              while data[i0:i0+1].isspace(): i0+=1
              if data[i0:i0+1]==b"#":
                while data[i0:i0+1]!=b"\n": i0+=1
                continue
              j=i0
              while not data[j:j+1].isspace(): j+=1
              parts.append(data[i0:j]); i0=j
            i0+=1
            w,h=int(parts[1]),int(parts[2])
            raw=data[i0:i0+w*h*3]
            def chunk(t,d):
              c=t+d; return struct.pack(">I",len(d))+c+struct.pack(">I",zlib.crc32(c)&0xffffffff)
            scan=b"".join(b"\x00"+raw[y*w*3:(y+1)*w*3] for y in range(h))
            open(png,"wb").write(b"\x89PNG\r\n\x1a\n"+chunk(b"IHDR",struct.pack(">IIBBBBB",w,h,8,2,0,0,0))+chunk(b"IDAT",zlib.compress(scan))+chunk(b"IEND",b""))
          i="$i"
          png="shared/mon-"+i+".png"; ppm="shared/mon-"+i+".ppm"
          mon("screendump /shared/mon-"+i+".png -f png")
          if not (os.path.exists(png) and os.path.getsize(png)>100):
            print("png screendump missing; trying ppm")
            mon("screendump /shared/mon-"+i+".ppm")
            if os.path.exists(ppm) and os.path.getsize(ppm)>100:
              ppm2png(ppm,png); print("ppm converted to png")
            else: print("screendump-failed")
          PY
              [ -f shared/mon-$i.png ] && cp shared/mon-$i.png shot-$i.png || echo screendump-failed
            fi
            sleep 20
          done
          echo "total $(( $(date +%s)-start ))s"; cat shared/result.txt shared/ps-log.txt || echo NO_RESULT; ls -la shared
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-vm-test-out
          path: |
            shot-*.png
            shared/*.png
            shared/*.txt
          retention-days: 3
      - if: always()
        run: docker logs win 2>&1 | tail -40

  # Functional verification on a standard GitHub-hosted Windows runner:
  # stable interactive session, no VM boot, no OOBE hazards. Fails CLOSED:
  # any unmet check (tag, hash, version, launch, survival, soak, relaunch,
  # silent install/uninstall) fails the job. Runner is disposable; all
  # installs/uninstalls happen only on it.
  verify:
    if: inputs.target == 'runner' && inputs.artifact_run_id == ''
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      REPO: Star-Dust-0/Obtainium-PC
      TAG: ${{ inputs.release_tag }}
    steps:
      - name: Download release assets and verify SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:TAG.Trim()
          if (-not $tag) { throw 'release_tag input is empty; refusing to fall back to latest' }
          try { $rel = Invoke-RestMethod "https://api.github.com/repos/$env:REPO/releases/tags/$tag" }
          catch { throw "could not resolve release tag '$tag': $($_.Exception.Message)" }
          if ($rel.tag_name -ne $tag) { throw "resolved release '$($rel.tag_name)' does not match requested '$tag'" }
          "release: $($rel.tag_name) (requested: '$tag')"
          $sums = $rel.assets | Where-Object { $_.name -eq 'SHA256SUMS.txt' } | Select-Object -First 1
          if (-not $sums) { throw 'SHA256SUMS.txt asset missing; cannot verify bytes' }
          Invoke-WebRequest $sums.browser_download_url -OutFile SHA256SUMS.txt
          foreach ($pat in @('portable\.zip$', 'Setup\.exe$')) {
            $a = $rel.assets | Where-Object { $_.name -match $pat } | Select-Object -First 1
            if (-not $a) { throw "no release asset matches '$pat'" }
            Invoke-WebRequest $a.browser_download_url -OutFile $a.name
            $line = Get-Content SHA256SUMS.txt | Where-Object { $_ -match [regex]::Escape($a.name) } | Select-Object -First 1
            if (-not $line) { throw "$($a.name) not listed in SHA256SUMS.txt" }
            $want = ($line -split '\s+')[0].ToLower()
            $got = (Get-FileHash $a.name -Algorithm SHA256).Hash.ToLower()
            "$($a.name): sha256 want=$want"
            "$($a.name): sha256 got =$got"
            if ($want -ne $got) { throw "SHA256 mismatch for $($a.name)" }
            $zi = Get-Item $a.name -Stream Zone.Identifier -ErrorAction SilentlyContinue
            if ($zi) { "MOTW $($a.name): Zone.Identifier PRESENT" } else { "MOTW $($a.name): no Zone.Identifier" }
          }
      - name: Extract portable zip and assert exe version matches tag
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem *portable.zip | Select-Object -First 1
          Expand-Archive $zip.FullName app -Force
          $exe = Get-ChildItem app -Recurse -Filter ObtainiumPC.exe | Select-Object -First 1
          if (-not $exe) { throw 'ObtainiumPC.exe not found after extract' }
          "exe: $($exe.FullName)"
          $zi = Get-Item $exe.FullName -Stream Zone.Identifier -ErrorAction SilentlyContinue
          if ($zi) { 'MOTW exe: Zone.Identifier PRESENT' } else { 'MOTW exe: no Zone.Identifier' }
          $ver = (Get-Item $exe.FullName).VersionInfo.FileVersion
          "exe version: $ver"
          $wantV = $env:TAG.Trim().TrimStart('v','V')
          if (-not $ver -or -not $ver.StartsWith($wantV)) { throw "exe version $ver does not match requested tag $env:TAG" }
          'exe version matches requested tag'
          "EXE_PATH=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Append
      - name: Launch and verify 30s survival + screenshot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $p = Start-Process $env:EXE_PATH -PassThru
          "launched pid $($p.Id) at $(Get-Date -Format o)"
          Start-Sleep 30
          $alive = Get-Process -Id $p.Id -ErrorAction SilentlyContinue
          if (-not $alive) { throw 'process exited within 30s of launch' }
          "alive after 30s: $($alive.Name) ws=$([math]::Round($alive.WorkingSet64/1MB))MB"
          try {
            $b=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bm=New-Object System.Drawing.Bitmap $b.Width,$b.Height
            $g=[System.Drawing.Graphics]::FromImage($bm)
            $g.CopyFromScreen($b.Location,[System.Drawing.Point]::Empty,$b.Size)
            $bm.Save('launched.png'); "shot launched $($b.Width)x$($b.Height)"
          } catch { "WARN screenshot failed (session may not render UI): $($_.Exception.Message)" }
      - name: Bounded soak - 5 min process survival
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ok = $true
          foreach ($m in 1..5) {
            Start-Sleep 60
            $pr = Get-Process -Name ObtainiumPC -ErrorAction SilentlyContinue
            if ($pr) {
              $mb = [math]::Round((($pr | Measure-Object WorkingSet64 -Sum).Sum)/1MB)
              "soak t+${m}min: alive, ${mb}MB"
            } else { "soak t+${m}min: PROCESS GONE"; $ok = $false; break }
          }
          if (-not $ok) { throw 'process died during soak' }
          'soak: PASS (5 min stable)'
      - name: Close and relaunch - repeat-launch check + screenshot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $pr = Get-Process -Name ObtainiumPC -ErrorAction SilentlyContinue
          if (-not $pr) { throw 'process not running before relaunch test' }
          $pr | ForEach-Object { $_.CloseMainWindow() | Out-Null }
          Start-Sleep 10
          $still = Get-Process -Name ObtainiumPC -ErrorAction SilentlyContinue
          if ($still) { 'still running after CloseMainWindow; force stopping'; $still | Stop-Process -Force; Start-Sleep 5 }
          $p2 = Start-Process $env:EXE_PATH -PassThru
          "relaunched pid $($p2.Id) at $(Get-Date -Format o)"
          Start-Sleep 30
          $alive2 = Get-Process -Id $p2.Id -ErrorAction SilentlyContinue
          if (-not $alive2) { throw 'relaunched process exited within 30s' }
          "relaunch: alive after 30s, ws=$([math]::Round($alive2.WorkingSet64/1MB))MB"
          try {
            $b=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bm=New-Object System.Drawing.Bitmap $b.Width,$b.Height
            $g=[System.Drawing.Graphics]::FromImage($bm)
            $g.CopyFromScreen($b.Location,[System.Drawing.Point]::Empty,$b.Size)
            $bm.Save('relaunch.png'); "shot relaunch $($b.Width)x$($b.Height)"
          } catch { "WARN screenshot failed (session may not render UI): $($_.Exception.Message)" }
          $alive2 | Stop-Process -Force
      - name: Silent install, registry entry, silent uninstall (disposable runner only)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Process -Name ObtainiumPC -ErrorAction SilentlyContinue | Stop-Process -Force
          $setup = Get-ChildItem *Setup.exe | Select-Object -First 1
          "running installer: $($setup.Name)"
          $proc = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/NORESTART','/SUPPRESSMSGBOXES' -Wait -PassThru
          "setup exit code: $($proc.ExitCode)"
          if ($proc.ExitCode -ne 0) { throw "installer exited $($proc.ExitCode)" }
          $roots = @('HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
                     'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall',
                     'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall')
          $entry = $null
          foreach ($r in $roots) {
            $entry = Get-ChildItem $r -ErrorAction SilentlyContinue |
              Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -match 'Obtainium' } |
              ForEach-Object { Get-ItemProperty $_.PSPath } | Select-Object -First 1
            if ($entry) { break }
          }
          if (-not $entry) { throw 'no Obtainium uninstall registry entry after silent install' }
          "uninstall entry: $($entry.DisplayName) $($entry.DisplayVersion)"
          "install location: $($entry.InstallLocation)"
          $unins = Join-Path $entry.InstallLocation 'unins000.exe'
          if (-not (Test-Path $unins)) { throw "uninstaller not found at $unins" }
          $uproc = Start-Process $unins -ArgumentList '/VERYSILENT','/NORESTART','/SUPPRESSMSGBOXES' -Wait -PassThru
          "uninstaller exit code: $($uproc.ExitCode)"
          if ($uproc.ExitCode -ne 0) { throw "uninstaller exited $($uproc.ExitCode)" }
          $stillThere = $false
          foreach ($r in $roots) {
            if (Get-ChildItem $r -ErrorAction SilentlyContinue | Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -match 'Obtainium' }) { $stillThere = $true }
          }
          if ($stillThere) { throw 'uninstall registry entry still present after silent uninstall' }
          'install/uninstall: PASS (entry created by install, removed by uninstall)'
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-runner-test-out
          path: '*.png'
          if-no-files-found: warn

  # One-off visual PREVIEW of candidate (unreleased) code. Downloads the
  # build artifact from a given Build Windows run, seeds a disposable
  # apps.json with one SYNTHETIC failure fixture (pre-seeded state, exempt
  # from the background check so the seeded line survives the relaunch) and
  # one LIVE probe entry (really checked against GitHub on startup), then
  # screenshots the Apps page. Evidence only: nothing here publishes,
  # merges, or changes a release. All fixtures live only on the ephemeral
  # runner and vanish with it.
  preview:
    if: inputs.target == 'runner' && inputs.artifact_run_id != '' && inputs.icon_check != 'true' && inputs.feat_check != 'true' && inputs.feat_check != 'about' && inputs.feat_check != 'export'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      REPO: Star-Dust-0/Obtainium-PC
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Record artifact run provenance (fail closed)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:ARTIFACT_RUN_ID.Trim()) { throw 'artifact_run_id is empty' }
          $info = gh run view $env:ARTIFACT_RUN_ID -R $env:REPO --json status,conclusion,headSha,headBranch,displayTitle | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "could not read run $env:ARTIFACT_RUN_ID" }
          "artifact source run: $($info.displayTitle) status=$($info.status) conclusion=$($info.conclusion)"
          "artifact source commit: $($info.headSha) (branch: $($info.headBranch))"
          if ($info.conclusion -ne 'success') { throw 'source run is not green; refusing to preview its artifact' }
      - name: Download build artifact from that run
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gh run download $env:ARTIFACT_RUN_ID -R $env:REPO -n ObtainiumPC-win-x64 -D artifact
          if ($LASTEXITCODE -ne 0) { throw 'artifact download failed' }
          $exe = Get-ChildItem artifact -Recurse -Filter ObtainiumPC.exe | Select-Object -First 1
          if (-not $exe) { throw 'ObtainiumPC.exe not found in artifact' }
          "exe: $($exe.FullName)"
          "exe version: $((Get-Item $exe.FullName).VersionInfo.FileVersion)"
          "EXE_PATH=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Append
      - name: First launch to create the data store, then close
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $p = Start-Process $env:EXE_PATH -PassThru
          "first launch pid $($p.Id)"
          Start-Sleep 20
          $alive = Get-Process -Id $p.Id -ErrorAction SilentlyContinue
          if (-not $alive) { throw 'process exited during first launch' }
          $alive.CloseMainWindow() | Out-Null
          Start-Sleep 8
          $still = Get-Process -Id $p.Id -ErrorAction SilentlyContinue
          if ($still) { $still | Stop-Process -Force; Start-Sleep 5 }
          $store = Join-Path $env:LOCALAPPDATA 'ObtainiumPC\apps.json'
          if (-not (Test-Path $store)) { throw "apps.json not created at $store" }
          "store: $store"
      - name: Seed disposable apps.json (SYNTHETIC fixture + LIVE probe)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $store = Join-Path $env:LOCALAPPDATA 'ObtainiumPC\apps.json'
          $apps = @(
            [ordered]@{
              id = '11111111-1111-1111-1111-111111111111'
              url = 'https://github.com/Star-Dust-0/Obtainium-PC'
              author = 'Star-Dust-0'
              name = 'Synthetic-Failure-Demo'
              installedVersion = '2.0.0'
              latestVersion = '2.0.0'
              consecutiveFailedChecks = 3
              lastCheckError = 'http_404'
              additionalSettings = '{"exemptFromBackgroundUpdates":true}'
            },
            [ordered]@{
              id = '22222222-2222-2222-2222-222222222222'
              url = 'https://github.com/MohamedElnaggar00/Obtainium-PC'
              author = 'MohamedElnaggar00'
              name = 'Live-OldRepo-Probe'
            }
          )
          ($apps | ConvertTo-Json -Depth 5) | Set-Content $store -Encoding UTF8
          Get-Content $store
          'seeded: 1 SYNTHETIC fixture (pre-seeded failure state, background-check exempt) + 1 LIVE probe entry'
      - name: Relaunch, wait for the startup check, screenshot the Apps page
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $p = Start-Process $env:EXE_PATH -PassThru
          "relaunch pid $($p.Id)"
          Start-Sleep 60
          $alive = Get-Process -Id $p.Id -ErrorAction SilentlyContinue
          if (-not $alive) { throw 'relaunched process exited within 60s' }
          "alive after 60s, ws=$([math]::Round($alive.WorkingSet64/1MB))MB"
          try {
            $b=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bm=New-Object System.Drawing.Bitmap $b.Width,$b.Height
            $g=[System.Drawing.Graphics]::FromImage($bm)
            $g.CopyFromScreen($b.Location,[System.Drawing.Point]::Empty,$b.Size)
            $bm.Save('preview-apps.png'); "shot preview-apps $($b.Width)x$($b.Height)"
          } catch { throw "screenshot failed: $($_.Exception.Message)" }
          $alive | Stop-Process -Force
      - name: LIVE probe - record the old repo API status verbatim
        shell: pwsh
        run: |
          $code = curl.exe -sS -o NUL -w '%{http_code}' https://api.github.com/repos/MohamedElnaggar00/Obtainium-PC/releases
          "LIVE-PROBE api.github.com/repos/MohamedElnaggar00/Obtainium-PC/releases -> HTTP $code"
          "LIVE-PROBE api.github.com/repos/MohamedElnaggar00/Obtainium-PC/releases -> HTTP $code" | Out-File live-probe.txt
      - name: Upload preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-preview-out
          path: |
            *.png
            live-probe.txt
          if-no-files-found: warn

  # Icon render verification for the pixelation report (candidate code).
  # Downloads the SAME build artifact as the standard preview (never builds
  # the app here), then exercises each icon path on the ephemeral runner:
  #   exe-resource frame selection (fixture exe whose frames are distinct
  #   solid colours, so rendered pixels identify the decoded frame exactly),
  #   the actual own-app icon (artifact exe registered as the installed
  #   "Obtainium-PC", matched by the auto-created own record), the live
  #   GitHub avatar path, and the missing-avatar placeholder fallback.
  # Effective DPI is READ FROM WINDOWS (GetDpiForWindow on the app window);
  # a 150% capture is produced only when that API confirms 144 DPI, never
  # resized imagery. All fixtures live only on the disposable runner.
  iconpreview:
    if: inputs.target == 'runner' && inputs.artifact_run_id != '' && inputs.icon_check == 'true' && inputs.feat_check != 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      REPO: Star-Dust-0/Obtainium-PC
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Record artifact run provenance (fail closed)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:ARTIFACT_RUN_ID.Trim()) { throw 'artifact_run_id is empty' }
          $info = gh run view $env:ARTIFACT_RUN_ID -R $env:REPO --json status,conclusion,headSha,headBranch,displayTitle | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "could not read run $env:ARTIFACT_RUN_ID" }
          "artifact source run: $($info.displayTitle) status=$($info.status) conclusion=$($info.conclusion)"
          "artifact source commit: $($info.headSha) (branch: $($info.headBranch))"
          if ($info.conclusion -ne 'success') { throw 'source run is not green; refusing to preview its artifact' }
      - name: Download build artifact from that run
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gh run download $env:ARTIFACT_RUN_ID -R $env:REPO -n ObtainiumPC-win-x64 -D artifact
          if ($LASTEXITCODE -ne 0) { throw 'artifact download failed' }
          $exe = Get-ChildItem artifact -Recurse -Filter ObtainiumPC.exe | Select-Object -First 1
          if (-not $exe) { throw 'ObtainiumPC.exe not found in artifact' }
          "exe: $($exe.FullName)"
          "exe version: $((Get-Item $exe.FullName).VersionInfo.FileVersion)"
          "EXE_PATH=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Append
      - name: Build fixture exe with colour-coded icon frames
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Each frame a distinct solid colour so rendered pixels identify the decoded frame:
          # 16=red 32=green 48=blue 64=yellow 128=cyan 256=magenta. A correct pipeline
          # (smallest frame >= 64px) renders YELLOW; red/green/blue would prove a small
          # frame was stretched (the pixelation mechanism).
          $frames = @(
            @{ s = 16;  rgb = @(255, 0, 0) },
            @{ s = 32;  rgb = @(0, 200, 0) },
            @{ s = 48;  rgb = @(0, 0, 255) },
            @{ s = 64;  rgb = @(255, 255, 0) },
            @{ s = 128; rgb = @(0, 255, 255) },
            @{ s = 256; rgb = @(255, 0, 255) }
          )
          $imgs = @()
          foreach ($f in $frames) {
            $s = $f.s; $r = $f.rgb[0]; $g = $f.rgb[1]; $b = $f.rgb[2]
            $ms = New-Object System.IO.MemoryStream
            $bw = New-Object System.IO.BinaryWriter($ms)
            $bw.Write([uint32]40); $bw.Write([int32]$s); $bw.Write([int32](2 * $s))
            $bw.Write([uint16]1); $bw.Write([uint16]32); $bw.Write([uint32]0)
            $bw.Write([uint32]($s * $s * 4)); $bw.Write([int32]0); $bw.Write([int32]0)
            $bw.Write([uint32]0); $bw.Write([uint32]0)
            for ($i = 0; $i -lt $s * $s; $i++) { $bw.Write([byte]$b); $bw.Write([byte]$g); $bw.Write([byte]$r); $bw.Write([byte]255) }
            for ($y = 0; $y -lt $s; $y++) { for ($x = 0; $x -lt (($s + 31) -band (-bnot 31)) / 8; $x++) { $bw.Write([byte]0) } }
            $bw.Flush(); $imgs += ,@{ s = $s; data = $ms.ToArray() }
          }
          $ico = New-Object System.IO.MemoryStream
          $w = New-Object System.IO.BinaryWriter($ico)
          $w.Write([uint16]0); $w.Write([uint16]1); $w.Write([uint16]$imgs.Count)
          $offset = 6 + 16 * $imgs.Count
          foreach ($im in $imgs) {
            $wb = if ($im.s -ge 256) { [byte]0 } else { [byte]$im.s }
            $w.Write($wb); $w.Write($wb); $w.Write([byte]0); $w.Write([byte]0)
            $w.Write([uint16]1); $w.Write([uint16]32)
            $w.Write([uint32]$im.data.Length); $w.Write([uint32]$offset)
            $offset += $im.data.Length
          }
          foreach ($im in $imgs) { $w.Write($im.data) }
          $w.Flush()
          New-Item -ItemType Directory C:\icon-fixture -Force | Out-Null
          [System.IO.File]::WriteAllBytes('C:\icon-fixture\fixture.ico', $ico.ToArray())
          Set-Content C:\icon-fixture\fixture.cs 'class P { static void Main() {} }'
          $csc = 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $csc /nologo /target:exe /win32icon:C:\icon-fixture\fixture.ico /out:C:\icon-fixture\fixture.exe C:\icon-fixture\fixture.cs
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path C:\icon-fixture\fixture.exe)) { throw 'fixture exe build failed' }
          "fixture exe: $((Get-Item C:\icon-fixture\fixture.exe).Length) bytes, 6 colour-coded frames (16 red .. 256 magenta)"
      - name: Register fixture and own app as installed (runner-local HKCU only)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $u = 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall'
          $k1 = New-Item "$u\IconFrameFixture" -Force
          Set-ItemProperty $k1.PSPath DisplayName 'Icon Frame Fixture'
          Set-ItemProperty $k1.PSPath DisplayIcon 'C:\icon-fixture\fixture.exe,0'
          Set-ItemProperty $k1.PSPath DisplayVersion '1.0'
          Set-ItemProperty $k1.PSPath Publisher 'IconFixture'
          $k2 = New-Item "$u\ObtainiumPC-iconcheck" -Force
          Set-ItemProperty $k2.PSPath DisplayName 'Obtainium-PC'
          Set-ItemProperty $k2.PSPath DisplayIcon "$($env:EXE_PATH),0"
          Set-ItemProperty $k2.PSPath DisplayVersion ((Get-Item $env:EXE_PATH).VersionInfo.FileVersion)
          Set-ItemProperty $k2.PSPath Publisher 'Star-Dust-0'
          'registered: Icon Frame Fixture -> fixture.exe; Obtainium-PC -> artifact exe'
      - name: First launch (store + own record), then close
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $p = Start-Process $env:EXE_PATH -PassThru
          "first launch pid $($p.Id)"
          Start-Sleep 20
          $alive = Get-Process -Id $p.Id -ErrorAction SilentlyContinue
          if (-not $alive) { throw 'process exited during first launch' }
          $alive.CloseMainWindow() | Out-Null
          Start-Sleep 8
          $still = Get-Process -Id $p.Id -ErrorAction SilentlyContinue
          if ($still) { $still | Stop-Process -Force; Start-Sleep 5 }
          $store = Join-Path $env:LOCALAPPDATA 'ObtainiumPC\apps.json'
          if (-not (Test-Path $store)) { throw "apps.json not created at $store" }
          $doc = Get-Content $store -Raw | ConvertFrom-Json
          $own = @($doc | Where-Object { $_.name -eq 'Obtainium-PC' })
          if ($own.Count -ne 1) { throw "expected 1 auto-created own record, found $($own.Count)" }
          "own record: osMatchedName=$($own[0].osMatchedName) installedVersion=$($own[0].installedVersion)"
      - name: Append icon-path seed rows (SYNTHETIC fixtures)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $store = Join-Path $env:LOCALAPPDATA 'ObtainiumPC\apps.json'
          $doc = @(Get-Content $store -Raw | ConvertFrom-Json)
          $new = @(
            [ordered]@{ id = '33333333-3333-3333-3333-333333333333'; url = 'https://github.com/IconFixture/icon-frame-fixture'; author = 'IconFixture'; name = 'Icon Frame Fixture'; installedVersion = '1.0'; latestVersion = '1.0'; additionalSettings = '{"exemptFromBackgroundUpdates":true}' },
            [ordered]@{ id = '44444444-4444-4444-4444-444444444444'; url = 'https://github.com/Star-Dust-0/fluent-prayer-times'; author = 'Star-Dust-0'; name = 'Avatar Path Sample'; additionalSettings = '{"exemptFromBackgroundUpdates":true}' },
            [ordered]@{ id = '55555555-5555-5555-5555-555555555555'; url = 'https://github.com/zzz-nonexistent-owner-404xyz/nope'; author = 'zzz-nonexistent-owner-404xyz'; name = 'Avatar Fallback Sample'; additionalSettings = '{"exemptFromBackgroundUpdates":true}' }
          )
          ($doc + $new | ConvertTo-Json -Depth 6) | Set-Content $store -Encoding UTF8
          'seeded: exe-resource fixture + live avatar (fluent-prayer-times) + 404-avatar fallback; own record preserved'
      - name: Relaunch, record real effective DPI, screenshot native pixels
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          Add-Type -MemberDefinition '[System.Runtime.InteropServices.DllImport("user32.dll")] public static extern uint GetDpiForSystem(); [System.Runtime.InteropServices.DllImport("user32.dll")] public static extern uint GetDpiForWindow(System.IntPtr h);' -Name U32 -Namespace W
          $p = Start-Process $env:EXE_PATH -PassThru
          "relaunch pid $($p.Id)"
          Start-Sleep 60
          $alive = Get-Process -Id $p.Id -ErrorAction SilentlyContinue
          if (-not $alive) { throw 'relaunched process exited within 60s' }
          $alive.Refresh()
          $sysDpi = [W.U32]::GetDpiForSystem()
          $winDpi = [W.U32]::GetDpiForWindow($alive.MainWindowHandle)
          "EFFECTIVE-DPI system=$sysDpi window=$winDpi scale=$([math]::Round($winDpi / 96.0 * 100))%" | Tee-Object dpi.txt
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          "primary screen: $($b.Width)x$($b.Height) physical px" | Out-File dpi.txt -Append
          $bm = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bm)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bm.Save('preview-icons-100.png'); "shot preview-icons-100 $($b.Width)x$($b.Height)"
          $alive | Stop-Process -Force
      - name: Attempt REAL 150% scaling (verified by GetDpiForWindow, never resized)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          Add-Type -MemberDefinition '[System.Runtime.InteropServices.DllImport("user32.dll")] public static extern uint GetDpiForWindow(System.IntPtr h);' -Name U32b -Namespace W
          Set-ItemProperty 'HKCU:\Control Panel\Desktop' LogPixels 144
          Set-ItemProperty 'HKCU:\Control Panel\Desktop' Win8DpiScaling 1
          Set-ItemProperty 'HKCU:\Control Panel\Desktop\WindowMetrics' AppliedDPI 144 -ErrorAction SilentlyContinue
          $sig = '[System.Runtime.InteropServices.DllImport("user32.dll")] public static extern System.IntPtr SendMessageTimeout(System.IntPtr h, uint m, System.IntPtr w, string l, uint f, uint t, out System.IntPtr r);'
          Add-Type -MemberDefinition $sig -Name U32c -Namespace W
          $r = [System.IntPtr]::Zero
          [W.U32c]::SendMessageTimeout([System.IntPtr]0xffff, 0x001A, [System.IntPtr]::Zero, 'Environment', 2, 1000, [ref]$r) | Out-Null
          $p = Start-Process $env:EXE_PATH -PassThru
          Start-Sleep 45
          $alive = Get-Process -Id $p.Id -ErrorAction SilentlyContinue
          if (-not $alive) { 'SCALE-150 not exercised: app did not relaunch' | Out-File dpi.txt -Append; exit 0 }
          $alive.Refresh()
          $winDpi = [W.U32b]::GetDpiForWindow($alive.MainWindowHandle)
          if ($winDpi -eq 144) {
            "SCALE-150 CONFIRMED by GetDpiForWindow=$winDpi" | Tee-Object dpi150.txt
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bm = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bm)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bm.Save('preview-icons-150.png'); "shot preview-icons-150 $($b.Width)x$($b.Height)"
          } else {
            "SCALE-150 NOT genuinely achieved (GetDpiForWindow=$winDpi after LogPixels=144 + relaunch); no 150% capture produced" | Tee-Object dpi150.txt
          }
          $alive | Stop-Process -Force
      - name: Upload icon evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icon-preview-out
          path: |
            *.png
            dpi*.txt
          if-no-files-found: warn
      - name: Upload app log (icon diag lines)
        if: always()
        shell: pwsh
        run: |
          $log = Join-Path $env:LOCALAPPDATA 'ObtainiumPC\logs.jsonl'
          if (Test-Path $log) { Copy-Item $log app-log.jsonl; 'app log copied' } else { 'no app log found' }
      - name: Upload log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icon-preview-log
          path: app-log.jsonl
          if-no-files-found: warn

  # Tray / download-progress / notification verification for candidate code.
  # Same binding as the other preview jobs: the exact Build Windows artifact,
  # never a rebuild. A runner-local throttled HTTP fixture drives one real
  # download of a non-executable payload (.bin, cancelled in-app before
  # completion: the payload is never executed or installed). Toasts are
  # evidenced at the LOG level only (requests + update results); this runner
  # reports AppNotificationManager.IsSupported=False, so displayed-toast
  # pixels are an expected platform gap, not a claim. Taskbar progress is
  # claimed only from screenshots that actually show the overlay.
  featpreview:
    if: inputs.target == 'runner' && inputs.artifact_run_id != '' && inputs.feat_check == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      REPO: Star-Dust-0/Obtainium-PC
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Record artifact run provenance (fail closed)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:ARTIFACT_RUN_ID.Trim()) { throw 'artifact_run_id is empty' }
          $info = gh run view $env:ARTIFACT_RUN_ID -R $env:REPO --json status,conclusion,headSha,headBranch,displayTitle | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "could not read run $env:ARTIFACT_RUN_ID" }
          "artifact source run: $($info.displayTitle) status=$($info.status) conclusion=$($info.conclusion)"
          "artifact source commit: $($info.headSha) (branch: $($info.headBranch))"
          if ($info.conclusion -ne 'success') { throw 'source run is not green; refusing to preview its artifact' }
      - name: Download build artifact from that run
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gh run download $env:ARTIFACT_RUN_ID -R $env:REPO -n ObtainiumPC-win-x64 -D artifact
          if ($LASTEXITCODE -ne 0) { throw 'artifact download failed' }
          $exe = Get-ChildItem artifact -Recurse -Filter ObtainiumPC.exe | Select-Object -First 1
          if (-not $exe) { throw 'ObtainiumPC.exe not found in artifact' }
          "exe: $($exe.FullName)"
          "exe version: $((Get-Item $exe.FullName).VersionInfo.FileVersion)"
          "EXE_PATH=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Append
      - name: First launch to create the store, then close
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $p = Start-Process $env:EXE_PATH -PassThru
          Start-Sleep 20
          $alive = Get-Process -Id $p.Id -ErrorAction SilentlyContinue
          if (-not $alive) { throw 'process exited during first launch' }
          $alive.CloseMainWindow() | Out-Null
          Start-Sleep 8
          $still = Get-Process -Id $p.Id -ErrorAction SilentlyContinue
          if ($still) { $still | Stop-Process -Force; Start-Sleep 5 }
          $store = Join-Path $env:LOCALAPPDATA 'ObtainiumPC\apps.json'
          if (-not (Test-Path $store)) { throw "apps.json not created at $store" }
          "store: $store"
      - name: Seed fixture rows (runner-local store only)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $store = Join-Path $env:LOCALAPPDATA 'ObtainiumPC\apps.json'
          $doc = @(Get-Content $store -Raw | ConvertFrom-Json)
          $new = @(
            [ordered]@{ id = '66666666-6666-6666-6666-666666666666'; url = 'http://localhost:8085/payload.bin'; author = 'localhost'; name = 'Fixture Download (synthetic)'; latestVersion = '1.0'; apkUrls = '[["payload.bin","http://localhost:8085/payload.bin"]]'; additionalSettings = '{"exemptFromBackgroundUpdates":true}' },
            [ordered]@{ id = '66666666-6666-6666-6666-666666666667'; url = 'http://localhost:8085/payload.bin'; author = 'localhost'; name = 'Fixture Download B (synthetic)'; latestVersion = '1.0'; apkUrls = '[["payload.bin","http://localhost:8085/payload.bin"]]'; additionalSettings = '{"exemptFromBackgroundUpdates":true}' },
            [ordered]@{ id = '66666666-6666-6666-6666-666666666668'; url = 'http://localhost:8085/payload.bin'; author = 'localhost'; name = 'Fixture Download C (synthetic)'; latestVersion = '1.0'; apkUrls = '[["payload.bin","http://localhost:8085/payload.bin"]]'; additionalSettings = '{"exemptFromBackgroundUpdates":true}' },
            [ordered]@{ id = '66666666-6666-6666-6666-666666666669'; url = 'http://localhost:8086/payload.bin'; author = 'localhost'; name = 'Fixture Download D (synthetic)'; latestVersion = '1.0'; apkUrls = '[["payload.bin","http://localhost:8086/payload.bin"]]'; additionalSettings = '{"exemptFromBackgroundUpdates":true}' },
            [ordered]@{ id = '66666666-6666-6666-6666-66666666666a'; url = 'http://localhost:8085/payload.bin'; author = 'localhost'; name = 'Fixture Checksum OK (synthetic)'; latestVersion = '1.0'; apkUrls = '[["payload.bin","http://localhost:8085/payload.bin"]]'; otherAssetUrls = '[["SHA256SUMS.txt","http://localhost:8087/SHA256SUMS.txt"]]'; additionalSettings = '{"exemptFromBackgroundUpdates":true}' },
            [ordered]@{ id = '66666666-6666-6666-6666-66666666666b'; url = 'http://localhost:8085/payload.bin'; author = 'localhost'; name = 'Fixture Checksum Bad (synthetic)'; latestVersion = '1.0'; apkUrls = '[["payload.bin","http://localhost:8085/payload.bin"]]'; otherAssetUrls = '[["SHA256SUMS.txt","http://localhost:8088/SHA256SUMS.txt"]]'; additionalSettings = '{"exemptFromBackgroundUpdates":true}' },
            [ordered]@{ id = 'cccccccc-cccc-cccc-cccc-cccccccccccc'; url = 'https://github.com/Star-Dust-0/fluent-prayer-times'; author = 'Star-Dust-0'; name = 'Current Sample'; installedVersion = 'v1.3.8' },
            [ordered]@{ id = 'dddddddd-dddd-dddd-dddd-dddddddddddd'; url = 'https://github.com/Star-Dust-0/fluent-prayer-times'; author = 'Star-Dust-0'; name = 'Unknown Status Sample'; installedVersion = '1.0'; lastUpdateCheck = 1795556145818000; additionalSettings = '{"exemptFromBackgroundUpdates":true}' },
            [ordered]@{ id = '77777777-7777-7777-7777-777777777777'; url = 'https://github.com/Star-Dust-0/fluent-prayer-times'; author = 'Star-Dust-0'; name = 'Update Available Sample'; installedVersion = '0.1'; latestVersion = '0.1' },
            [ordered]@{ id = '88888888-8888-8888-8888-888888888888'; url = 'https://github.com/example/never-checked'; author = 'example'; name = 'NullLatest Sample (never checked)'; installedVersion = '1.0'; additionalSettings = '{"exemptFromBackgroundUpdates":true}' },
            [ordered]@{ id = '99999999-9999-9999-9999-999999999999'; url = 'https://github.com/example/stale-failing'; author = 'example'; name = 'Stale Failure Sample'; installedVersion = '1.0'; latestVersion = '2.0'; consecutiveFailedChecks = 3; lastCheckError = 'http_404'; additionalSettings = '{"exemptFromBackgroundUpdates":true}' }
          )
          ($doc + $new | ConvertTo-Json -Depth 6) | Set-Content $store -Encoding UTF8
          'seeded: DirectLink fixture (background-exempt) + live update-available sample (installedVersion 0.1)'
      - name: Start throttled HTTP fixture (20MB at ~200KB/s, non-executable .bin)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [IO.File]::WriteAllBytes('C:\fixture-server.ps1', [Convert]::FromBase64String(''))
          Start-Process powershell -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File','C:\fixture-server.ps1'
          [IO.File]::WriteAllBytes('C:\fixture-server2.ps1', [Convert]::FromBase64String(''))
          Start-Process powershell -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File','C:\fixture-server2.ps1'
          Start-Sleep 3
          $code = curl.exe -sS -o NUL -w '%{http_code}' -I http://localhost:8085/payload.bin
          if ($code -ne '200') { throw "fixture server not serving (HEAD -> $code)" }
          $code2 = curl.exe -sS -o NUL -w '%{http_code}' -I http://localhost:8086/payload.bin
          if ($code2 -ne '200') { throw "second fixture server not serving (HEAD -> $code2)" }
          "fixture server up: HEAD -> $code, 20MB throttled ~200KB/s, payload.bin never executed"
          # Checksum fixtures (runner-local): hash of the exact served payload; one matching list, one deliberately wrong.
          curl.exe -sS -o C:\payload-ref.bin http://localhost:8085/payload.bin
          $h = (Get-FileHash C:\payload-ref.bin -Algorithm SHA256).Hash.ToLower()
          $bad = ('0' * 63) + $(if ($h[63] -eq '1') { '2' } else { '1' })
          New-Item -ItemType Directory C:\sums-good, C:\sums-bad -Force | Out-Null
          Set-Content C:\sums-good\SHA256SUMS.txt "$h  payload.bin" -Encoding ascii
          Set-Content C:\sums-bad\SHA256SUMS.txt "$bad  payload.bin" -Encoding ascii
          Start-Process python -ArgumentList '-m','http.server','8087','--directory','C:\sums-good','--bind','127.0.0.1' -WindowStyle Hidden
          Start-Process python -ArgumentList '-m','http.server','8088','--directory','C:\sums-bad','--bind','127.0.0.1' -WindowStyle Hidden
          Start-Sleep 3
          $g = curl.exe -sS -o NUL -w '%{http_code}' http://localhost:8087/SHA256SUMS.txt
          $b = curl.exe -sS -o NUL -w '%{http_code}' http://localhost:8088/SHA256SUMS.txt
          "checksum fixtures: payload sha256 prefix $($h.Substring(0,8)); good list HTTP $g; bad list HTTP $b; ref size $((Get-Item C:\payload-ref.bin).Length)"
          if ($g -ne '200' -or $b -ne '200') { throw 'checksum fixture servers not serving' }
      - name: Relaunch, verify update-available state (UI + toast-request log)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $p = Start-Process $env:EXE_PATH -PassThru
          "relaunch pid $($p.Id)"
          Start-Sleep 75
          $alive = Get-Process -Id $p.Id -ErrorAction SilentlyContinue
          if (-not $alive) { throw 'relaunched process exited within 75s' }
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bm = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bm)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bm.Save('feat-s0-update-state.png'); "shot s0 $($b.Width)x$($b.Height)"
          $log = Join-Path $env:LOCALAPPDATA 'ObtainiumPC\logs.jsonl'
          $hits = Select-String -Path $log -Pattern 'update available' -SimpleMatch | Measure-Object
          "log lines requesting 'update available' notification: $($hits.Count)"
          $reg = Select-String -Path $log -Pattern 'Notifications registered' -SimpleMatch | Select-Object -Last 1
          "last registration line: $($reg.Line)"
      - name: 'Verdict check: real update-check outcomes on the changed verdict code (UI texts + persisted store)'
        continue-on-error: true
        shell: pwsh
        run: |
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          $AE = [System.Windows.Automation.AutomationElement]; $CT = [System.Windows.Automation.ControlType]
          $proc = Get-Process -Name ObtainiumPC -ErrorAction SilentlyContinue
          if (-not $proc) { 'app not running' | Out-File result-verdict-env.txt; throw 'app not running' }
          $win = $AE::FromHandle($proc.MainWindowHandle)
          $all = $win.FindAll([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.PropertyCondition($AE::ControlTypeProperty, $CT::Text)))
          $names = @(); foreach ($e in $all) { $names += $e.Current.Name }
          $names | Out-File result-verdict-texts.txt
          'UI texts:'; $names | ForEach-Object { "  $_" }
          $store = Join-Path $env:LOCALAPPDATA 'ObtainiumPC\apps.json'
          Copy-Item $store feat-store-after-check.json
          $doc = @(Get-Content $store -Raw | ConvertFrom-Json)
          function Row($name) { $doc | Where-Object { $_.name -eq $name } | Select-Object -First 1 }
          $out = @()
          $r2 = Row 'Real Failing With Stale Latest'
          $out += "R2 stale+real failure: consecutiveFailedChecks=$($r2.consecutiveFailedChecks) lastCheckError=$($r2.lastCheckError) latestVersion=$($r2.latestVersion)"
          $r4 = Row 'Recovering After Real Check'
          $out += "R4 recovery: consecutiveFailedChecks=$($r4.consecutiveFailedChecks) lastCheckError=$($r4.lastCheckError) latestVersion=$($r4.latestVersion)"
          $r7 = Row 'Update Available Sample'
          $out += "R7 real update available: installed=$($r7.installedVersion) latest=$($r7.latestVersion)"
          $r8 = Row 'NullLatest Sample (never checked)'
          $out += "R8 null-latest exempt: latestVersion=[$($r8.latestVersion)] lastUpdateCheck=[$($r8.lastUpdateCheck)]"
          $out | Out-File result-verdict-store.txt
          $out | ForEach-Object { $_ }
      - name: 'Drive download via UI Automation: per-observable outcomes, evidence-first cancel, finally teardown (audit v2)'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes, System.Windows.Forms, System.Drawing
          Add-Type -Name NativeMethods -Namespace Win32 -MemberDefinition '[System.Runtime.InteropServices.DllImport("user32.dll")] public static extern bool IsWindowVisible(System.IntPtr hWnd); [System.Runtime.InteropServices.DllImport("user32.dll")] public static extern bool IsWindow(System.IntPtr hWnd); [System.Runtime.InteropServices.DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y); [System.Runtime.InteropServices.DllImport("user32.dll")] public static extern void mouse_event(int f, int dx, int dy, int d, System.IntPtr e);'
          $AE = [System.Windows.Automation.AutomationElement]
          $CT = [System.Windows.Automation.ControlType]
          $failures = 0
          $coreExercised = $false
          function Shot($name) {
            try {
              $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bm = New-Object System.Drawing.Bitmap $b.Width, $b.Height
              $g = [System.Drawing.Graphics]::FromImage($bm)
              $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
              $bm.Save($name); Write-Host "shot $name"
            } catch { Write-Host "shot $name failed: $($_.Exception.Message)" }
          }
          function Find-Named($root, $type, $name, $tries) {
            for ($i = 0; $i -lt $tries; $i++) {
              $cond = New-Object System.Windows.Automation.AndCondition(
                (New-Object System.Windows.Automation.PropertyCondition($AE::ControlTypeProperty, $type)),
                (New-Object System.Windows.Automation.PropertyCondition($AE::NameProperty, $name)))
              $el = $root.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $cond)
              if ($el) { return $el }
              Start-Sleep 1
            }
            return $null
          }
          function Find-ById($root, $id, $tries) {
            for ($i = 0; $i -lt $tries; $i++) {
              $cond = New-Object System.Windows.Automation.PropertyCondition($AE::AutomationIdProperty, $id)
              $el = $root.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $cond)
              if ($el) { return $el }
              Start-Sleep 1
            }
            return $null
          }
          function Record($name, $outcome, $detail) {
            "$outcome`n$detail" | Out-File "result-$name.txt"
            Write-Host "[$name] $outcome - $detail"
          }
          try {
            # Environment facts recorded verbatim; proxy behaviour is an UNKNOWN, never assumed.
            $ie = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Internet Settings' -ErrorAction SilentlyContinue
            $proxyFacts = @(
              "HTTP_PROXY=$env:HTTP_PROXY HTTPS_PROXY=$env:HTTPS_PROXY NO_PROXY=$env:NO_PROXY",
              "IE ProxyEnable=$($ie.ProxyEnable) ProxyServer=$($ie.ProxyServer) AutoConfigURL=$($ie.AutoConfigURL)",
              ((netsh winhttp show proxy) -join ' | ')
            ) -join "`n"
            Record 'environment' 'RECORDED' $proxyFacts

            $proc = Get-Process -Name ObtainiumPC -ErrorAction SilentlyContinue
            if (-not $proc) { throw 'app not running at UIA stage' }
            $proc.Refresh()
            $hwnd = $proc.MainWindowHandle
            if ($hwnd -eq [System.IntPtr]::Zero) { throw 'no main window handle' }
            $win = $AE::FromHandle($hwnd)
            if (-not $win) { throw 'UIA element not found for the verified app HWND' }

            $dlRoot = Join-Path $env:USERPROFILE 'Downloads\ObtainiumPC'
            function Dl-Files($pat) {
              if (-not (Test-Path $dlRoot)) { return @() }
              @(Get-ChildItem $dlRoot -Recurse -File -Filter $pat -ErrorAction SilentlyContinue)
            }
            function Dump-Texts($label) {
              try {
                $all = $win.FindAll([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.PropertyCondition($AE::ControlTypeProperty, $CT::Text)))
                $names = @(); foreach ($e in $all) { $n = $e.Current.Name; if ($n -match 'ave|ownload|omplete|heck|erif|nstall|Cancel|%|MB|ready') { $names += $n } }
                ($names | Select-Object -Unique) -join ' || ' | Out-File "result-texts-$label.txt"
                Write-Host ("texts[$label]: " + (($names | Select-Object -Unique) -join ' || '))
              } catch { Write-Host "texts[$label] failed: $($_.Exception.Message)" }
            }
            function Start-Download($rowName, $tag) {
              $title = Find-Named $win $CT::Text $rowName 15
              if (-not $title) { Record "$tag-row" 'FAIL' "row '$rowName' not found"; return 'none' }
              $walker = [System.Windows.Automation.TreeWalker]::ControlViewWalker
              $row = $title
              while ($row -and $row.Current.ControlType -ne $CT::ListItem) { $row = $walker.GetParent($row) }
              if (-not $row -or -not $row.GetCurrentPropertyValue($AE::IsInvokePatternAvailableProperty)) { Record "$tag-row" 'AUTOMATION-GAP' 'row Invoke unavailable'; return 'none' }
              $row.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
              if (-not (Find-Named $win $CT::Button 'Back' 15)) { Record "$tag-nav" 'FAIL' 'Back not found'; return 'none' }
              $install = Find-Named $win $CT::Button 'Install' 15
              if (-not $install -or -not $install.Current.IsEnabled) { Record "$tag-install" 'FAIL' 'Install missing or disabled'; return 'navigated' }
              $install.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
              $dlgBtn = $null
              foreach ($r in @($win, [System.Windows.Automation.AutomationElement]::RootElement)) {
                $c = Find-Named $r $CT::Button 'Download' 8
                if ($c) {
                  $w = [System.Windows.Automation.TreeWalker]::ControlViewWalker; $anc = $c
                  while ($anc) { if ($anc.Current.Name -eq 'Choose a file') { $dlgBtn = $c; break }; $anc = $w.GetParent($anc) }
                  if ($dlgBtn) { break }
                }
              }
              if (-not $dlgBtn) { Shot "feat-$tag-no-dialog.png"; Record "$tag-dialog" 'AUTOMATION-GAP' 'asset dialog Download button not found'; return 'install-clicked' }
              $dlgBtn.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
              Record "$tag-dialog" 'PASS' 'asset picker answered'
              return 'dialog-answered'
            }

            # ---- Phase A: let download A run to COMPLETION (20MB at ~200KB/s) ----
            $stA = Start-Download 'Fixture Download (synthetic)' 'A'
            if ($stA -eq 'dialog-answered') {
              $coreExercised = $true
              $expected = 20971520
              $done = $false; $trace = @(); $bar = Find-Named $win $CT::ProgressBar 'Download progress (all downloads)' 10
              for ($i = 0; $i -lt 100 -and -not $done; $i++) {
                Start-Sleep 3
                $p = Dl-Files 'payload.bin.part'; $f = Dl-Files 'payload.bin'
                $ps = if ($p.Count) { $p[0].Length } else { -1 }; $fs = if ($f.Count) { $f[0].Length } else { -1 }
                $trace += "$ps/$fs"
                if ($i -eq 5) { Shot 'feat-A1-midway.png' }
                if ($fs -ge $expected -and $p.Count -eq 0) { $done = $true }
              }
              Shot 'feat-A2-after-complete.png'
              $paths = (Dl-Files 'payload.bin*' | ForEach-Object { "$($_.FullName) [$($_.Length)]" }) -join '; '
              Record 'A-complete-file' ($done ? 'PASS' : 'FAIL') "final file size==$expected and no .part: $done; actual paths: $paths; trace(part/final bytes): $(($trace | Select-Object -Last 8) -join ', ')"
              if (-not $done) { $failures++ }
              Dump-Texts 'A-after'
              $det = Find-ById $win 'DownloadStripDetail' 3
              Record 'A-strip-text' 'RECORDED' ($det ? $det.Current.Name : 'strip detail not found')
              try {
                $back = Find-Named $win $CT::Button 'Back' 5
                if ($back) { $back.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke(); Start-Sleep 2 }
              } catch { Write-Host "back after A failed: $($_.Exception.Message)" }
            } else { Record 'A-complete-file' 'SKIPPED' "stage=$stA"; $failures++ }

            # ---- Phase B: second fixture row, cancel mid-transfer, watch the REAL app-id subfolder ----
            $stB = Start-Download 'Fixture Download B (synthetic)' 'B'
            $part = $null
            if ($stB -eq 'dialog-answered') {
              $before = @(Dl-Files 'payload.bin*' | ForEach-Object { $_.FullName })
              $barB = Find-Named $win $CT::ProgressBar 'Download progress (all downloads)' 10
              $rvB = $null
              if ($barB -and $barB.GetCurrentPropertyValue($AE::IsRangeValuePatternAvailableProperty)) { $rvB = $barB.GetCurrentPattern([System.Windows.Automation.RangeValuePattern]::Pattern) }
              $vals = @(); $bpart = $null; $presence = $false; $rising = $false; $lens = @()
              for ($i = 0; $i -lt 20 -and -not ($presence -and $rising); $i++) {
                Start-Sleep 3
                $p = @(Dl-Files 'payload.bin.part' | Where-Object { $before -notcontains $_.FullName })
                if ($p.Count) { $bpart = $p[0].FullName; $presence = $true; $lens += $p[0].Length }
                if ($rvB) { $vals += $rvB.Current.Value }
                if ($vals.Count -ge 2 -and $vals[-1] -gt $vals[0]) { $rising = $true }
              }
              Shot 'feat-B1-transfer.png'
              Record 'B-part-presence' ($presence ? 'PASS' : 'FAIL') "exact .part path observed: $bpart (reported Length samples, informational only: $($lens -join ', '))"
              Record 'B-ui-progress' ($rising ? 'PASS' : ($rvB ? 'FAIL' : 'AUTOMATION-GAP')) "strip RangeValue samples: $($vals -join ', ')"
              if (-not $presence) { $failures++ }
              if ($presence) {
                try {
                  $cancel = Find-ById $win 'DownloadStripCancel' 10
                  if (-not $cancel) { throw 'DownloadStripCancel not found' }
                  $cancel.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
                  Write-Host 'Cancel invoked on active B transfer'
                  $termText = $false; $gone = $false
                  for ($i = 0; $i -lt 30 -and -not ($termText -and $gone); $i++) {
                    Start-Sleep 1
                    $d = Find-ById $win 'DownloadStripDetail' 1
                    if ($d -and $d.Current.Name -eq 'Cancelled - partial file removed') { $termText = $true }
                    if (-not (Test-Path -LiteralPath $bpart)) { $gone = $true }
                  }
                  Shot 'feat-B2-after-cancel.png'
                  $folder = Split-Path $bpart -Parent
                  $listing = (Get-ChildItem $folder -Force -ErrorAction SilentlyContinue | ForEach-Object { "$($_.Name)[$($_.Length)]" }) -join ', '
                  $finalB = Test-Path -LiteralPath (Join-Path $folder 'payload.bin')
                  Record 'B-cancel-cleanup' (($termText -and $gone -and -not $finalB) ? 'PASS' : 'FAIL') "strip cancelled text observed=$termText; exact .part gone=$gone ($bpart); final payload.bin for B present=$finalB; B folder listing after cancel: [$listing]"
                  if (-not ($termText -and $gone -and -not $finalB)) { $failures++ }
                  $aStill = @(Dl-Files 'payload.bin' | Where-Object { $before -contains $_.FullName }).Count
                  Record 'B-cancel-A-intact' ($aStill -ge 1 ? 'PASS' : 'FAIL') "A completed file still present after B cancel: count=$aStill"
                  if ($aStill -lt 1) { $failures++ }
                  Start-Sleep 5
                  $stillActive = [bool](@(Dl-Files 'payload.bin.part' | Where-Object { $before -notcontains $_.FullName }).Count)
                  Record 'B-no-resurrect' (-not $stillActive ? 'PASS' : 'FAIL') "no new .part reappeared 5s after cancel: $(-not $stillActive)"
                  if ($stillActive) { $failures++ }
                } catch { Record 'B-cancel-cleanup' 'FAIL' $_.Exception.Message; $failures++ }
              }
            } else { Record 'B-cancel-cleanup' 'SKIPPED' "stage=$stB"; $failures++ }

            # ---- Phase C: two CONCURRENT downloads (different servers), cancel ONE from the Downloads flyout ----
            $cDir = Join-Path $dlRoot '66666666-6666-6666-6666-666666666668'
            $dDir = Join-Path $dlRoot '66666666-6666-6666-6666-666666666669'
            $cPart = Join-Path $cDir 'payload.bin.part'; $dPart = Join-Path $dDir 'payload.bin.part'
            try { $bk0 = Find-Named $win $CT::Button 'Back' 4; if ($bk0) { $bk0.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke(); Start-Sleep 2 } } catch { Write-Host "back before C: $($_.Exception.Message)" }
            $stC = Start-Download 'Fixture Download C (synthetic)' 'C'
            $stD = 'none'
            if ($stC -eq 'dialog-answered') {
              try { $bk = Find-Named $win $CT::Button 'Back' 5; if ($bk) { $bk.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke(); Start-Sleep 2 } } catch { Write-Host "back after C: $($_.Exception.Message)" }
              $stD = Start-Download 'Fixture Download D (synthetic)' 'D'
            }
            if ($stC -eq 'dialog-answered' -and $stD -eq 'dialog-answered') {
              Start-Sleep 12
              $both = (Test-Path -LiteralPath $cPart) -and (Test-Path -LiteralPath $dPart)
              $stripBtn = Find-ById $win 'DownloadStripCancel' 5
              $stripName = if ($stripBtn) { $stripBtn.Current.Name } else { 'not found' }
              Shot 'feat-C1-two-active.png'
              Record 'C-both-active' ($both ? 'PASS' : 'FAIL') "C part present=$(Test-Path -LiteralPath $cPart) at $cPart; D part present=$(Test-Path -LiteralPath $dPart) at $dPart; strip cancel button name='$stripName' (expect 'Cancel all' with 2 active)"
              if (-not $both) { $failures++ }
              Record 'C-strip-label' ($stripName -eq 'Cancel all' ? 'PASS' : 'FAIL') "strip button name='$stripName'"
              if ($stripName -ne 'Cancel all') { $failures++ }
              # Open the Downloads flyout and press the per-entry Cancel of row C only.
              $listBtn = Find-ById $win 'DownloadStripList' 5
              $cancelledC = $false
              if ($listBtn) {
                try { $listBtn.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke() } catch { Write-Host "flyout invoke: $($_.Exception.Message)" }
                Start-Sleep 3
                Shot 'feat-C2-flyout.png'
                $walker = [System.Windows.Automation.TreeWalker]::ControlViewWalker
                $btns = @()
                foreach ($r in @($win, [System.Windows.Automation.AutomationElement]::RootElement)) {
                  $found = $r.FindAll([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.AndCondition((New-Object System.Windows.Automation.PropertyCondition($AE::ControlTypeProperty, $CT::Button)), (New-Object System.Windows.Automation.PropertyCondition($AE::NameProperty, 'Cancel')))))
                  foreach ($f in $found) { if ($f.Current.AutomationId -ne 'DownloadStripCancel') { $btns += $f } }
                  if ($btns.Count -gt 0) { break }
                }
                $target = $null
                # Pair the row-C title Text with the Cancel button on the SAME visual row (nearest vertical centre).
                $cTitle = $null
                foreach ($rr in @($win, [System.Windows.Automation.AutomationElement]::RootElement)) {
                  $tx = $rr.FindAll([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.PropertyCondition($AE::NameProperty, 'Fixture Download C (synthetic)')))
                  foreach ($t in $tx) { if ($t.Current.ControlType -eq $CT::Text -and -not $t.Current.IsOffscreen -and ($t.Current.BoundingRectangle.Y -gt 200)) { $cTitle = $t } }
                  if ($cTitle) { break }
                }
                if ($cTitle) {
                  $ty = $cTitle.Current.BoundingRectangle.Y + $cTitle.Current.BoundingRectangle.Height / 2
                  $best = 1e9
                  foreach ($bt in $btns) { $br = $bt.Current.BoundingRectangle; $dy = [math]::Abs(($br.Y + $br.Height / 2) - $ty); if ($dy -lt $best) { $best = $dy; $target = $bt } }
                  Write-Host "row C title y=$ty nearest cancel dy=$best"
                }
                $ftexts = @(); try { $ff = ([System.Windows.Automation.AutomationElement]::RootElement).FindAll([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.PropertyCondition($AE::ControlTypeProperty, $CT::Text))); foreach ($e in $ff) { $n = $e.Current.Name; if ($n -match 'Fixture Download|Downloading|MB|Saved|Cancel|Downloads') { $ftexts += $n } } } catch {}
                ($ftexts | Select-Object -Unique) -join ' || ' | Out-File 'result-texts-C-flyout.txt'
                Record 'C-flyout-rows' (($btns.Count -ge 2) ? 'PASS' : 'FAIL') "per-entry Cancel buttons found (excluding strip): $($btns.Count); row C button located=$([bool]$target)"
                if ($btns.Count -lt 2) { $failures++ }
                if ($target) { $target.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke(); $cancelledC = $true }
              } else { Record 'C-flyout-rows' 'AUTOMATION-GAP' 'Downloads button not found' }
              if ($cancelledC) {
                $cGone = $false; $dAlways = $true
                for ($i = 0; $i -lt 30 -and -not $cGone; $i++) {
                  Start-Sleep 1
                  if (-not (Test-Path -LiteralPath $cPart)) { $cGone = $true }
                  if (-not (Test-Path -LiteralPath $dPart) -and -not (Test-Path -LiteralPath (Join-Path $dDir 'payload.bin'))) { $dAlways = $false }
                }
                Shot 'feat-C3-after-one-cancel.png'
                $cList = (Get-ChildItem $cDir -Force -ErrorAction SilentlyContinue | ForEach-Object Name) -join ', '
                Record 'C-cancel-one' (($cGone -and -not (Test-Path -LiteralPath (Join-Path $cDir 'payload.bin'))) ? 'PASS' : 'FAIL') "C exact part gone=$cGone; C final absent; C folder listing: [$cList]"
                if (-not $cGone) { $failures++ }
                Record 'C-other-unharmed' ($dAlways ? 'PASS' : 'FAIL') "D part-or-final present at every 1s sample during the 30s after C cancel: $dAlways"
                if (-not $dAlways) { $failures++ }
                # D must run to a full, correctly sized, saved file.
                $dDone = $false
                for ($i = 0; $i -lt 70 -and -not $dDone; $i++) {
                  Start-Sleep 3
                  $df = Join-Path $dDir 'payload.bin'
                  if ((Test-Path -LiteralPath $df) -and (Get-Item -LiteralPath $df).Length -ge 20971520 -and -not (Test-Path -LiteralPath $dPart)) { $dDone = $true }
                }
                Shot 'feat-C4-D-complete.png'
                $dSize = if (Test-Path -LiteralPath (Join-Path $dDir 'payload.bin')) { (Get-Item -LiteralPath (Join-Path $dDir 'payload.bin')).Length } else { -1 }
                Record 'C-D-complete' ($dDone ? 'PASS' : 'FAIL') "D final size=$dSize (expect 20971520), D part gone=$(-not (Test-Path -LiteralPath $dPart))"
                if (-not $dDone) { $failures++ }
                Dump-Texts 'D-after'
                # ---- Retry: click Retry on the cancelled row C, expect a fresh full download ----
                try {
                  $cTitle2 = $null
                  foreach ($rr in @($win, [System.Windows.Automation.AutomationElement]::RootElement)) {
                    $tx2 = $rr.FindAll([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.PropertyCondition($AE::NameProperty, 'Fixture Download C (synthetic)')))
                    foreach ($t in $tx2) { if ($t.Current.ControlType -eq $CT::Text -and -not $t.Current.IsOffscreen -and ($t.Current.BoundingRectangle.Y -gt 200)) { $cTitle2 = $t } }
                    if ($cTitle2) { break }
                  }
                  $rbtns = @()
                  foreach ($rr in @($win, [System.Windows.Automation.AutomationElement]::RootElement)) {
                    $fr = $rr.FindAll([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.AndCondition((New-Object System.Windows.Automation.PropertyCondition($AE::ControlTypeProperty, $CT::Button)), (New-Object System.Windows.Automation.PropertyCondition($AE::NameProperty, 'Retry')))))
                    foreach ($f in $fr) { if (-not $f.Current.IsOffscreen) { $rbtns += $f } }
                    if ($rbtns.Count -gt 0) { break }
                  }
                  $rtarget = $null
                  if ($cTitle2 -and $rbtns.Count -gt 0) {
                    $ty2 = $cTitle2.Current.BoundingRectangle.Y + $cTitle2.Current.BoundingRectangle.Height / 2; $best2 = 1e9
                    foreach ($bt in $rbtns) { $br = $bt.Current.BoundingRectangle; $dy = [math]::Abs(($br.Y + $br.Height / 2) - $ty2); if ($dy -lt $best2) { $best2 = $dy; $rtarget = $bt } }
                  }
                  if (-not $rtarget) { Record 'R-retry' 'AUTOMATION-GAP' "Retry button for row C not located (retry buttons visible=$($rbtns.Count), titleFound=$([bool]$cTitle2))" }
                  else {
                    $rtarget.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
                    Write-Host 'Retry invoked on row C'
                    $partSeen = $false
                    for ($i = 0; $i -lt 20 -and -not $partSeen; $i++) { Start-Sleep 1; if (Test-Path -LiteralPath $cPart) { $partSeen = $true } }
                    Shot 'feat-R2-retry-running.png'
                    $cFinal = Join-Path $cDir 'payload.bin'; $cDone = $false
                    for ($i = 0; $i -lt 70 -and -not $cDone; $i++) {
                      Start-Sleep 3
                      if ((Test-Path -LiteralPath $cFinal) -and (Get-Item -LiteralPath $cFinal).Length -ge 20971520 -and -not (Test-Path -LiteralPath $cPart)) { $cDone = $true }
                    }
                    $cSize = if (Test-Path -LiteralPath $cFinal) { (Get-Item -LiteralPath $cFinal).Length } else { -1 }
                    Shot 'feat-R3-retry-complete.png'
                    Dump-Texts 'C-after-retry'
                    Record 'R-retry' (($partSeen -and $cDone) ? 'PASS' : 'FAIL') "Retry clicked on row C; new .part seen=$partSeen; final size=$cSize (expect 20971520); .part gone=$(-not (Test-Path -LiteralPath $cPart))"
                    if (-not ($partSeen -and $cDone)) { $failures++ }
                  }
                } catch { Record 'R-retry' 'FAIL' $_.Exception.Message; $failures++ }
                $cr = Find-Named $win $CT::Button 'Retry' 2
                $frows = ($ftexts | Select-Object -Unique) -join ' || '
                Record 'C-flyout-state' 'RECORDED' "Retry button present on flyout at idle=[$([bool]$cr)]; flyout texts at cancel time: $frows"
                try { [System.Windows.Forms.SendKeys]::SendWait('{ESC}') } catch {}
              }
            } else { Record 'C-both-active' 'SKIPPED' "stages C=$stC D=$stD"; $failures++ }

            # ---- Checksum wiring: matching list promotes the file, deliberately wrong list is rejected ----
            try {
              try { $bk1 = Find-Named $win $CT::Button 'Back' 3; if ($bk1) { $bk1.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke(); Start-Sleep 2 } } catch {}
              $eDir = Join-Path $dlRoot '66666666-6666-6666-6666-66666666666a'; $fDir = Join-Path $dlRoot '66666666-6666-6666-6666-66666666666b'
              $stE = Start-Download 'Fixture Checksum OK (synthetic)' 'E'
              if ($stE -eq 'dialog-answered') {
                $eFinal = Join-Path $eDir 'payload.bin'; $ePart = Join-Path $eDir 'payload.bin.part'; $eDone = $false
                for ($i = 0; $i -lt 70 -and -not $eDone; $i++) {
                  Start-Sleep 3
                  if ((Test-Path -LiteralPath $eFinal) -and (Get-Item -LiteralPath $eFinal).Length -ge 20971520 -and -not (Test-Path -LiteralPath $ePart)) { $eDone = $true }
                }
                Shot 'feat-E1-checksum-match.png'
                $eSize = if (Test-Path -LiteralPath $eFinal) { (Get-Item -LiteralPath $eFinal).Length } else { -1 }
                Record 'E-checksum-match' ($eDone ? 'PASS' : 'FAIL') "matching SHA-256 list: final size=$eSize (expect 20971520); .part gone=$(-not (Test-Path -LiteralPath $ePart)); verified-vs-not is read from the app log"
                if (-not $eDone) { $failures++ }
                Dump-Texts 'E-after'
              } else { Record 'E-checksum-match' 'SKIPPED' "stage=$stE"; $failures++ }
              try { $bk2 = Find-Named $win $CT::Button 'Back' 4; if ($bk2) { $bk2.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke(); Start-Sleep 2 } } catch {}
              $stF = Start-Download 'Fixture Checksum Bad (synthetic)' 'F'
              if ($stF -eq 'dialog-answered') {
                $fFinal = Join-Path $fDir 'payload.bin'; $fPart = Join-Path $fDir 'payload.bin.part'; $fSeen = $false; $fEnded = $false
                for ($i = 0; $i -lt 90 -and -not $fEnded; $i++) {
                  Start-Sleep 3
                  if (Test-Path -LiteralPath $fPart) { $fSeen = $true }
                  if ($fSeen -and -not (Test-Path -LiteralPath $fPart)) { $fEnded = $true }
                  if (Test-Path -LiteralPath $fFinal) { $fEnded = $true }
                }
                Start-Sleep 3
                Shot 'feat-F1-checksum-bad.png'
                $fFinalPresent = Test-Path -LiteralPath $fFinal
                $fList = (Get-ChildItem $fDir -Force -ErrorAction SilentlyContinue | ForEach-Object Name) -join ', '
                Record 'F-checksum-mismatch' (($fSeen -and $fEnded -and -not $fFinalPresent) ? 'PASS' : 'FAIL') "wrong SHA-256 list: .part seen=$fSeen; ended=$fEnded; final file present=$fFinalPresent; folder listing: [$fList]"
                if (-not ($fSeen -and $fEnded -and -not $fFinalPresent)) { $failures++ }
                Dump-Texts 'F-after'
              } else { Record 'F-checksum-mismatch' 'SKIPPED' "stage=$stF"; $failures++ }
            } catch { Record 'E-F-checksum' 'FAIL' $_.Exception.Message; $failures++ }

            # ---- Summary states on the Apps page: filter via the search box so only chosen rows are visible ----
            function Set-Search($text) {
              $edits = $win.FindAll([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.PropertyCondition($AE::ControlTypeProperty, $CT::Edit)))
              foreach ($ed in $edits) {
                if ($ed.GetCurrentPropertyValue($AE::IsValuePatternAvailableProperty)) { $ed.GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern).SetValue($text); return $true }
              }
              return $false
            }
            function Summary-Text() {
              $all = $win.FindAll([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.PropertyCondition($AE::ControlTypeProperty, $CT::Text)))
              $out = @(); foreach ($e in $all) { $n = $e.Current.Name; if ($n -match '^\d+ apps') { $out += $n } }
              return ($out -join ' | ')
            }
            try {
              $nav = Find-ById $win 'Nav_apps' 5
              if ($nav) { try { $nav.GetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern).Select() } catch { try { $nav.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke() } catch {} } }
              Start-Sleep 3
              $store = Join-Path $env:LOCALAPPDATA 'ObtainiumPC\apps.json'
              $doc = @(Get-Content $store -Raw | ConvertFrom-Json)
              $cur = $doc | Where-Object { $_.name -eq 'Current Sample' } | Select-Object -First 1
              $unk = $doc | Where-Object { $_.name -eq 'Unknown Status Sample' } | Select-Object -First 1
              Record 'S-store' 'RECORDED' "Current Sample installed=$($cur.installedVersion) latest=$($cur.latestVersion) fails=$($cur.consecutiveFailedChecks); Unknown Status Sample installed=$($unk.installedVersion) latest=[$($unk.latestVersion)] lastCheck=[$($unk.lastUpdateCheck)] fails=$($unk.consecutiveFailedChecks)"
              $ok1 = Set-Search 'Current Sample'; Start-Sleep 3; $t1 = Summary-Text; Shot 'feat-S1-current-only.png'
              $curCurrent = ($cur.latestVersion -and $cur.installedVersion -eq $cur.latestVersion)
              if ($ok1 -and $curCurrent) { Record 'S-all-up-to-date' (($t1 -match 'all up to date') ? 'PASS' : 'FAIL') "search set=$ok1; only the installed+current row visible; summary: [$t1]"; if ($t1 -notmatch 'all up to date') { $failures++ } }
              else { Record 'S-all-up-to-date' 'NOT-EXERCISED' "search set=$ok1; Current Sample installed=$($cur.installedVersion) latest=$($cur.latestVersion) (upstream latest moved, so the row is not current); summary: [$t1]" }
              $ok2 = Set-Search 'Unknown Status'; Start-Sleep 3; $t2 = Summary-Text; Shot 'feat-S2-unknown-only.png'
              Record 'S-unknown-status' (($ok2 -and $t2 -match 'unknown status') ? 'PASS' : 'FAIL') "search set=$ok2; summary: [$t2]"
              if (-not ($ok2 -and $t2 -match 'unknown status')) { $failures++ }
              Set-Search '' | Out-Null; Start-Sleep 2
            } catch { Record 'S-summary' 'FAIL' $_.Exception.Message; $failures++ }

            # ---- About page: logo and version shown ----
            try {
              $navS = Find-ById $win 'Nav_settings' 5
              if ($navS) { try { $navS.GetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern).Select() } catch { try { $navS.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke() } catch {} } }
              Start-Sleep 3
              $aboutItem = Find-Named $win $CT::ListItem 'About' 5
              if ($aboutItem) { try { $aboutItem.GetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern).Select() } catch {} ; Start-Sleep 2 }
              $vEl = Find-ById $win 'AboutVersion' 8
              $lEl = Find-ById $win 'AboutLogo' 3
              try { if ($vEl) { $vEl.GetCurrentPattern([System.Windows.Automation.ScrollItemPattern]::Pattern).ScrollIntoView() } } catch { Write-Host "scrollintoview: $($_.Exception.Message)" }
              Start-Sleep 1
              try { if ($lEl) { $lEl.GetCurrentPattern([System.Windows.Automation.ScrollItemPattern]::Pattern).ScrollIntoView() } } catch {}
              Start-Sleep 2
              Shot 'feat-ABOUT1.png'
              $vName = if ($vEl) { $vEl.Current.Name } else { '' }
              $lRect = if ($lEl) { $lEl.Current.BoundingRectangle.ToString() } else { 'not found' }
              $exeVer = try { $proc.MainModule.FileVersionInfo.FileVersion } catch { "n/a" }
              Record 'about-identity' (($vEl -and $vName -match '2\.0\.0') ? 'PASS' : 'FAIL') "About version text=[$vName]; logo element rect=[$lRect]; exe FileVersion=[$exeVer]; list item found=$([bool]$aboutItem)"
              if (-not ($vEl -and $vName -match '2\.0\.0')) { $failures++ }
            } catch { Record 'about-identity' 'FAIL' $_.Exception.Message; $failures++ }

            # ---- Close to tray, then restore FROM THE TRAY ICON ----
            try {
              $proc.Refresh(); $hwnd = $proc.MainWindowHandle
              $proc.CloseMainWindow() | Out-Null
              Start-Sleep 8
              $hvalid = [Win32.NativeMethods]::IsWindow($hwnd); $vis = [Win32.NativeMethods]::IsWindowVisible($hwnd)
              Record 'close-visibility' (($hvalid -and -not $vis) ? 'PASS' : 'FAIL') "IsWindow=$hvalid IsWindowVisible=$vis"
              if (-not ($hvalid -and -not $vis)) { $failures++ }
              $alive = [bool](Get-Process -Name ObtainiumPC -ErrorAction SilentlyContinue)
              Record 'close-survival' ($alive ? 'PASS' : 'FAIL') "alive=$alive"
              if (-not $alive) { $failures++ }
            } catch { Record 'close-visibility' 'FAIL' $_.Exception.Message; $failures++ }
            Shot 'feat-T1-tray-hidden.png'
            try {
              try { (New-Object -ComObject Shell.Application).MinimizeAll(); Start-Sleep 2 } catch { Write-Host "minimize failed: $($_.Exception.Message)" }
              $root = [System.Windows.Automation.AutomationElement]::RootElement
              function Find-Tray {
                $all = $root.FindAll([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.PropertyCondition($AE::ControlTypeProperty, $CT::Button)))
                foreach ($e in $all) { if ($e.Current.Name -match 'Obtainium') { return $e } }
                return $null
              }
              function Click-El($e) {
                $r = $e.Current.BoundingRectangle
                if ($r.IsEmpty) { return $false }
                [Win32.NativeMethods]::SetCursorPos([int]($r.X + $r.Width/2), [int]($r.Y + $r.Height/2)) | Out-Null
                Start-Sleep -Milliseconds 300
                [Win32.NativeMethods]::mouse_event(2,0,0,0,[IntPtr]::Zero); [Win32.NativeMethods]::mouse_event(4,0,0,0,[IntPtr]::Zero)
                return $true
              }
              $tray = Find-Tray; $how = 'direct tray button'
              if (-not $tray) {
                $chev = $null
                foreach ($e in $root.FindAll([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.PropertyCondition($AE::ControlTypeProperty, $CT::Button)))) { if ($e.Current.Name -match 'Show Hidden|Notification Chevron|Hidden Icons') { $chev = $e; break } }
                if ($chev) { Click-El $chev | Out-Null; Start-Sleep 2; $tray = Find-Tray; $how = 'overflow chevron then icon' }
              }
              if (-not $tray) {
                Shot 'feat-T2-no-tray.png'
                Record 'tray-restore' 'AUTOMATION-GAP' 'tray icon button named Obtainium not found via UIA (direct or overflow) - automation limitation, not an app verdict'
              } else {
                $okc = Click-El $tray
                Start-Sleep 4
                $proc.Refresh(); $h2 = $proc.MainWindowHandle
                $vis2 = ($h2 -ne [IntPtr]::Zero) -and [Win32.NativeMethods]::IsWindowVisible($h2)
                if (-not $vis2) { Click-El $tray | Out-Null; Click-El $tray | Out-Null; Start-Sleep 4; $proc.Refresh(); $h2 = $proc.MainWindowHandle; $vis2 = ($h2 -ne [IntPtr]::Zero) -and [Win32.NativeMethods]::IsWindowVisible($h2) }
                Shot 'feat-T3-after-tray-click.png'
                Record 'tray-restore' ($vis2 ? 'PASS' : 'FAIL') "tray icon found via $how, clicked=$okc; main window visible after click=$vis2 (hwnd before=$hwnd after=$h2)"
                if (-not $vis2) { $failures++ }
              }
            } catch { Record 'tray-restore' 'FAIL' $_.Exception.Message; $failures++ }
            Shot 'feat-s4-final.png'
          }
          finally {
            'process teardown AFTER all observables (labeled teardown, distinct from the app-level cancel path)' | Out-File teardown.txt
            Get-Process -Name ObtainiumPC -ErrorAction SilentlyContinue | Stop-Process -Force
            'teardown: process stopped'
          }
          if ($failures -gt 0) { throw "$failures observable(s) FAILED - see result-*.txt" }
          if ($completedEarly -and -not $coreExercised) { $coreExercised = $true }
          if (-not $coreExercised) { throw 'verification INCOMPLETE: download/cancel core path was not exercised (see result-*.txt for AUTOMATION-GAP/SKIPPED) - no app verdict implied' }
          'all exercised observables passed, core download+cancel path verified - see result-*.txt'
      - name: 'Relaunch after FORCED stop (crash-style, not a graceful exit): no stale state'
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          $AE = [System.Windows.Automation.AutomationElement]; $CT = [System.Windows.Automation.ControlType]
          Get-Process -Name ObtainiumPC -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 3
          $p = Start-Process $env:EXE_PATH -PassThru
          Start-Sleep 45
          $alive = [bool](Get-Process -Id $p.Id -ErrorAction SilentlyContinue)
          $root = Join-Path $env:USERPROFILE 'Downloads\ObtainiumPC'
          $files = (Get-ChildItem $root -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object { "$($_.FullName.Substring($root.Length))[$($_.Length)]" }) -join '; '
          $partsLeft = @(Get-ChildItem $root -Recurse -File -Filter '*.part' -ErrorAction SilentlyContinue).Count
          $proc = Get-Process -Name ObtainiumPC -ErrorAction SilentlyContinue | Select-Object -First 1
          $texts = ''
          $strip = 'n/a'
          if ($proc -and $proc.MainWindowHandle -ne [IntPtr]::Zero) {
            $win = $AE::FromHandle($proc.MainWindowHandle)
            $all = $win.FindAll([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.PropertyCondition($AE::ControlTypeProperty, $CT::Text)))
            $n = @(); foreach ($e in $all) { $n += $e.Current.Name }; $texts = $n -join ' || '
            $st = $win.FindFirst([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.PropertyCondition($AE::AutomationIdProperty, 'DownloadStrip')))
            $strip = if ($st) { 'strip element present (offscreen=' + $st.Current.IsOffscreen + ')' } else { 'strip element absent' }
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds; $bm = New-Object System.Drawing.Bitmap $b.Width, $b.Height; $g = [System.Drawing.Graphics]::FromImage($bm); $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size); $bm.Save('feat-R1-after-relaunch.png')
          }
          $store = Join-Path $env:LOCALAPPDATA 'ObtainiumPC\apps.json'
          Copy-Item $store feat-store-relaunch.json -ErrorAction SilentlyContinue
          $out = @("relaunch alive=$alive", "files under Downloads\ObtainiumPC: $files", "leftover .part files: $partsLeft", "download strip after relaunch: $strip", "UI texts: $texts")
          $out | Out-File result-relaunch.txt
          $out | ForEach-Object { $_ }
          Get-Process -Name ObtainiumPC -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: Upload feature evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feat-preview-out
          path: |
            feat-*.png
            feat-store-after-check.json
            feat-store-relaunch.json
            result-*.txt
            cancel-result.txt
            teardown.txt
          if-no-files-found: warn
      - name: Copy app log
        if: always()
        shell: pwsh
        run: |
          $log = Join-Path $env:LOCALAPPDATA 'ObtainiumPC\logs.jsonl'
          if (Test-Path $log) { Copy-Item $log feat-app-log.jsonl; 'app log copied' } else { 'no app log found' }
      - name: Upload log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feat-preview-log
          path: feat-app-log.jsonl
          if-no-files-found: warn
  exportcheck:
    if: inputs.target == 'runner' && inputs.artifact_run_id != '' && inputs.feat_check == 'export'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
      REPO: ${{ github.repository }}
    steps:
      - name: Export default OFF then opt-in ON on the exact build (synthetic secrets only)
        shell: pwsh
        run: |
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes, System.Windows.Forms, System.Drawing
          Add-Type -Name W -Namespace Win32 -MemberDefinition '[System.Runtime.InteropServices.DllImport("user32.dll")] public static extern bool ShowWindow(System.IntPtr h, int c); [System.Runtime.InteropServices.DllImport("user32.dll")] public static extern bool SetForegroundWindow(System.IntPtr h); [System.Runtime.InteropServices.DllImport("user32.dll")] public static extern bool GetWindowRect(System.IntPtr h, out RECT r); public struct RECT { public int L, T, R, B; }'
          $AEL = [System.Windows.Automation.AutomationElement]
          $info = gh run view $env:ARTIFACT_RUN_ID -R $env:REPO --json headSha,conclusion | ConvertFrom-Json
          "artifact run $env:ARTIFACT_RUN_ID head=$($info.headSha) conclusion=$($info.conclusion)" | Tee-Object -FilePath export-info.txt
          gh run download $env:ARTIFACT_RUN_ID -R $env:REPO -n ObtainiumPC-win-x64 -D artifact
          $exe = Get-ChildItem artifact -Recurse -Filter ObtainiumPC.exe | Select-Object -First 1
          $dir = Join-Path $env:LOCALAPPDATA 'ObtainiumPC'; New-Item -ItemType Directory -Force $dir | Out-Null
          $hdr = '[{"requestHeader":"Authorization: Bearer synthetic-header-authz"},{"requestHeader":"Cookie: session=synthetic-header-cookie"}]'
          $add = @{ 'github-creds' = 'synthetic-app-cred'; requestHeader = (ConvertFrom-Json $hdr) } | ConvertTo-Json -Compress -Depth 5
          $apps = @(@{ id = 'seed-exp'; url = 'http://127.0.0.1:1/'; author = 'local'; name = 'expapp'; overrideSource = 'HTML'
            apkUrls = '[]'; otherAssetUrls = '[]'; preferredApkIndex = 0; additionalSettings = $add; categories = @(); pinned = $false; disabled = $false; installedVersion = '0.1.0' })
          ConvertTo-Json -InputObject $apps -Depth 6 | Set-Content (Join-Path $dir 'apps.json')
          $aef = Join-Path $dir 'auto-export.json'
          $settings = @{ FirstRunHandled = $true; UpdateIntervalMinutes = 360; CheckOnStart = $true; NotifyUpdates = $false; GitHubPersonalAccessToken = 'synthetic-gh-token'; GitLabPersonalAccessToken = 'synthetic-gl-token'; ForgejoPersonalAccessToken = 'synthetic-fj-token'; AutoExportOnChanges = $true; AutoExportPath = $aef }
          ($settings | ConvertTo-Json) | Set-Content (Join-Path $dir 'settings.json')
          function Probe($label) {
            if (-not (Test-Path $aef)) { throw "$label : auto-export file missing" }
            $t = [IO.File]::ReadAllText($aef)
            "$label file length: $($t.Length)" | Add-Content export-info.txt
            $r = [ordered]@{}
            foreach ($k in 'synthetic-gh-token','synthetic-gl-token','synthetic-fj-token','synthetic-app-cred','synthetic-header-authz','synthetic-header-cookie','seed-exp') { $r[$k] = ($t.IndexOf($k) -ge 0) }
            ($label + ': ' + (($r.GetEnumerator() | % { "$($_.Key)=$($_.Value)" }) -join '; ')) | Add-Content export-info.txt
            $script:last = $r
          }
          function Launch() {
            $p = Start-Process $exe.FullName -PassThru
            for ($i=0; $i -lt 40; $i++) { Start-Sleep 2; if (Test-Path $aef) { break } }
            Start-Sleep 5
            if (-not (Get-Process -Id $p.Id -ErrorAction SilentlyContinue)) { throw 'app exited' }
            return $p
          }
          function Shoot($name) {
            $h = [IntPtr]::Zero
            for ($w=0; $w -lt 40; $w++) { $proc = Get-Process -Name ObtainiumPC | Select-Object -First 1; $h = $proc.MainWindowHandle; if ($h -ne [IntPtr]::Zero) { break }; Start-Sleep 2 }
            "window handle ($name): $h" | Add-Content export-info.txt
            (New-Object -ComObject Shell.Application).MinimizeAll(); Start-Sleep 1
            [Win32.W]::ShowWindow($h, 9) | Out-Null; [Win32.W]::ShowWindow($h, 3) | Out-Null; [Win32.W]::SetForegroundWindow($h) | Out-Null; Start-Sleep 2
            $win = $AEL::FromHandle($h)
            $nav = $win.FindFirst([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.PropertyCondition($AEL::AutomationIdProperty, 'Nav_importexport')))
            try { $nav.GetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern).Select() } catch { try { $nav.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke() } catch {} }
            Start-Sleep 3
            $tog = $win.FindFirst([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.PropertyCondition($AEL::AutomationIdProperty, 'IncludeCredsToggle')))
            $state = 'toggle not found'
            if ($tog) { try { $state = $tog.GetCurrentPattern([System.Windows.Automation.TogglePattern]::Pattern).Current.ToggleState } catch { $state = 'no toggle pattern' } }
            "toggle ($name) name=[$(if ($tog) { $tog.Current.Name })] state=$state" | Add-Content export-info.txt
            $r = New-Object Win32.W+RECT; [Win32.W]::GetWindowRect($h, [ref]$r) | Out-Null
            $w = $r.R - $r.L; $ht = $r.B - $r.T
            $cr = New-Object System.Drawing.Bitmap $w, $ht
            $g2 = [System.Drawing.Graphics]::FromImage($cr); $g2.CopyFromScreen($r.L, $r.T, 0, 0, (New-Object System.Drawing.Size $w, $ht))
            $cr.Save("export-$name.png")
            $script:tog = $tog
          }
          # ---- OFF (default) ----
          $null = Launch
          Probe 'OFF auto-export'; $off = $script:last
          Shoot 'off'; $tog = $script:tog
          $fail = @()
          foreach ($k in 'synthetic-gh-token','synthetic-gl-token','synthetic-fj-token','synthetic-app-cred') { if ($off[$k]) { $fail += "OFF leaked $k" } }
          if (-not $off['seed-exp']) { $fail += 'OFF export missing the app' }
          # ---- opt in through the UI, restart, auto-export again ----
          if ($tog) { try { $tog.GetCurrentPattern([System.Windows.Automation.TogglePattern]::Pattern).Toggle() } catch { $fail += 'toggle click failed' } }
          Start-Sleep 3
          [Win32.W]::SetForegroundWindow((Get-Process -Name ObtainiumPC | Select-Object -First 1).MainWindowHandle) | Out-Null
          Shoot 'on'
          $sj = Get-Content (Join-Path $dir 'settings.json') -Raw | ConvertFrom-Json
          "settings.json ExportIncludeCredentials after toggle: $($sj.ExportIncludeCredentials)" | Add-Content export-info.txt
          Stop-Process -Name ObtainiumPC -Force; Start-Sleep 3
          Remove-Item $aef -Force
          $null = Launch
          Probe 'ON auto-export'; $on = $script:last
          foreach ($k in 'synthetic-gh-token','synthetic-gl-token','synthetic-fj-token','synthetic-app-cred') { if (-not $on[$k]) { $fail += "ON missing $k" } }
          "FAILURES: $($fail -join ' | ')" | Add-Content export-info.txt
          if ($fail.Count -gt 0) { throw ($fail -join '; ') }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: export-check
          path: |
            export-*.png
            export-info.txt
  aboutshot:
