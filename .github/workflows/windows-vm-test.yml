          else { $v = FindId 'AboutVersion'; try { $v.GetCurrentPattern([System.Windows.Automation.ScrollItemPattern]::Pattern).ScrollIntoView() } catch {}; Start-Sleep 2 }
          [Win32.W]::SetForegroundWindow($h) | Out-Null; Start-Sleep 2
          $vEl = FindId 'AboutVersion'; $lEl = FindId 'AboutLogo'
          "version text=[$($vEl.Current.Name)] version rect=[$($vEl.Current.BoundingRectangle)] logo rect=[$($lEl.Current.BoundingRectangle)] offscreen(version)=$($vEl.Current.IsOffscreen)" | Tee-Object -FilePath about-info.txt -Append
          $r = New-Object Win32.W+RECT; [Win32.W]::GetWindowRect($h, [ref]$r) | Out-Null
          "window rect: $($r.L),$($r.T),$($r.R),$($r.B)" | Tee-Object -FilePath about-info.txt -Append
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
