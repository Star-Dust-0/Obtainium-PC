name: Live E2E (isolated runner)
on: workflow_dispatch
jobs:
  shuck:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Real Shuck download, silent install, detection
        env:
          OBT_LIVE_E2E: '1'
        run: dotnet test windows/ObtainiumPC.Tests/ObtainiumPC.Tests.csproj -c Release -p:Platform=x64 --filter "FullyQualifiedName~LiveShuckE2ETests" --logger "console;verbosity=detailed"
