name: UI smoke - portable ZIP version upgrade (manual)

on:
  push:
    branches: [v2-work]
    paths: ['.github/workflows/ui-smoke-zip-version.yml']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref to build'
        required: false
        default: 'v2-work'

permissions:
  contents: read

jobs:
  zip:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Report and verify the checked-out commit
        shell: bash
        run: |
          actual=$(git rev-parse HEAD)
          echo "CHECKED-OUT SHA: $actual (dispatched on $GITHUB_REF_NAME at $GITHUB_SHA; ref input: '${{ inputs.ref }}')"
          if [ -z "${{ inputs.ref }}" ] && [ "$actual" != "$GITHUB_SHA" ]; then echo "checked-out commit is not the dispatched commit"; exit 1; fi
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: microsoft/setup-msbuild@v2
      - name: Restore
        run: msbuild windows/ObtainiumPC.sln /t:Restore /p:Configuration=Release /p:Platform=x64
      - name: Build
        run: msbuild windows/ObtainiumPC.sln /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:SelfContained=true
      - name: Local release server and seeded app (two real zips, version 1.0.0 then 2.0.0)
        shell: pwsh
        run: |
          $srv = 'C:\srv'; New-Item -ItemType Directory -Force $srv | Out-Null
          function MakeZip($ver, $files) {
            $tmp = Join-Path $env:TEMP "z$ver"; Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue; New-Item -ItemType Directory -Force $tmp | Out-Null
            foreach ($k in $files.Keys) { if ($k -eq '__exe') { Copy-Item $files[$k] (Join-Path $tmp 'myapp.exe') } else { Set-Content (Join-Path $tmp $k) $files[$k] } }
            Compress-Archive -Path (Join-Path $tmp '*') -DestinationPath (Join-Path $srv "myapp-$ver.zip") -Force
          }
          MakeZip '1.0.0' @{ '__exe'='C:\Windows\System32\whoami.exe'; 'run.txt'='v1'; 'old-only.txt'='gone in v2'; 'config.ini'='default=1' }
          MakeZip '2.0.0' @{ '__exe'='C:\Windows\System32\hostname.exe'; 'run.txt'='v2'; 'new.txt'='added in v2'; 'config.ini'='default=2' }
          Set-Content (Join-Path $srv 'index.html') '<html><body><a href="http://127.0.0.1:8099/myapp-1.0.0.zip">myapp-1.0.0.zip</a></body></html>'
          @'
          $l = New-Object System.Net.HttpListener; $l.Prefixes.Add('http://127.0.0.1:8099/'); $l.Start()
          while ($true) {
            $c = $l.GetContext(); $path = $c.Request.Url.AbsolutePath.TrimStart('/'); if ($path -eq '') { $path = 'index.html' }
            $f = Join-Path 'C:\srv' $path
            if (Test-Path $f) { $b = [IO.File]::ReadAllBytes($f); $c.Response.ContentLength64 = $b.Length; $c.Response.OutputStream.Write($b,0,$b.Length) } else { $c.Response.StatusCode = 404 }
            $c.Response.Close()
          }
          '@ | Set-Content C:\srv\server.ps1
          Start-Process pwsh -ArgumentList '-NoProfile','-File','C:\srv\server.ps1' -WindowStyle Hidden
          Start-Sleep 2
          (Invoke-WebRequest http://127.0.0.1:8099/index.html -UseBasicParsing).Content
          $dir = Join-Path $env:LOCALAPPDATA 'ObtainiumPC'; New-Item -ItemType Directory -Force $dir | Out-Null
          $add = '{"customLinkFilterRegex":"myapp-.*\\.zip","versionExtractionRegEx":"(\\d+\\.\\d+\\.\\d+)","matchGroupToUse":"1"}'
          $apps = @(@{
            id = 'seed-myapp'; url = 'http://127.0.0.1:8099/'
            author = 'local'; name = 'myapp'; overrideSource = 'HTML'
            apkUrls = '[]'; otherAssetUrls = '[]'; preferredApkIndex = 0
            additionalSettings = $add; categories = @(); pinned = $false; disabled = $false
            installedVersion = '0.1.0'
          })
          ConvertTo-Json -InputObject $apps -Depth 6 | Set-Content (Join-Path $dir 'apps.json')
          $settings = @{ FirstRunHandled = $true; UpdateIntervalMinutes = 360; CheckOnStart = $true; NotifyUpdates = $false; GitHubPersonalAccessToken = 'synthetic-token-for-export-check'; AutoExportOnChanges = $true; AutoExportPath = (Join-Path $dir 'auto-export.json') }
          ($settings | ConvertTo-Json) | Set-Content (Join-Path $dir 'settings.json')
      - name: Real ZIP install, then upgrade in place
        shell: pwsh
        env:
          SMOKE_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing, UIAutomationClient, UIAutomationTypes
          New-Item -ItemType Directory -Force shots | Out-Null
          Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public static class DwmFrame { [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left, Top, Right, Bottom; } [DllImport("dwmapi.dll")] public static extern int DwmGetWindowAttribute(IntPtr hwnd, int attr, out RECT rect, int size); public const int DWMWA_EXTENDED_FRAME_BOUNDS = 9; }'
          Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public class M { [DllImport("user32.dll")] public static extern void mouse_event(uint f, uint dx, uint dy, uint d, int e); }'
          function Shot($name) {
            $b=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp=New-Object System.Drawing.Bitmap $b.Width,$b.Height
            $g=[System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen((New-Object System.Drawing.Point $b.X,$b.Y),[System.Drawing.Point]::Empty,(New-Object System.Drawing.Size $b.Width,$b.Height))
            $bmp.Save("shots/$name.png"); $g.Dispose(); $bmp.Dispose()
          }
          $exe = (Resolve-Path 'windows\ObtainiumPC\bin\x64\Release\net8.0-windows10.0.19041.0\win-x64\ObtainiumPC.exe').Path
          $root = [System.Windows.Automation.AutomationElement]::RootElement
          function ClickPartial($prefix, $scope) {
            # The bottom download strip repeats the app name ("shuck ..."): never click its elements. The list is
            # virtualized, so scroll the wheel a few times when the row is not realized yet.
            foreach ($pass in 0..24) {
              $all = $scope.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)
              foreach ($el in $all) {
                $n = $el.Current.Name
                if ($n -and $n.StartsWith($prefix)) {
                  if ($el.Current.AutomationId -like 'DownloadStrip*') { continue }
                  $r = $el.Current.BoundingRectangle
                  if ($el.Current.IsOffscreen) { continue }
                  if ($r.Width -gt 10 -and $r.Height -gt 10) {
                    [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point([int]($r.X + $r.Width/2), [int]($r.Y + $r.Height/2))
                    Start-Sleep -Milliseconds 300
                    [M]::mouse_event(0x02,0,0,0,0); [M]::mouse_event(0x04,0,0,0,0)
                    return $el
                  }
                }
              }
              if ($pass -lt 24) {
                $wr = $scope.Current.BoundingRectangle
                [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point([int]($wr.X + $wr.Width/2), [int]($wr.Y + $wr.Height/2))
                # first look upward (the list may already be scrolled down), then downward
                if ($pass -lt 10) { [M]::mouse_event(0x0800,0,0,[uint32]120,0) } else { [M]::mouse_event(0x0800,0,0,[uint32]4294967176,0) }
                Start-Sleep -Milliseconds 400
              }
            }
            Shot "missing-$($prefix -replace '[^\w]','_')"
            throw "element starting with '$prefix' not found"
          }
          function FindNamed($name, $scope) {
            $c = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, $name)
            # The bottom download strip repeats the app name of the last download: never let it satisfy a list lookup.
            foreach ($m in $scope.FindAll([System.Windows.Automation.TreeScope]::Descendants, $c)) {
              if ($m.Current.AutomationId -notlike 'DownloadStrip*') { return $m }
            }
            return $null
          }
          # The list is virtualized and the viewport is small: realize an off-screen row by wheel-scrolling.
          function ClickNamedIn($name, $scope) {
            # Retry: UIA lookups can race a page re-layout (one transient miss
            # after the health page refresh cost a full run).
            $el = $null
            foreach ($attempt in 1..6) {
              $navIds = @{ 'Apps'='Nav_apps'; 'التطبيقات'='Nav_apps'; 'Add App'='Nav_addapp'; 'Update Health'='Nav_updatehealth'; 'Import / Export'='Nav_importexport'; 'Logs'='Nav_logs'; 'Settings'='Nav_settings' }
              if ($navIds.ContainsKey($name)) {
                # Stable AutomationId (language independent, cannot collide with a page title).
                $ci = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::AutomationIdProperty, $navIds[$name])
                $el = $scope.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $ci)
                if ($el -ne $null) { break }
              }
              $c = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, $name)
              $el = $scope.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $c)
              if ($el -ne $null) { break }
              Start-Sleep 1
            }
            if ($el -eq $null) { Shot "missing-$($name -replace '[^\w]','_')"; throw "element '$name' not found" }
            try { $el.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke() } catch {
              $r = $el.Current.BoundingRectangle
              if ([double]::IsNaN($r.X) -or [double]::IsInfinity($r.X) -or $r.Width -le 0) {
                # Diagnostic: the first UIA match has no usable bounds. List every match and use the first visible one.
                $cc = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, $name)
                $all = $scope.FindAll([System.Windows.Automation.TreeScope]::Descendants, $cc)
                $pick = $null
                foreach ($m in $all) {
                  $mr = $m.Current.BoundingRectangle
                  "ClickNamedIn '$name' match: rect=$mr class=$($m.Current.ClassName) type=$($m.Current.ControlType.ProgrammaticName) autoId=$($m.Current.AutomationId) offscreen=$($m.Current.IsOffscreen)"
                  if ($pick -eq $null -and -not $m.Current.IsOffscreen -and -not [double]::IsInfinity($mr.X) -and $mr.Width -gt 0) { $pick = $m }
                }
                if ($pick -eq $null) { Shot "unclickable-$($name -replace '[^\w]','_')"; throw "element '$name' has no usable bounds ($($all.Count) matches)" }
                try { $pick.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke(); return } catch { $r = $pick.Current.BoundingRectangle }
              }
              [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point([int]($r.X + $r.Width/2), [int]($r.Y + $r.Height/2))
              Start-Sleep -Milliseconds 300
              [M]::mouse_event(0x02,0,0,0,0); [M]::mouse_event(0x04,0,0,0,0)
            }
          }
          function AssertAlive($tag) { $p.Refresh(); if ($p.HasExited) { Shot "exited-$tag"; throw "app exited at $tag (code $($p.ExitCode))" } }
          function PickAndDownload($zipName, [switch]$ExpectFailure, [switch]$WatchPhases) {
            ClickNamedIn 'Update' $win
            Start-Sleep 3
            $dlg = FindNamed 'Choose a file' $root
            if ($dlg -eq $null) { Shot 'zip-no-picker'; throw 'asset picker did not appear' }
            $picked = $false
            foreach ($el in $dlg.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)) {
              if ($el.Current.Name -like "*$zipName*" -and $el.Current.ControlType -eq [System.Windows.Automation.ControlType]::RadioButton) {
                $r = $el.Current.BoundingRectangle
                [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point([int]($r.X + $r.Width/2), [int]($r.Y + $r.Height/2))
                Start-Sleep -Milliseconds 300
                [M]::mouse_event(0x02,0,0,0,0); [M]::mouse_event(0x04,0,0,0,0)
                $picked = $true; break
              }
            }
            if (-not $picked) { Shot 'zip-asset-missing'; throw "zip asset $zipName not offered in the picker" }
            Shot 'z1-picker'
            Start-Sleep 1
            ClickNamedIn 'Download' $root
            if ($WatchPhases) {
              # The app was started with OBTAINIUM_PC_PHASE_HOLD_MS, so every phase after the last byte stays on screen for a few seconds.
              $script:phasesSeen = [ordered]@{}
              foreach ($i in 1..80) {
                Start-Sleep -Milliseconds 400
                $st = StripText
                foreach ($ph in 'Checking the file...', 'Saving...', 'Opening the installer...') {
                  if ($st -like "*$ph*" -and -not $script:phasesSeen.Contains($ph)) {
                    $script:phasesSeen[$ph] = $st
                    ShotWin ('phase-' + ($ph -replace '[^A-Za-z]', '').ToLower())
                    "phase strip: [$st]"
                  }
                }
                if ((FindNamed 'Extracted' $root) -ne $null) { break }
              }
            }
            if ($ExpectFailure) {
              # The merge cannot replace a locked file: no 'Extracted' dialog may appear.
              foreach ($i in 1..10) { Start-Sleep 3; if ((FindNamed 'Extracted' $root) -ne $null) { Shot 'failed-upgrade-reported-success'; throw 'a failed upgrade was reported as extracted' } }
              return
            }
            $ext = $null
            foreach ($i in 1..40) {
              Start-Sleep 3
              $ext = FindNamed 'Extracted' $root
              if ($ext -ne $null) { break }
            }
            if ($ext -eq $null) { Shot 'zip-no-extracted-dialog'; throw 'no Extracted dialog after the zip download' }
            Shot 'z2-extracted-dialog'
            $script:dialogText = ''
            foreach ($el in $root.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)) {
              if ($el.Current.Name -like '*extracted to:*') { $script:dialogText = $el.Current.Name; break }
            }
            "extracted dialog text: [$script:dialogText]"
            ClickNamedIn 'OK' $root
            Start-Sleep 2
          }
          function StartApp {
            $script:p = Start-Process $exe -PassThru
            Start-Sleep 12
            $script:p.Refresh()
            if ($script:p.HasExited) { Shot 'exited'; throw "app exited at launch" }
            $wcond = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ProcessIdProperty, $script:p.Id)
            $script:win = $root.FindFirst([System.Windows.Automation.TreeScope]::Children, $wcond)
            if ($script:win -eq $null) { throw 'main window not found' }
            Start-Sleep 30
          }
          $zipName = 'myapp-'
          $folder = 'C:\Obtainium\myapp'
          function ShotWin($name) {
            # Visible frame (DWM extended bounds), not the UIA rectangle that includes the invisible resize border.
            $x = 0; $y = 0; $w = 0; $h = 0
            $hwnd = [IntPtr]$win.Current.NativeWindowHandle
            $fr = New-Object DwmFrame+RECT
            if ($hwnd -ne [IntPtr]::Zero -and [DwmFrame]::DwmGetWindowAttribute($hwnd, [DwmFrame]::DWMWA_EXTENDED_FRAME_BOUNDS, [ref]$fr, 16) -eq 0) {
              $x = $fr.Left; $y = $fr.Top; $w = $fr.Right - $fr.Left; $h = $fr.Bottom - $fr.Top
            } else {
              $r = $win.Current.BoundingRectangle; $x = [int]$r.X; $y = [int]$r.Y; $w = [int]$r.Width; $h = [int]$r.Height
            }
            $bmp = New-Object System.Drawing.Bitmap $w, $h
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen((New-Object System.Drawing.Point $x, $y), [System.Drawing.Point]::Empty, (New-Object System.Drawing.Size $w, $h))
            $bmp.Save("shots/$name.png"); $g.Dispose(); $bmp.Dispose()
          }
          function StripText {
            $t = @()
            foreach ($el in $win.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)) {
              if ($el.Current.AutomationId -like 'DownloadStrip*' -and $el.Current.Name) { $t += $el.Current.Name }
            }
            return ($t -join ' | ')
          }
          function Snap($tag) { "== $tag =="; Get-ChildItem $folder -Recurse -Force | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 250 }
          function Installed() { foreach ($el in $win.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)) { if ($el.Current.Name -like 'Installed: *') { return $el.Current.Name } } }

          # ---- 1. version 1.0.0 ----
          StartApp
          ClickPartial 'myapp' $win | Out-Null
          Start-Sleep 3; AssertAlive 'detail'; Shot 'v0-detail'
          PickAndDownload $zipName
          Snap 'after 1.0.0'
          if ((Get-Content (Join-Path $folder 'run.txt') -Raw).Trim() -ne 'v1') { throw 'run.txt is not v1 after the first install' }
          "detail after 1.0.0: $(Installed)"
          if ((Installed) -notlike '*1.0.0*') { Shot 'v1-wrong'; throw 'app does not record 1.0.0 after the extract' }
          Set-Content (Join-Path $folder 'user-note.txt') 'keep me'
          Set-Content (Join-Path $folder 'config.ini') 'default=1`nuser=edited'
          Get-Process ObtainiumPC -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 3

          # ---- 2. publish 2.0.0 and upgrade through the UI ----
          $env:OBTAINIUM_PC_PHASE_HOLD_MS = '4000'   # test seam: hold each post-transfer phase 4 s so the strip text can be observed
          Set-Content 'C:\srv\index.html' '<html><body><a href="http://127.0.0.1:8099/myapp-2.0.0.zip">myapp-2.0.0.zip</a></body></html>'
          StartApp
          ClickPartial 'myapp' $win | Out-Null
          Start-Sleep 3; AssertAlive 'detail2'
          $lat = $null; foreach ($el in $win.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)) { if ($el.Current.Name -like 'Latest: *') { $lat = $el.Current.Name } }
          "before the upgrade: $(Installed) | $lat"
          if ($lat -notlike '*2.0.0*') { Shot 'v2-latest-wrong'; throw "latest is not 2.0.0 (got: $lat)" }
          Shot 'v2-before-upgrade'
          # ---- 2a. failed upgrade: a locked file must roll the folder back to exactly 1.0.0 ----
          $cfgBefore = Get-Content (Join-Path $folder 'config.ini') -Raw
          $exeBefore = (Get-Item (Join-Path $folder 'myapp.exe')).Length
          $lock = [IO.File]::Open((Join-Path $folder 'run.txt'), 'Open', 'Read', 'Read')
          try { PickAndDownload $zipName -ExpectFailure } finally { $lock.Dispose() }
          ShotWin 'v2-failed-upgrade-window'
          "after failed upgrade: installed=$(Installed)"
          $strip = StripText
          "download strip after failed upgrade: [$strip]"
          if ($strip -like '*Saved - not a Windows installer*' -or $strip -like '*Installed - *') { throw "the download strip reports success after a failed upgrade: $strip" }
          if ($strip -notlike '*Failed*') { throw "the download strip does not say the upgrade failed: [$strip]" }
          if ((Get-Content (Join-Path $folder 'run.txt') -Raw).Trim() -ne 'v1') { throw 'rollback: run.txt is not v1 after the failed upgrade' }
          if ((Get-Item (Join-Path $folder 'myapp.exe')).Length -ne $exeBefore) { throw 'rollback: myapp.exe changed after the failed upgrade' }
          if ((Get-Content (Join-Path $folder 'config.ini') -Raw) -ne $cfgBefore) { throw 'rollback: config.ini changed after the failed upgrade' }
          if (Test-Path (Join-Path $folder 'new.txt')) { throw 'rollback: a v2 file was left behind' }
          if (-not (Test-Path (Join-Path $folder 'old-only.txt'))) { throw 'rollback: a v1 file was lost' }
          if ((Installed) -notlike '*1.0.0*') { throw 'rollback: the app no longer records 1.0.0 after the failed upgrade' }
          $leftovers = @(Get-ChildItem 'C:\Obtainium' -Force | Where-Object { $_.Name -like '.staging-*' })
          if ($leftovers.Count -ne 0) { throw "rollback: staging folder left behind: $($leftovers.Name -join ', ')" }
          'failed upgrade rolled back to 1.0.0 intact'
          # ---- 2b. the same upgrade without the lock succeeds ----
          PickAndDownload $zipName -WatchPhases
          if (-not $script:phasesSeen.Contains('Checking the file...')) { throw 'the strip never showed "Checking the file..." after the last byte' }
          if (-not $script:phasesSeen.Contains('Saving...')) { throw 'the strip never showed "Saving..." after the last byte' }
          foreach ($k in $script:phasesSeen.Keys) { if ($script:phasesSeen[$k] -like '*MB of*') { throw "phase '$k' still showed the byte counter: $($script:phasesSeen[$k])" } }
          'post-transfer phases shown on the strip: ' + ($script:phasesSeen.Keys -join ', ')
          if ($script:dialogText -notlike '*config.ini*' -or $script:dialogText -notlike '*kept*') { throw "the extraction dialog did not list the kept user-edited config.ini (text: $script:dialogText)" }
          'kept-files list shown in the dialog'
          Snap 'after 2.0.0'
          # Automatic export holds the app but, by default, not the credentials; synthetic token only.
          Start-Sleep 5
          $ae = Join-Path $env:LOCALAPPDATA 'ObtainiumPC\auto-export.json'
          if (-not (Test-Path $ae)) { throw 'automatic export file missing' }
          $aeText = Get-Content $ae -Raw
          "auto-export has the synthetic token: $($aeText.Contains('synthetic-token-for-export-check')); has the app: $($aeText.Contains('seed-myapp'))"
          if ($aeText.Contains('synthetic-token-for-export-check')) { throw 'automatic export leaked the stored token with credentials off' }
          if (-not $aeText.Contains('seed-myapp')) { throw 'automatic export does not include the app' }
          ClickNamedIn 'Import / Export' $win
          Start-Sleep 3
          ShotWin 'x1-import-export-window'
          $sel = FindNamed 'What to include' $win
          "export level selector present: $($sel -ne $null)"
          if ($sel -ne $null) { throw 'the old export level selector is still visible' }
          if ((FindNamed 'Export to file...' $win) -eq $null) { throw 'export button not found' }
          "include-credentials toggle present: $((FindNamed 'Include credentials in exports (off by default)' $win) -ne $null)"
          Shot 'v3-after-upgrade'
          "detail after 2.0.0: $(Installed)"
          if ((Installed) -notlike '*2.0.0*') { throw 'app does not record 2.0.0 after the upgrade' }
          if ((Get-Content (Join-Path $folder 'run.txt') -Raw).Trim() -ne 'v2') { throw 'run.txt was not replaced by v2' }
          if ((Get-Item (Join-Path $folder 'myapp.exe')).Length -ne (Get-Item 'C:\Windows\System32\hostname.exe').Length) { throw 'myapp.exe is not the 2.0.0 program' }
          if (-not (Test-Path (Join-Path $folder 'new.txt'))) { throw 'file added in 2.0.0 is missing' }
          if (Test-Path (Join-Path $folder 'old-only.txt')) { throw 'file that 2.0.0 no longer ships was left behind' }
          if ((Get-Content (Join-Path $folder 'user-note.txt') -Raw).Trim() -ne 'keep me') { throw 'user file lost' }
          $cfg = (Get-Content (Join-Path $folder 'config.ini') -Raw)
          "config.ini after upgrade: [$cfg]"
          if (-not (Test-Path (Join-Path $folder 'config.ini.user-backup')) -and $cfg -notlike '*user=edited*') { throw 'the user-edited config.ini was overwritten without a backup' }
          $dirs = @(Get-ChildItem 'C:\Obtainium' -Directory)
          "app folders: $($dirs.Name -join ', ')"
          if ($dirs.Count -ne 1) { throw 'expected exactly one app folder' }
          'ZIP version upgrade 1.0.0 -> 2.0.0 passed'
      - name: Preserve app logs
        if: always()
        shell: pwsh
        run: |
          $logs = Join-Path $env:LOCALAPPDATA 'ObtainiumPC\logs.jsonl'
          if (Test-Path $logs) { Copy-Item $logs shots\app-logs.jsonl }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-smoke-zip-version-shots
          path: shots/
