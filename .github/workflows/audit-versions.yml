name: Update decision audit - real installs (branch only)
on:
  push:
    branches: [ 'feat/program-files' ]
    paths: [ '.github/workflows/audit-versions.yml' ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  detect:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: fix
            ref: feat/program-files
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: microsoft/setup-msbuild@v2
      - name: Build
        run: |
          msbuild windows/ObtainiumPC.sln /t:Restore /p:Configuration=Release /p:Platform=x64
          msbuild windows/ObtainiumPC.sln /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:SelfContained=true
      - name: Install real apps, then add them in the app
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing, UIAutomationClient, UIAutomationTypes
          New-Item -ItemType Directory -Force shots | Out-Null
          function Shot($name) {
            $b=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp=New-Object System.Drawing.Bitmap $b.Width,$b.Height
            $g=[System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location,[System.Drawing.Point]::Empty,$b.Size)
            $bmp.Save("shots/$name.png"); $g.Dispose(); $bmp.Dispose()
          }
          $h = @{ 'User-Agent'='obtainium-pc-smoke'; Authorization="Bearer $env:GH_TOKEN" }
          function LatestInstaller($repo, $pattern) {
            $rel = Invoke-RestMethod "https://api.github.com/repos/$repo/releases/latest" -Headers $h
            $a = $rel.assets | Where-Object { $_.name -match $pattern } | Select-Object -First 1
            $out = Join-Path $env:RUNNER_TEMP $a.name
            Invoke-WebRequest $a.url -Headers @{ 'User-Agent'='obtainium-pc-smoke'; Authorization="Bearer $env:GH_TOKEN"; Accept='application/octet-stream' } -OutFile $out
            Write-Host "$repo -> $($rel.tag_name) $($a.name) $((Get-Item $out).Length) bytes"
            return $out
          }
          $bcu = LatestInstaller 'BCUninstaller/Bulk-Crap-Uninstaller' '_setup\.exe$'
          $npp = LatestInstaller 'notepad-plus-plus/notepad-plus-plus' 'Installer\.x64\.exe$'
          $sw = LatestInstaller 'henrypp/simplewall' 'setup\.exe$'
          $z7 = LatestInstaller 'ip7z/7zip' '^7z\d+-x64\.exe$'
          Start-Process $sw -ArgumentList '/S' -Wait
          Start-Process $z7 -ArgumentList '/S' -Wait
          Start-Process $bcu -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          Start-Process $npp -ArgumentList '/S' -Wait
          "== registry entries after install =="
          $keys = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall','HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall','HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall'
          foreach ($k in $keys) { Get-ChildItem $k -ErrorAction SilentlyContinue | ForEach-Object { $p = Get-ItemProperty $_.PSPath; if ($p.DisplayName -match 'BCU|Bulk|Notepad') { "KEY=$($_.PSChildName) | Name=$($p.DisplayName) | Ver=$($p.DisplayVersion) | Pub=$($p.Publisher) | Loc=$($p.InstallLocation) | Icon=$($p.DisplayIcon)" } } }
          $exe = 'windows\ObtainiumPC\bin\x64\Release\net8.0-windows10.0.19041.0\win-x64\ObtainiumPC.exe'
          $store = Join-Path $env:LOCALAPPDATA 'ObtainiumPC'
          if (Test-Path $store) { Remove-Item $store -Recurse -Force }
          $p = Start-Process $exe -PassThru
          Start-Sleep 12
          $root = [System.Windows.Automation.AutomationElement]::RootElement
          $win = $root.FindFirst([System.Windows.Automation.TreeScope]::Children, (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ProcessIdProperty, $p.Id)))
          Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public class M { [DllImport("user32.dll")] public static extern void mouse_event(uint f, uint dx, uint dy, uint d, int e); }'
          function ClickName($name) {
            foreach ($a in 1..5) {
              $el = $win.FindFirst([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, $name)))
              if ($el) {
                try { $el.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke(); return } catch {}
                $r = $el.Current.BoundingRectangle
                [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point([int]($r.X + $r.Width/2), [int]($r.Y + $r.Height/2))
                Start-Sleep -Milliseconds 300; [M]::mouse_event(0x02,0,0,0,0); [M]::mouse_event(0x04,0,0,0,0); return
              }
              Start-Sleep 1
            }
            throw "'$name' not found"
          }
          foreach ($u in 'BCUninstaller/Bulk-Crap-Uninstaller','notepad-plus-plus/notepad-plus-plus','henrypp/simplewall','ip7z/7zip') {
            Start-Process $exe -ArgumentList ('obtainium://add?url=' + [uri]::EscapeDataString("https://github.com/$u"))
            Start-Sleep 5
            ClickName 'Add'
            Start-Sleep 25
            ClickName 'Apps'
            Start-Sleep 3
          }
          Shot 'apps-list'
          "== UIA names mentioning installed/BCU/Bulk/Notepad =="
          foreach ($el in $win.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)) {
            $n = $el.Current.Name; if ($n -match 'nstalled|BCU|Bulk|Notepad') { "UIA: $n" }
          }
          "== apps.json =="
          Get-Content (Join-Path $store 'apps.json') -Raw | ConvertFrom-Json | ForEach-Object { "id=$($_.id) name=$($_.name) author=$($_.author) installed=$($_.installedVersion) src=$($_.installedVersionSource) osName=$($_.osMatchedName) latest=$($_.latestVersion)" }
          "== list rows (a row with an arrow means the app is shown as having an update) =="
          foreach ($el in $win.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)) {
            $n = $el.Current.Name; if ($n -match '  -  ' -or $n -match 'updates') { "ROW: $n" }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-${{ matrix.label }}
          path: shots
