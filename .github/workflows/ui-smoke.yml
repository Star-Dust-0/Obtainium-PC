          $rest.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
          Start-Sleep 2
          if ((FindNamed 'Restore' $root) -ne $null) { Shot 'health-restore-failed'; throw 'restore did not return the app to the flagged list' }
          $scrollers = $win2.FindAll([System.Windows.Automation.TreeScope]::Descendants, $spCond)
          $best = $null; $bestH = 0
