name: UI smoke (manual)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref to build (default: main)'
        required: false
        default: 'main'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: microsoft/setup-msbuild@v2
      - name: Restore
        run: msbuild windows/ObtainiumPC.sln /t:Restore /p:Configuration=Release /p:Platform=x64
      - name: Build
        run: msbuild windows/ObtainiumPC.sln /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:SelfContained=true
      - name: Seed a tracked app (GitHub source)
        shell: pwsh
        env:
          SMOKE_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'ObtainiumPC'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $apps = @(
            @{
              id = 'seed-npp'; url = 'https://github.com/notepad-plus-plus/notepad-plus-plus'
              author = 'notepad-plus-plus'; name = 'Notepad++'
              apkUrls = '[]'; otherAssetUrls = '[]'; preferredApkIndex = 0
              additionalSettings = '{}'; categories = @(); pinned = $false; disabled = $false
            }
          )
          # -InputObject keeps a one-element array a JSON array (pipeline unrolls it).
          ConvertTo-Json -InputObject $apps -Depth 6 | Set-Content (Join-Path $dir 'apps.json')
          # Make the first-run state deterministic.
          # The runner's per-job token is throwaway and never leaves the runner;
          # it only raises the GitHub API rate limit for the live check.
          $settings = @{ UpdateIntervalMinutes = 360; CheckOnStart = $true; NotifyUpdates = $false; GitHubPersonalAccessToken = $env:SMOKE_GH_TOKEN }
          ($settings | ConvertTo-Json) | Set-Content (Join-Path $dir 'settings.json')
      - name: Launch and capture
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force shots | Out-Null
          # Screenshots capture the app window's actual bounds (set
          # $script:shotWin) so no console or desktop bleeds in; full screen
          # only when no window is tracked (e.g. the external installer).
          $script:shotWin = $null
          $dwmSrc = 'using System; using System.Runtime.InteropServices; public static class DwmFrame { [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left, Top, Right, Bottom; } [DllImport("dwmapi.dll")] public static extern int DwmGetWindowAttribute(IntPtr hwnd, int attr, out RECT rect, int size); public const int DWMWA_EXTENDED_FRAME_BOUNDS = 9; }'
          Add-Type -TypeDefinition $dwmSrc
          function Shot($name) {
            $b=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $x=$b.X; $y=$b.Y; $w=$b.Width; $h=$b.Height
            if ($script:shotWin -ne $null) {
              # UIA BoundingRectangle includes the invisible resize border, so
              # whatever sits behind the window (console, desktop) bleeds into
              # the capture. DWM extended frame bounds are the visible frame.
              try {
                $hwnd = [IntPtr]$script:shotWin.Current.NativeWindowHandle
                $fr = New-Object DwmFrame+RECT
                if ($hwnd -ne [IntPtr]::Zero -and
                    [DwmFrame]::DwmGetWindowAttribute($hwnd, [DwmFrame]::DWMWA_EXTENDED_FRAME_BOUNDS, [ref]$fr, 16) -eq 0) {
                  $fw = $fr.Right - $fr.Left; $fh = $fr.Bottom - $fr.Top
                  if ($fw -gt 50 -and $fh -gt 50) {
                    $x=$fr.Left; $y=$fr.Top; $w=$fw; $h=$fh
                  }
                } else {
                  $r=$script:shotWin.Current.BoundingRectangle
                  if ($r.Width -gt 50 -and $r.Height -gt 50) {
                    $x=[int]$r.X; $y=[int]$r.Y; $w=[int]$r.Width; $h=[int]$r.Height
                  }
                }
              } catch {}
            }
            $bmp=New-Object System.Drawing.Bitmap $w,$h
            $g=[System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen((New-Object System.Drawing.Point $x,$y),[System.Drawing.Point]::Empty,(New-Object System.Drawing.Size $w,$h))
            $bmp.Save("shots/$name.png"); $g.Dispose(); $bmp.Dispose()
          }
          $exe = 'windows\ObtainiumPC\bin\x64\Release\net8.0-windows10.0.19041.0\win-x64\ObtainiumPC.exe'
          $p = Start-Process $exe -PassThru
          Start-Sleep 12
          $p.Refresh()
          if ($p.HasExited) { Shot 'exited'; throw "app exited at launch (code $($p.ExitCode))" }
          Shot '01-apps-list-initial'
          # Let check-on-start resolve the seeded repo's version (ships real .exe assets).
          Start-Sleep 30
          $p.Refresh()
          if ($p.HasExited) { Shot 'exited-during-check'; throw "app exited during update check (code $($p.ExitCode))" }
          Shot '02-apps-list-after-check'
          $apps = Get-Content (Join-Path $env:LOCALAPPDATA 'ObtainiumPC\apps.json') -Raw
          "== seeded store after check =="; $apps
          $logs = Join-Path $env:LOCALAPPDATA 'ObtainiumPC\logs.jsonl'
          if (Test-Path $logs) { "== logs =="; Get-Content $logs | Select-Object -First 20 }

          # Page walkthrough: click each nav item via UIA + real mouse input,
          # screenshotting every page. The token field is a PasswordBox
          # (masked), so no screenshot can leak the seeded token.
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public class M { [DllImport("user32.dll")] public static extern void mouse_event(uint f, uint dx, uint dy, uint d, int e); }'
          $root = [System.Windows.Automation.AutomationElement]::RootElement
          $wcond = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ProcessIdProperty, $p.Id)
          $win = $root.FindFirst([System.Windows.Automation.TreeScope]::Children, $wcond)
          if ($win -eq $null) { throw 'main window not found for walkthrough' }
          $script:shotWin = $win
          function ClickNamed($name, $verifyName) {
            # Invoke/click, then (when a verification element is given) confirm
            # it appears, retrying the click - one stray click must not derail
            # the whole walkthrough.
            foreach ($attempt in 1..3) {
              $c = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, $name)
              $el = $win.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $c)
              if ($el -eq $null) {
                if ($attempt -eq 3) { throw "nav item '$name' not found" }
                Start-Sleep 1; continue
              }
              $invoked = $false
              try { $el.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke(); $invoked = $true } catch {}
              if (-not $invoked) {
                $r = $el.Current.BoundingRectangle
                [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point([int]($r.X + $r.Width/2), [int]($r.Y + $r.Height/2))
                Start-Sleep -Milliseconds 300
                [M]::mouse_event(0x02,0,0,0,0); [M]::mouse_event(0x04,0,0,0,0)
              }
              if (-not $verifyName) { return }
              foreach ($w in 1..6) {
                Start-Sleep 1
                $vc = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, $verifyName)
                if ($win.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $vc) -ne $null) { return }
              }
            }
            throw "clicking '$name' never produced '$verifyName'"
          }
          $pages = @(
            @('Add App', '03-add-app'),
            @('Update Health', '04-update-health'),
            @('Import / Export', '05-import-export'),
            @('Logs', '06-logs'),
            @('Settings', '07-settings'),
            @('Apps', '08-apps-final')
          )
          foreach ($pg in $pages) {
            ClickNamed $pg[0]
            Start-Sleep 3
            $p.Refresh()
            if ($p.HasExited) { Shot "exited-on-$($pg[1])"; throw "app exited navigating to $($pg[0]) (code $($p.ExitCode))" }
            Shot $pg[1]
          }

          # --- Interaction testing ---
          $root = [System.Windows.Automation.AutomationElement]::RootElement
          function ClickPartial($prefix, $scope) {
            $all = $scope.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)
            foreach ($el in $all) {
              $n = $el.Current.Name
              if ($n -and $n.StartsWith($prefix)) {
                $r = $el.Current.BoundingRectangle
                if ($r.Width -gt 10 -and $r.Height -gt 10) {
                  [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point([int]($r.X + $r.Width/2), [int]($r.Y + $r.Height/2))
                  Start-Sleep -Milliseconds 300
                  [M]::mouse_event(0x02,0,0,0,0); [M]::mouse_event(0x04,0,0,0,0)
                  return $el
                }
              }
            }
            throw "element starting with '$prefix' not found"
          }
          function FindNamed($name, $scope) {
            $c = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, $name)
            return $scope.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $c)
          }
          function AssertAlive($tag) {
            $p.Refresh()
            if ($p.HasExited) { Shot "exited-$tag"; throw "app exited at $tag (code $($p.ExitCode))" }
          }

          # App detail page (click the app card).
          ClickPartial 'Notepad' $win | Out-Null
          Start-Sleep 3; AssertAlive 'detail'; Shot '09-app-detail'

          # The OS app-settings gear must be DISABLED for this unpackaged app.
          $gear = FindNamed 'App settings' $win
          if ($gear -eq $null) { throw 'gear button not found on detail page' }
          "gear IsEnabled = $($gear.Current.IsEnabled)"
          if ($gear.Current.IsEnabled) { throw 'OS app settings gear must be disabled for unpackaged apps' }

          # Download safe completion: Update downloads the asset; poll for the file.
          # First install: the detail action button reads 'Install' (upstream lib/pages/app.dart).
          # Upstream always shows the asset picker on manual download
          # (confirmAppFileUrl evenIfSingleChoice: true).
          ClickNamed 'Install'
          Start-Sleep 3
          $dlg = FindNamed 'Choose a file' $root
          if ($dlg -eq $null) { Shot 'no-asset-picker'; throw 'asset picker dialog did not appear after Install' }
          $picked = $false
          foreach ($want in @('Installer.x64.exe', 'Installer.exe')) {
            $all = $dlg.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)
            foreach ($el in $all) {
              if ($el.Current.Name -like "*$want*" -and $el.Current.ControlType -eq [System.Windows.Automation.ControlType]::RadioButton) {
                $r = $el.Current.BoundingRectangle
                [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point([int]($r.X + $r.Width/2), [int]($r.Y + $r.Height/2))
                Start-Sleep -Milliseconds 300
                [M]::mouse_event(0x02,0,0,0,0); [M]::mouse_event(0x04,0,0,0,0)
                "picked asset: $($el.Current.Name)"
                $picked = $true
                break
              }
            }
            if ($picked) { break }
          }
          if (-not $picked) { Shot 'asset-not-found'; throw 'installer asset not found in picker' }
          Start-Sleep 1
          ClickNamed 'Download'
          # Progress panel may flash by on a fast runner; the downloaded file
          # below is the hard check, the panel sighting is logged best-effort.
          foreach ($i in 1..5) {
            Start-Sleep 1
            if ((FindNamed 'Download progress' $root) -ne $null) { "progress panel seen"; break }
          }
          $dlDir = Join-Path $env:USERPROFILE 'Downloads\ObtainiumPC'
          $file = $null
          foreach ($i in 1..40) {
            Start-Sleep 3
            $file = Get-ChildItem $dlDir -Filter '*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($file -and $file.Length -gt 1000000) { break }
          }
          AssertAlive 'download'; Shot '11-download-complete'
          if (-not $file) { throw 'download did not produce a file' }
          "downloaded: $($file.FullName) ($($file.Length) bytes)"

          # Real install: the app launched the NSIS wizard interactively
          # (visible window = the interactive-launch proof). Driving NSIS
          # pages via UIA proved flaky on the runner (Enter/focus timing),
          # so the harness closes the wizard and completes the SAME installer
          # silently (NSIS /S) purely to reach the installed state; the
          # detection assertions below are the actual feature under test.
          $regPath = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Notepad++'
          $setupWin = FindNamed 'Notepad++ v8.9.8.1 Setup' $root
          if ($setupWin -eq $null) { $setupWin = FindNamed 'Installer Language' $root }
          $script:shotWin = $null  # capture the external installer full-screen
          if ($setupWin -eq $null) { Shot 'installer-never-launched'; throw 'app did not launch the installer interactively' }
          'interactive installer window confirmed'
          Shot '11a-installer-launched'
          Get-Process | Where-Object { $_.Name -like '*npp*Installer*' -or $_.MainWindowTitle -like '*Notepad++*Setup*' } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep 2
          Start-Process $file.FullName -ArgumentList '/S' -Wait
          $reg = Get-ItemProperty $regPath -ErrorAction SilentlyContinue
          if ($reg -eq $null) { Shot 'silent-install-failed'; throw 'silent install did not create the registry entry' }
          "registry DisplayVersion: $($reg.DisplayVersion)"
          Shot '11b-install-finished'
          $script:shotWin = $win
          # The app must now detect the installed version via registry.
          ClickNamed 'Detect installed version now'
          Start-Sleep 3
          AssertAlive 'detect'; Shot '11c-detected-installed'
          $installedText = $null
          $allEls2 = $win.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)
          foreach ($el in $allEls2) {
            if ($el.Current.Name -like 'Installed: *') { $installedText = $el.Current.Name; break }
          }
          "installed text: $installedText"
          $btnCond = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty, [System.Windows.Automation.ControlType]::Button)
          $allBtns = $win.FindAll([System.Windows.Automation.TreeScope]::Descendants, $btnCond)
          foreach ($be in $allBtns) { "button UIA: name=[$($be.Current.Name)] enabled=$($be.Current.IsEnabled)" }
          if ($installedText -notlike '*8.9.8.1*') { throw "detection did not surface the installed version (got: $installedText)" }
          Get-Process | Where-Object { $_.Name -like 'notepad++*' } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep 2

          # Per-app options page (last detail-page stop; verified nav).
          ClickNamed 'Options' 'Notepad++ options'
          Start-Sleep 2; AssertAlive 'options'; Shot '10-app-options'

          # Settings scrolled capture (best effort) and theme persistence.
          ClickNamed 'Settings' 'Theme'
          Start-Sleep 2
          try {
            $allEls = $win.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)
            foreach ($el in $allEls) {
              $sp = $null
              try { $sp = $el.GetCurrentPattern([System.Windows.Automation.ScrollPattern]::Pattern) } catch {}
              if ($sp -ne $null -and $sp.Current.VerticallyScrollable) {
                $sp.ScrollVertical([System.Windows.Automation.ScrollAmount]::LargeIncrement)
                $sp.ScrollVertical([System.Windows.Automation.ScrollAmount]::LargeIncrement)
                break
              }
            }
            Start-Sleep 2
          } catch { 'scroll capture unsupported: ' + $_.Exception.Message }
          Shot '07b-settings-scrolled'
          $comboType = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty, [System.Windows.Automation.ControlType]::ComboBox)
          $combos = $win.FindAll([System.Windows.Automation.TreeScope]::Descendants, $comboType)
          if ($combos.Count -eq 0) { throw 'no combo boxes on Settings page' }
          try { $combos[0].GetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern).Expand() } catch { ClickPartial $combos[0].Current.Name $win | Out-Null }
          Start-Sleep 2
          # ComboBox dropdown items live in a popup window: search from the desktop root.
          ClickPartial 'Dark' $root | Out-Null
          Start-Sleep 2
          Shot '12-settings-dark'

          # Restart and verify the theme persisted.
          Stop-Process -Id $p.Id -Force
          Start-Sleep 3
          $p = Start-Process $exe -PassThru
          Start-Sleep 12; AssertAlive 'relaunch'
          $wcond2 = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ProcessIdProperty, $p.Id)
          $win2 = $root.FindFirst([System.Windows.Automation.TreeScope]::Children, $wcond2)
          if ($win2 -eq $null) { throw 'main window not found after relaunch' }
          $script:shotWin = $win2
          Shot '13-theme-persisted'
          $savedSettings = Get-Content (Join-Path $env:LOCALAPPDATA 'ObtainiumPC\settings.json') -Raw
          if ($savedSettings -notmatch '"Theme"\s*:\s*"dark"') { throw 'theme not persisted to settings.json' }
          'theme persisted in settings.json'

          # Arabic RTL: switch language via the Settings Language combo, verify
          # translated chrome + persistence, then switch back (reversibility).
          function ClickNamedIn($name, $scope) {
            $c = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, $name)
            $el = $scope.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $c)
            if ($el -eq $null) { throw "element '$name' not found" }
            try { $el.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke() } catch {
              $r = $el.Current.BoundingRectangle
              [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point([int]($r.X + $r.Width/2), [int]($r.Y + $r.Height/2))
              Start-Sleep -Milliseconds 300
              [M]::mouse_event(0x02,0,0,0,0); [M]::mouse_event(0x04,0,0,0,0)
            }
          }
          ClickNamedIn 'Settings' $win2
          Start-Sleep 3
          $combos = $win2.FindAll([System.Windows.Automation.TreeScope]::Descendants, $comboType)
          if ($combos.Count -lt 2) { throw 'language combo not found on Settings page' }
          try { $combos[1].GetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern).Expand() } catch { ClickPartial $combos[1].Current.Name $win2 | Out-Null }
          Start-Sleep 2
          ClickPartial 'العربية' $root | Out-Null
          Start-Sleep 4
          AssertAlive 'arabic-switch'
          $found = $false
          foreach ($w in 1..15) {
            Start-Sleep 1
            if ((FindNamed 'التطبيقات' $win2) -ne $null) { $found = $true; break }
          }
          if (-not $found) { Shot 'arabic-missing'; throw 'Arabic nav label not found after language switch' }
          Shot '15-arabic-rtl-settings'
          $savedSettings = Get-Content (Join-Path $env:LOCALAPPDATA 'ObtainiumPC\settings.json') -Raw
          if ($savedSettings -notmatch '"Language"\s*:\s*"ar"') { throw 'language not persisted to settings.json' }
          'language persisted as ar'
          ClickNamedIn 'التطبيقات' $win2
          Start-Sleep 3
          AssertAlive 'arabic-apps'; Shot '16-arabic-rtl-apps'
          ClickNamedIn 'الإعدادات' $win2
          Start-Sleep 3
          $combos = $win2.FindAll([System.Windows.Automation.TreeScope]::Descendants, $comboType)
          try { $combos[1].GetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern).Expand() } catch { ClickPartial $combos[1].Current.Name $win2 | Out-Null }
          Start-Sleep 2
          ClickPartial 'English' $root | Out-Null
          Start-Sleep 4
          AssertAlive 'english-switch'
          $found = $false
          foreach ($w in 1..15) {
            Start-Sleep 1
            if ((FindNamed 'Apps' $win2) -ne $null) { $found = $true; break }
          }
          if (-not $found) { Shot 'english-missing'; throw 'English nav label not found after switching back' }
          Shot '17-back-to-english'
          $savedSettings = Get-Content (Join-Path $env:LOCALAPPDATA 'ObtainiumPC\settings.json') -Raw
          if ($savedSettings -notmatch '"Language"\s*:\s*"en"') { throw 'language not persisted back to en' }
          'language reverted to en'
          ClickNamedIn 'Apps' $win2
          Start-Sleep 3

          # Smaller window: resize and validate the layout survives.
          $wcond2 = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ProcessIdProperty, $p.Id)
          $win2 = $root.FindFirst([System.Windows.Automation.TreeScope]::Children, $wcond2)
          if ($win2 -eq $null) { throw 'main window not found after relaunch' }
          Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public class W { [DllImport("user32.dll")] public static extern bool SetWindowPos(System.IntPtr h, System.IntPtr after, int x, int y, int cx, int cy, uint flags); }'
          [W]::SetWindowPos([IntPtr]$win2.Current.NativeWindowHandle, [IntPtr]::Zero, 100, 60, 700, 480, 0x4) | Out-Null
          Start-Sleep 3
          AssertAlive 'small-window'; Shot '14-small-window'
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-smoke-shots
          path: shots/
