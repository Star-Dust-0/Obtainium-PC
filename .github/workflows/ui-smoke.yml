          $procsAfter = @(Get-Process | Where-Object { $_.Name -match 'setup|installer|msiexec' }).Count
          if ($procsAfter -ne $procsBefore) { Shot 'track-only-mark-installer'; throw 'mark-installed launched an installer process' }
