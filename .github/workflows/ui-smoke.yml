          $aw = $root.FindFirst([System.Windows.Automation.TreeScope]::Children, $arcw)
          if ($aw -eq $null) { throw 'main window not found for Arabic wide captures' }
          try { $aw.GetCurrentPattern([System.Windows.Automation.WindowPattern]::Pattern).SetWindowVisualState([System.Windows.Automation.WindowVisualState]::Maximized) } catch { "maximize failed: $_" }
          Start-Sleep 3
          $script:shotWin = $aw
          Shot 'ar-wide-01-apps'
          try { ToggleGroupIfPresent 'GitHub' $aw; Start-Sleep 2; ClickPartial 'Notepad++' $aw | Out-Null; Start-Sleep 4 } catch { "ar split click failed: $_" }
          Shot 'ar-wide-01b-split'
          foreach ($pair in @(@('Add App','ar-wide-02-add'), @('Update Health','ar-wide-03-health'), @('Import / Export','ar-wide-04-importexport'), @('Logs','ar-wide-05-logs'), @('Settings','ar-wide-06-settings'))) {
            try { ClickNamedIn $pair[0] $aw; Start-Sleep 3 } catch { "ar nav $($pair[0]) failed: $_" }
            Shot $pair[1]
          }
          AssertAlive 'arabic-wide'
          Stop-Process -Id $p.Id -Force
          Start-Sleep 2
          Set-Content $arPath $arOrig

          # ---- Dark wide captures: same pages with Theme=dark persisted ----
          $dkj = $arOrig | ConvertFrom-Json
          $dkj | Add-Member -NotePropertyName Theme -NotePropertyValue 'dark' -Force
          $dkj | ConvertTo-Json -Depth 6 | Set-Content $arPath
          $p = Start-Process $exe -PassThru
          Start-Sleep 10
          $dkc = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ProcessIdProperty, $p.Id)
          $dw = $root.FindFirst([System.Windows.Automation.TreeScope]::Children, $dkc)
          if ($dw -eq $null) { throw 'main window not found for dark wide captures' }
          try { $dw.GetCurrentPattern([System.Windows.Automation.WindowPattern]::Pattern).SetWindowVisualState([System.Windows.Automation.WindowVisualState]::Maximized) } catch { "maximize failed: $_" }
          Start-Sleep 3
          $script:shotWin = $dw
          Shot 'dk-wide-01-apps'
          try { ToggleGroupIfPresent 'GitHub' $dw; Start-Sleep 2; ClickPartial 'Notepad++' $dw | Out-Null; Start-Sleep 4 } catch { "dk split click failed: $_" }
          Shot 'dk-wide-01b-split'
          foreach ($pair in @(@('Add App','dk-wide-02-add'), @('Update Health','dk-wide-03-health'), @('Import / Export','dk-wide-04-importexport'), @('Logs','dk-wide-05-logs'), @('Settings','dk-wide-06-settings'))) {
            try { ClickNamedIn $pair[0] $dw; Start-Sleep 3 } catch { "dk nav $($pair[0]) failed: $_" }
            Shot $pair[1]
          }
          AssertAlive 'dark-wide'
          Stop-Process -Id $p.Id -Force
          Start-Sleep 2
          Set-Content $arPath $arOrig

          # ---- unreadable stored data must be visible, and must not be overwritten ----
          $setPath = Join-Path $env:LOCALAPPDATA 'ObtainiumPC\settings.json'
          $goodSettings = Get-Content $setPath -Raw
          $badText = '{ "GitHubPersonalAccessToken": "keep-me", broken'
          Set-Content -Path $setPath -Value $badText -NoNewline
          $p = Start-Process $exe -PassThru
          Start-Sleep 10
          $wc = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ProcessIdProperty, $p.Id)
          $wn = $root.FindFirst([System.Windows.Automation.TreeScope]::Children, $wc)
          if ($wn -eq $null) { throw 'main window not found for the storage-problem check' }
          $script:shotWin = $wn
          $dlgC = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, 'Stored data could not be read')
          if ($root.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $dlgC) -eq $null) { Shot 'storage-dialog-missing'; throw 'unreadable settings.json did not raise the startup dialog' }
          Shot '29-storage-problem-dialog'
          $okBtn = $root.FindFirst([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, 'OK')))
          if ($okBtn -ne $null) { try { $okBtn.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke() } catch {} }
          Start-Sleep 2
          Stop-Process -Id $p.Id -Force
          Start-Sleep 2
          if ((Get-Content $setPath -Raw) -ne $badText) { throw 'the unreadable settings.json was overwritten' }
          if (-not (Get-ChildItem (Split-Path $setPath) -Filter 'settings.json.corrupt-*')) { throw 'no preserved copy of the unreadable settings.json' }
          Set-Content -Path $setPath -Value $goodSettings -NoNewline
          'storage problem dialog verified, original preserved'
      - name: Preserve app logs
        if: always()
        shell: pwsh
        run: |
          # Crash evidence: the app's logs.jsonl (with any unhandled-exception
          # entry) and the script-visible process state travel with the shots.
          $logs = Join-Path $env:LOCALAPPDATA 'ObtainiumPC\logs.jsonl'
          if (Test-Path $logs) { Copy-Item $logs shots\app-logs.jsonl }
          $procs = @(Get-Process ObtainiumPC -ErrorAction SilentlyContinue)
          "app processes at capture: $($procs.Count)" | Out-File shots\app-process-state.txt
          # Native-crash evidence (WinUI/CLR faults do not reach logs.jsonl).
          try {
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-60) } -ErrorAction Stop |
              Where-Object { $_.ProviderName -in @('Application Error', '.NET Runtime', 'Windows Error Reporting') -and $_.Message -match 'ObtainiumPC' } |
              Select-Object -First 8 TimeCreated, ProviderName, Message | Format-List | Out-String -Width 400 | Out-File shots\app-crash-events.txt
          } catch { "event log query failed: $_" | Out-File shots\app-crash-events.txt }
          $dump = Get-ChildItem C:\dumps -Filter *.dmp -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($dump) {
            "dump: $($dump.FullName) $($dump.Length)" | Out-File shots\dump-analysis.txt
            try {
              dotnet tool install -g dotnet-dump 2>&1 | Out-File -Append shots\dump-analysis.txt
              $dd = Join-Path $env:USERPROFILE '.dotnet\tools\dotnet-dump.exe'
              & $dd analyze $dump.FullName -c 'threads' -c 'pe -nested' -c 'clrstack -all' -c 'exit' 2>&1 | Out-File -Append -Width 400 shots\dump-analysis.txt
            } catch { "analysis failed: $_" | Out-File -Append shots\dump-analysis.txt }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-smoke-shots
          path: shots/
