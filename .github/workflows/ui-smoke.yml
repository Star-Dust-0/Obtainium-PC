          Start-Sleep 3; AssertAlive 'track-only-detail'
          if ((FindNamed 'Options' $win3) -eq $null) { Shot 'track-only-detail-missing'; throw 'Obtainium detail page not reached' }
          Shot '28e-github-track-only-detail'

