          # Source option editors render at runtime: F-Droid and Farsroid apps
          # imported via deep link, then their per-source options pages.
          $fdJson = '{"id":"deeplink-smoke-fdroid","url":"https://f-droid.org/packages/org.fdroid.fdroid/","author":"F-Droid","name":"F-Droid client","additionalSettings":"{}"}'
          Start-Process $exe -ArgumentList ('obtainium://app/' + [uri]::EscapeDataString($fdJson))
          Start-Sleep 4
          if ((FindNamed 'Import app' $root) -eq $null) { Shot 'fdroid-import-missing'; throw 'F-Droid deep-link import dialog missing' }
          (FindNamed 'Import' $root).GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
          Start-Sleep 3
          $cb3 = FindNamed 'Close' $root
          if ($cb3 -ne $null) { try { $cb3.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke() } catch {} }
          Start-Sleep 2
          $fdRow = FindNamed 'F-Droid client' $win3
          if ($fdRow -eq $null) { ClickNamedIn 'F-Droid' $win3; Start-Sleep 2; $fdRow = FindNamed 'F-Droid client' $win3 }
          if ($fdRow -eq $null) { Shot 'fdroid-row-missing'; throw 'F-Droid row not found after import' }
          try { $fdRow.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke() } catch { ClickPartial 'F-Droid client' $win3 | Out-Null }
          Start-Sleep 3
          ClickNamedIn 'Options' $win3
          Start-Sleep 2; AssertAlive 'fdroid-options'
          if ((FindNamed 'F-Droid client options' $root) -eq $null) { Shot 'fdroid-options-nav'; throw 'options page did not open for F-Droid client' }
          if ((FindNamed 'Filter versions by regular expression' $root) -eq $null) { Shot 'fdroid-options-missing'; throw 'F-Droid source option editors did not render' }
          Shot '29-fdroid-options'
          ClickNamedIn 'Apps' $win3
          Start-Sleep 2

          $frJson = '{"id":"deeplink-smoke-farsroid","url":"https://farsroid.com/telegram-x/","author":"Farsroid","name":"Farsroid smoke","additionalSettings":"{}"}'
          Start-Process $exe -ArgumentList ('obtainium://app/' + [uri]::EscapeDataString($frJson))
          Start-Sleep 4
          if ((FindNamed 'Import app' $root) -eq $null) { Shot 'farsroid-import-missing'; throw 'Farsroid deep-link import dialog missing' }
          (FindNamed 'Import' $root).GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
          Start-Sleep 3
          $cb4 = FindNamed 'Close' $root
          if ($cb4 -ne $null) { try { $cb4.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke() } catch {} }
          Start-Sleep 2
          $frRow = FindNamed 'Farsroid smoke' $win3
          if ($frRow -eq $null) { ClickNamedIn 'Farsroid' $win3; Start-Sleep 2; $frRow = FindNamed 'Farsroid smoke' $win3 }
          if ($frRow -eq $null) { Shot 'farsroid-row-missing'; throw 'Farsroid row not found after import' }
          try { $frRow.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke() } catch { ClickPartial 'Farsroid smoke' $win3 | Out-Null }
          Start-Sleep 3
          ClickNamedIn 'Options' $win3
          Start-Sleep 2; AssertAlive 'farsroid-options'
          if ((FindNamed 'Farsroid smoke options' $root) -eq $null) { Shot 'farsroid-options-nav'; throw 'options page did not open for Farsroid smoke' }
          if ((FindNamed 'Auto-select first of multiple APKs' $root) -eq $null) { Shot 'farsroid-options-missing'; throw 'Farsroid source option editors did not render' }
          Shot '30-farsroid-options'
          ClickNamedIn 'Apps' $win3
          Start-Sleep 2
          'F-Droid and Farsroid option editors render verified'

          # Dialog theme + language round-trip: in-session changes must reach
          # newly created dialogs (ThemedContentDialog reads the saved theme at
          # construction; localization applies at dialog creation).
          ClickNamedIn 'Settings' $win3
          Start-Sleep 3
          $combos = $win3.FindAll([System.Windows.Automation.TreeScope]::Descendants, $comboType)
          try { $combos[0].GetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern).Expand() } catch { ClickPartial $combos[0].Current.Name $win3 | Out-Null }
          Start-Sleep 2
          ClickPartial 'Light' $root | Out-Null
          Start-Sleep 2
          $dlJson2 = '{"id":"deeplink-smoke-2","url":"https://github.com/ImranR98/Obtainium","author":"ImranR98","name":"Obtainium","additionalSettings":"{}"}'
          Start-Process $exe -ArgumentList ('obtainium://app/' + [uri]::EscapeDataString($dlJson2))
          Start-Sleep 4
          $dlgCond2 = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, 'Import app')
          if ($root.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $dlgCond2) -eq $null) { Shot 'dialog-light-missing'; throw 'import dialog missing after light switch' }
          Shot '25-dialog-light'
          $cancel2 = $root.FindFirst([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, 'Cancel')))
          if ($cancel2 -ne $null) { try { $cancel2.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke() } catch {} }
          Start-Sleep 2

          $combos = $win3.FindAll([System.Windows.Automation.TreeScope]::Descendants, $comboType)
          try { $combos[1].GetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern).Expand() } catch { ClickPartial $combos[1].Current.Name $win3 | Out-Null }
          Start-Sleep 2
          # Keyboard selection (virtualized list): العربية is 3rd from the end.
          [System.Windows.Forms.SendKeys]::SendWait('{END}')
          Start-Sleep -Milliseconds 400
          [System.Windows.Forms.SendKeys]::SendWait('{UP}')
          Start-Sleep -Milliseconds 300
          [System.Windows.Forms.SendKeys]::SendWait('{UP}')
          Start-Sleep -Milliseconds 300
          [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
          Start-Sleep 4
          Start-Process $exe -ArgumentList ('obtainium://app/' + [uri]::EscapeDataString($dlJson2))
          Start-Sleep 4
          $dlgAr = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, 'استيراد تطبيق')
          if ($root.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $dlgAr) -eq $null) { Shot 'dialog-arabic-missing'; throw 'Arabic import dialog missing after language switch' }
          Shot '26-dialog-arabic-rtl'
          $cancelAr = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, 'إلغاء')
          $cancelArBtn = $root.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $cancelAr)
          if ($cancelArBtn -ne $null) { try { $cancelArBtn.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke() } catch {} }
          Start-Sleep 2

          ClickNamedIn 'الإعدادات' $win3
          Start-Sleep 3
          $combos = $win3.FindAll([System.Windows.Automation.TreeScope]::Descendants, $comboType)
          try { $combos[1].GetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern).Expand() } catch { ClickPartial $combos[1].Current.Name $win3 | Out-Null }
          Start-Sleep 2
          # Keyboard selection (virtualized list): English is index 1.
          [System.Windows.Forms.SendKeys]::SendWait('{HOME}')
          Start-Sleep -Milliseconds 400
          [System.Windows.Forms.SendKeys]::SendWait('{DOWN}')
          Start-Sleep -Milliseconds 300
          [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
          Start-Sleep 4
          AssertAlive 'dialog-roundtrip-done'
          'dialog theme+language round-trip verified'

          # Representative non-RTL locale from the reused upstream tables:
          # French must retranslate chrome (generated LocTranslations).
          $combos = $win3.FindAll([System.Windows.Automation.TreeScope]::Descendants, $comboType)
          try { $combos[1].GetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern).Expand() } catch { ClickPartial $combos[1].Current.Name $win3 | Out-Null }
          Start-Sleep 2
          # Keyboard selection (virtualized list): Français is index 10.
          [System.Windows.Forms.SendKeys]::SendWait('{HOME}')
          Start-Sleep -Milliseconds 400
          foreach ($i in 1..10) { [System.Windows.Forms.SendKeys]::SendWait('{DOWN}'); Start-Sleep -Milliseconds 150 }
          [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
          Start-Sleep 4
          if ((FindNamed 'Applications' $win3) -eq $null) { Shot 'language-french-missing'; throw 'French nav label missing after language switch' }
          Shot '27-language-french'
          $combos = $win3.FindAll([System.Windows.Automation.TreeScope]::Descendants, $comboType)
          try { $combos[1].GetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern).Expand() } catch { ClickPartial $combos[1].Current.Name $win3 | Out-Null }
          Start-Sleep 2
          # Keyboard selection (virtualized list): English is index 1.
          [System.Windows.Forms.SendKeys]::SendWait('{HOME}')
          Start-Sleep -Milliseconds 400
          [System.Windows.Forms.SendKeys]::SendWait('{DOWN}')
          Start-Sleep -Milliseconds 300
          [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
          Start-Sleep 4
          if ((FindNamed 'Settings' $win3) -eq $null) { DumpNames $win3 'english-restore-after-french'; Shot 'language-english-restore'; throw 'English nav label missing after restore' }
          'French language selection verified'

          # Full filter dialog (AppsFilter): a name filter narrows the list;
          # Clear restores it.
          ClickNamedIn 'Apps' $win3
          Start-Sleep 2
          ClickNamedIn 'Filter' $win3
          Start-Sleep 2
          $nameBox = FindNamed 'App name' $root
          if ($nameBox -eq $null) { Shot 'filter-dialog-missing'; throw 'filter dialog did not open' }
          try { $nameBox.GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern).SetValue('Notepad') } catch { Shot 'filter-name-set'; throw 'could not type the name filter' }
          Shot '31-filter-dialog'
          (FindNamed 'Apply' $root).GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
          Start-Sleep 2
          # Group collapse is orthogonal to filtering upstream
          # (lib/pages/apps.dart:923: expanded comes only from collapsedGroups),
          # so a collapsed group keeps its matching row hidden. Toggle the
          # GitHub group until the row renders (two toggles converge from
          # either starting state and always end expanded).
          ClickNamedIn 'GitHub' $win3
          Start-Sleep 2
          if ((FindNamed 'Notepad++' $win3) -eq $null) { ClickNamedIn 'GitHub' $win3; Start-Sleep 2 }
          if ((FindNamed 'Notepad++' $win3) -eq $null) { Shot 'filter-kept-missing'; throw 'name filter hid the matching app' }
          if ((FindNamed 'F-Droid client' $win3) -ne $null) { Shot 'filter-not-narrowing'; throw 'name filter did not narrow the list' }
          Shot '31b-filter-applied'
          ClickNamedIn 'Filter' $win3
          Start-Sleep 2
          (FindNamed 'Clear' $root).GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
          Start-Sleep 2
          # Same collapse orthogonality: expand F-Droid for the row assert.
          ClickNamedIn 'F-Droid' $win3
          Start-Sleep 2
          if ((FindNamed 'F-Droid client' $win3) -eq $null) { ClickNamedIn 'F-Droid' $win3; Start-Sleep 2 }
          if ((FindNamed 'F-Droid client' $win3) -eq $null) { Shot 'filter-clear-failed'; throw 'Clear did not restore the full list' }
          Shot '32-filter-cleared'
          'filter dialog verified'

          # Light-theme twin check: the disabled Mark updated twin must render
          # with the disabled brush under Light as well (28h covered Dark).
          # Two hazards here: the Obtainium row can sit clipped at the list
          # edge (its center below the viewport), and a prefix search matches
          # the 'Obtainium-PC' title-bar text before the row. Use the
          # exact-name element only: scroll its ListItem ancestor into view,
          # then real-click ITS center, retrying until the detail renders.
          $obtRow = FindNamed 'Obtainium' $win3
          if ($obtRow -eq $null) { Shot 'light-row-missing'; throw 'Obtainium row not found for the light mark check' }
          $walker = [System.Windows.Automation.TreeWalker]::ControlViewWalker
          $opened = $false
          foreach ($try in 1..4) {
            $obtRow = FindNamed 'Obtainium' $win3
            if ($obtRow -eq $null) { break }
            $item = $obtRow
            while ($item -ne $null -and $item.Current.ControlType -ne [System.Windows.Automation.ControlType]::ListItem) { $item = $walker.GetParent($item) }
            $target = if ($item -ne $null) { $item } else { $obtRow }
            try { $target.GetCurrentPattern([System.Windows.Automation.ScrollItemPattern]::Pattern).ScrollIntoView(); Start-Sleep 1 } catch {}
            $r = $target.Current.BoundingRectangle
            [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point([int]($r.X + $r.Width/2), [int]($r.Y + $r.Height/2))
            Start-Sleep -Milliseconds 300
            [M]::mouse_event(0x02,0,0,0,0); [M]::mouse_event(0x04,0,0,0,0)
            Start-Sleep 2
            if ((FindNamed 'Mark updated' $win3) -ne $null) { $opened = $true; break }
          }
          if (-not $opened) { Shot 'light-mark-missing'; throw 'Mark updated action missing in light theme' }
          $markUpdLight = FindNamed 'Mark updated' $win3
          if ($markUpdLight.Current.IsEnabled -ne $false) { Shot 'light-mark-enabled'; throw 'Mark updated enabled in light theme although installed matches latest' }
          $dlLight = FindNamed 'Download' $win3
          if ($dlLight -eq $null -or $dlLight.Current.IsEnabled -ne $true) { Shot 'light-download-disabled'; throw 'Download must stay enabled in light theme' }
          Shot '28i-track-only-marked-installed-light'
          # Back-navigation evidence: capture the FIRST attempt's result
          # before any retry, so a slow/broken render is distinguishable
          # from a missed harness click. Retries are bounded and counted; a
          # retry succeeding must stay visible in the log, not silently pass.
          ClickNamedIn 'Apps' $win3
          Start-Sleep 2
          Shot '28j-back-to-apps-first-attempt'
          $backTries = 1
          $backOk = (FindNamed 'Filter' $win3) -ne $null
          while (-not $backOk -and $backTries -lt 4) {
            $backTries++
            ClickNamedIn 'Apps' $win3
            Start-Sleep 2
            $backOk = (FindNamed 'Filter' $win3) -ne $null
          }
          if ($backTries -gt 1) { "WARNING: back-nav needed $backTries attempts (first-attempt evidence in 28j shot) - possible app navigation/render issue, not just a missed click" }
          if (-not $backOk) { Shot 'back-nav-stuck'; throw 'could not navigate back to the Apps list after the light check' }
          'light-theme mark-disabled state verified'

          # Downgrade gate on the detail page (showAppDowngradeError default
          # on): recorded 999.0 vs a real latest must be blocked with the
          # downgrade dialog, never downloaded.
          # Wait for the list to render after the back-navigation, then
          # converge the GitHub group open (collapse state can reset across
          # navigations) and open the row via scroll + real click.
          foreach ($w in 1..10) { Start-Sleep 1; if ((FindNamed 'Filter' $win3) -ne $null) { break } }
          if ((FindNamed 'Mumble' $win3) -eq $null) { ClickNamedIn 'GitHub' $win3; Start-Sleep 2 }
          if ((FindNamed 'Mumble' $win3) -eq $null) { ClickNamedIn 'GitHub' $win3; Start-Sleep 2 }
          $dgRow = FindNamed 'Mumble' $win3
          if ($dgRow -eq $null) { Shot 'dg-row-missing'; throw 'Mumble row not found' }
          $dgItem = $dgRow
          while ($dgItem -ne $null -and $dgItem.Current.ControlType -ne [System.Windows.Automation.ControlType]::ListItem) { $dgItem = $walker.GetParent($dgItem) }
          $dgTarget = if ($dgItem -ne $null) { $dgItem } else { $dgRow }
          try { $dgTarget.GetCurrentPattern([System.Windows.Automation.ScrollItemPattern]::Pattern).ScrollIntoView(); Start-Sleep 1 } catch {}
          $dgr = $dgTarget.Current.BoundingRectangle
          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point([int]($dgr.X + $dgr.Width/2), [int]($dgr.Y + $dgr.Height/2))
          Start-Sleep -Milliseconds 300
          [M]::mouse_event(0x02,0,0,0,0); [M]::mouse_event(0x04,0,0,0,0)
          Start-Sleep 3
          ClickNamedIn 'Update' $win3
          Start-Sleep 2
          if ((FindNamed 'Downgrade blocked' $root) -eq $null) { Shot 'dg-not-blocked'; throw 'downgrade update was not blocked on the detail page' }
          Shot '33-downgrade-blocked'
          (FindNamed 'OK' $root).GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
          Start-Sleep 1
          ClickNamedIn 'Apps' $win3
          Start-Sleep 2
          'downgrade block verified'

          # Bulk download confirmation (skipBulkUpdateConfirmation default
          # off): the confirm dialog must list the set before any download;
          # cancelling starts nothing. Same render wait + group convergence
          # before touching rows.
          foreach ($w in 1..10) { Start-Sleep 1; if ((FindNamed 'Filter' $win3) -ne $null) { break } }
          if ((FindNamed 'ShareX' $win3) -eq $null) { ClickNamedIn 'GitHub' $win3; Start-Sleep 2 }
          if ((FindNamed 'ShareX' $win3) -eq $null) { ClickNamedIn 'GitHub' $win3; Start-Sleep 2 }
          ClickNamedIn 'Select' $win3
          Start-Sleep 1
          ClickPartial 'Notepad++' $win3 | Out-Null
          Start-Sleep -Milliseconds 500
          ClickPartial 'ShareX' $win3 | Out-Null
          Start-Sleep 1
          $batchDl = FindNamed 'Download updates' $win3
          if ($batchDl -eq $null) {
            # Crowded CommandBar: the button may live in the overflow menu.
            ClickNamedIn '...' $win3
            Start-Sleep 1
            $batchDl = FindNamed 'Download updates' $root
          }
          if ($batchDl -eq $null) { Shot 'bulk-button-missing'; throw 'Download updates button not found' }
          try { $batchDl.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke() } catch { ClickPartial 'Download updates' $root | Out-Null }
          Start-Sleep 2
          # Only updateable apps enter the bulk set (BatchDownload_Click
          # filters IsAppUpdateable): ShareX qualifies; Notepad++ was updated
          # to latest by the real install earlier in this run, so the count
          # is 1 unless it somehow stayed updateable (2).
          if ((FindNamed 'Download 1?' $root) -eq $null -and (FindNamed 'Download 2?' $root) -eq $null) { Shot 'bulk-confirm-missing'; throw 'bulk download confirmation did not list the set' }
          Shot '34-bulk-confirm'
          (FindNamed 'Cancel' $root).GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
          Start-Sleep 1
          ClickNamedIn 'Select' $win3
          Start-Sleep 1
          'bulk confirmation verified'

          # Certificate-pinning toggle renders and persists.
          AssertAlive 'pre-cert-settings'
          ClickNamedIn 'Settings' $win3
          Start-Sleep 3
          $pinToggle = FindNamed 'Enable certificate pinning' $win3
          if ($pinToggle -eq $null) { Shot 'pinning-toggle-missing'; throw 'certificate pinning toggle missing in Settings' }
          try { $pinToggle.GetCurrentPattern([System.Windows.Automation.TogglePattern]::Pattern).Toggle() } catch { ClickPartial 'Enable certificate pinning' $win3 | Out-Null }
          Start-Sleep 2
          $stJson = Get-Content (Join-Path $env:LOCALAPPDATA 'ObtainiumPC\settings.json') -Raw | ConvertFrom-Json
          if ($stJson.EnableCertificatePinning -ne $true) { Shot 'pinning-not-persisted'; throw 'certificate pinning toggle did not persist' }
          Shot '35-cert-pinning-on'
          try { $pinToggle.GetCurrentPattern([System.Windows.Automation.TogglePattern]::Pattern).Toggle() } catch { ClickPartial 'Enable certificate pinning' $win3 | Out-Null }
          Start-Sleep 1
          'certificate pinning toggle verified'

          # Navigation regression checks (a2733317): the detail Back button
          # and re-tapping the already-selected Apps nav item must each
          # return to the list; ordinary section changes must still navigate.
          ClickNamedIn 'Apps' $win3
          Start-Sleep 2
          foreach ($openTry in 1..2) {
            if ((FindNamed 'Notepad++' $win3) -eq $null) { ClickNamedIn 'GitHub' $win3; Start-Sleep 2 } else { break }
          }
          $nppRow = FindNamed 'Notepad++' $win3
          if ($nppRow -eq $null) { Shot 'nav-npp-missing'; throw 'Notepad++ row not found for navigation checks' }
          $nppItem = $nppRow
          while ($nppItem -ne $null -and $nppItem.Current.ControlType -ne [System.Windows.Automation.ControlType]::ListItem) { $nppItem = $walker.GetParent($nppItem) }
          $nppTarget = if ($nppItem -ne $null) { $nppItem } else { $nppRow }
          try { $nppTarget.GetCurrentPattern([System.Windows.Automation.ScrollItemPattern]::Pattern).ScrollIntoView(); Start-Sleep 1 } catch {}
          $nr = $nppTarget.Current.BoundingRectangle
          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point([int]($nr.X + $nr.Width/2), [int]($nr.Y + $nr.Height/2))
          Start-Sleep -Milliseconds 300
          [M]::mouse_event(0x02,0,0,0,0); [M]::mouse_event(0x04,0,0,0,0)
          Start-Sleep 3
          $backBtn = FindNamed 'Back' $win3
          if ($backBtn -eq $null) { Shot 'nav-back-missing'; throw 'detail Back button missing or unlabeled (accessible name required)' }
          "detail Back accessible name: [$($backBtn.Current.Name)]"
          ClickNamedIn 'Back' $win3
          Start-Sleep 2
          if ((FindNamed 'Filter' $win3) -eq $null) { Shot 'nav-back-failed'; throw 'detail Back button did not return to the Apps list' }
          # Re-open the same detail, then re-tap the already-selected Apps item.
          # GoBack re-creates the Apps page (uncached), so groups are back to
          # their collapsed default - converge the group open, then click and
          # retry until the detail actually renders.
          $reopened = $false
          foreach ($try in 1..3) {
            foreach ($w in 1..10) { Start-Sleep 1; if ((FindNamed 'Filter' $win3) -ne $null) { break } }
            if ((FindNamed 'Notepad++' $win3) -eq $null) { ClickNamedIn 'GitHub' $win3; Start-Sleep 2 }
            if ((FindNamed 'Notepad++' $win3) -eq $null) { ClickNamedIn 'GitHub' $win3; Start-Sleep 2 }
            $nppRow = FindNamed 'Notepad++' $win3
            if ($nppRow -eq $null) { continue }
            $nppItem = $nppRow
            while ($nppItem -ne $null -and $nppItem.Current.ControlType -ne [System.Windows.Automation.ControlType]::ListItem) { $nppItem = $walker.GetParent($nppItem) }
            $nppTarget = if ($nppItem -ne $null) { $nppItem } else { $nppRow }
            try { $nppTarget.GetCurrentPattern([System.Windows.Automation.ScrollItemPattern]::Pattern).ScrollIntoView(); Start-Sleep 1 } catch {}
            $nr = $nppTarget.Current.BoundingRectangle
            [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point([int]($nr.X + $nr.Width/2), [int]($nr.Y + $nr.Height/2))
            Start-Sleep -Milliseconds 300
            [M]::mouse_event(0x02,0,0,0,0); [M]::mouse_event(0x04,0,0,0,0)
            Start-Sleep 3
            if ((FindNamed 'Remove' $win3) -ne $null) { $reopened = $true; break }
          }
          if (-not $reopened) { Shot 'nav-reopen-failed'; throw 'detail page did not reopen for the re-tap check' }
          ClickNamedIn 'Apps' $win3
          Start-Sleep 2
          if ((FindNamed 'Filter' $win3) -eq $null) { Shot 'nav-retap-failed'; throw 're-tapping the selected Apps nav item did not return to the list' }
          Shot '36-nav-back-and-retap'
          # Ordinary section changes: Settings renders its Theme control, Apps
          # renders its Filter button; the ItemInvoked handler must not break
          # or double the normal SelectionChanged path.
          ClickNamedIn 'Settings' $win3
          Start-Sleep 2
          if ((FindNamed 'Theme' $win3) -eq $null) { Shot 'nav-settings-failed'; throw 'Settings section did not render after section change' }
          ClickNamedIn 'Apps' $win3
          Start-Sleep 2
          if ((FindNamed 'Filter' $win3) -eq $null) { Shot 'nav-apps-failed'; throw 'Apps section did not render after section change' }
          'navigation regression checks verified'

          # Every launch above went through the single-instance redirect.
          $procs = @(Get-Process ObtainiumPC -ErrorAction SilentlyContinue)
          "ObtainiumPC processes after deep links: $($procs.Count)"
          if ($procs.Count -ne 1) { Shot 'deeplink-instance-count'; throw "expected 1 ObtainiumPC process, found $($procs.Count)" }
          'deep links verified'
          Stop-Process -Id $p.Id -Force
      - name: Preserve app logs
        if: always()
        shell: pwsh
        run: |
          # Crash evidence: the app's logs.jsonl (with any unhandled-exception
          # entry) and the script-visible process state travel with the shots.
          $logs = Join-Path $env:LOCALAPPDATA 'ObtainiumPC\logs.jsonl'
          if (Test-Path $logs) { Copy-Item $logs shots\app-logs.jsonl }
          $procs = @(Get-Process ObtainiumPC -ErrorAction SilentlyContinue)
          "app processes at capture: $($procs.Count)" | Out-File shots\app-process-state.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-smoke-shots
          path: shots/
