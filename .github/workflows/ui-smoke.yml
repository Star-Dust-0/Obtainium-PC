name: UI smoke (manual)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref to build (default: main)'
        required: false
        default: 'main'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: microsoft/setup-msbuild@v2
      - name: Restore
        run: msbuild windows/ObtainiumPC.sln /t:Restore /p:Configuration=Release /p:Platform=x64
      - name: Build
        run: msbuild windows/ObtainiumPC.sln /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:SelfContained=true
      - name: Seed a tracked app (GitHub source)
        shell: pwsh
        env:
          SMOKE_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'ObtainiumPC'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $apps = @(
            @{
              id = 'seed-npp'; url = 'https://github.com/notepad-plus-plus/notepad-plus-plus'
              author = 'notepad-plus-plus'; name = 'Notepad++'
              apkUrls = '[]'; otherAssetUrls = '[]'; preferredApkIndex = 0
              additionalSettings = '{}'; categories = @(); pinned = $false; disabled = $false
              installedVersion = '7.0'
            }
            @{
              # Updatable (old recorded version) for the bulk-confirm scenario.
              id = 'seed-sharex'; url = 'https://github.com/ShareX/ShareX'
              author = 'ShareX'; name = 'ShareX'
              apkUrls = '[]'; otherAssetUrls = '[]'; preferredApkIndex = 0
              additionalSettings = '{}'; categories = @(); pinned = $false; disabled = $false
              installedVersion = '1.0'
            }
            @{
              # Recorded version far above the real latest: the downgrade
              # gate must block the update on the detail page.
              id = 'seed-dg'; url = 'https://github.com/mumble-voip/mumble'
              author = 'mumble-voip'; name = 'Mumble'
              apkUrls = '[]'; otherAssetUrls = '[]'; preferredApkIndex = 0
              additionalSettings = '{}'; categories = @(); pinned = $false; disabled = $false
              installedVersion = '999.0'
            }
            @{
              # Disabled: skipped by update checks, so the seeded changelog
              # survives. Exercises the MarkdownRenderer dialog (the Notepad++
              # changelog is a bare URL = link-only dialog).
              id = 'seed-md'; url = 'https://github.com/smoke/markdown-seed'
              author = 'smoke'; name = 'Markdown seed'
              apkUrls = '[]'; otherAssetUrls = '[]'; preferredApkIndex = 0
              additionalSettings = '{}'; categories = @(); pinned = $false; disabled = $true
              releaseDate = 1790208000000000
              changeLog = "## What's new`n`n- **Bold** fix`n- second item`n`n[Example link](https://example.com)"
            }
          )
          # -InputObject keeps a one-element array a JSON array (pipeline unrolls it).
          ConvertTo-Json -InputObject $apps -Depth 6 | Set-Content (Join-Path $dir 'apps.json')
          # Make the first-run state deterministic.
          # The runner's per-job token is throwaway and never leaves the runner;
          # it only raises the GitHub API rate limit for the live check.
          $settings = @{ FirstRunHandled = $true; UpdateIntervalMinutes = 360; CheckOnStart = $true; NotifyUpdates = $false; GitHubPersonalAccessToken = $env:SMOKE_GH_TOKEN; AutoExportOnChanges = $true; AutoExportPath = (Join-Path $dir 'auto-export.json'); UpdateHealthFailedChecksCount = 1; CategoryColors = @{ 'Smoke' = 16711680 } }
          ($settings | ConvertTo-Json) | Set-Content (Join-Path $dir 'settings.json')
      - name: Enable crash dumps
        shell: pwsh
        run: |
          # Native XAML fault 0xc000027b is intermittent: keep a full dump so the
          # managed/native stacks can be read instead of guessed.
          New-Item -ItemType Directory -Force C:\dumps | Out-Null
          $k = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\ObtainiumPC.exe'
          New-Item -Path $k -Force | Out-Null
          New-ItemProperty $k -Name DumpFolder -Value 'C:\dumps' -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty $k -Name DumpType -Value 2 -PropertyType DWord -Force | Out-Null
          New-ItemProperty $k -Name DumpCount -Value 3 -PropertyType DWord -Force | Out-Null
      - name: Launch and capture
        shell: pwsh
        env:
          SMOKE_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force shots | Out-Null
          # Screenshots capture the app window's actual bounds (set
          # $script:shotWin) so no console or desktop bleeds in; full screen
          # only when no window is tracked (e.g. the external installer).
          $script:shotWin = $null
          $dwmSrc = 'using System; using System.Runtime.InteropServices; public static class DwmFrame { [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left, Top, Right, Bottom; } [DllImport("dwmapi.dll")] public static extern int DwmGetWindowAttribute(IntPtr hwnd, int attr, out RECT rect, int size); public const int DWMWA_EXTENDED_FRAME_BOUNDS = 9; }'
          Add-Type -TypeDefinition $dwmSrc
          function Shot($name) {
            $b=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $x=$b.X; $y=$b.Y; $w=$b.Width; $h=$b.Height
            if ($script:shotWin -ne $null) {
              # UIA BoundingRectangle includes the invisible resize border, so
              # whatever sits behind the window (console, desktop) bleeds into
              # the capture. DWM extended frame bounds are the visible frame.
              try {
                $hwnd = [IntPtr]$script:shotWin.Current.NativeWindowHandle
                $fr = New-Object DwmFrame+RECT
                if ($hwnd -ne [IntPtr]::Zero -and
                    [DwmFrame]::DwmGetWindowAttribute($hwnd, [DwmFrame]::DWMWA_EXTENDED_FRAME_BOUNDS, [ref]$fr, 16) -eq 0) {
                  $fw = $fr.Right - $fr.Left; $fh = $fr.Bottom - $fr.Top
                  if ($fw -gt 50 -and $fh -gt 50) {
                    $x=$fr.Left; $y=$fr.Top; $w=$fw; $h=$fh
                  }
                } else {
                  $r=$script:shotWin.Current.BoundingRectangle
                  if ($r.Width -gt 50 -and $r.Height -gt 50) {
                    $x=[int]$r.X; $y=[int]$r.Y; $w=[int]$r.Width; $h=[int]$r.Height
                  }
                }
              } catch {}
            }
            $bmp=New-Object System.Drawing.Bitmap $w,$h
            $g=[System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen((New-Object System.Drawing.Point $x,$y),[System.Drawing.Point]::Empty,(New-Object System.Drawing.Size $w,$h))
            $bmp.Save("shots/$name.png"); $g.Dispose(); $bmp.Dispose()
          }
          $exe = 'windows\ObtainiumPC\bin\x64\Release\net8.0-windows10.0.19041.0\win-x64\ObtainiumPC.exe'
          $p = Start-Process $exe -PassThru
          Start-Sleep 12
          $p.Refresh()
          if ($p.HasExited) { Shot 'exited'; throw "app exited at launch (code $($p.ExitCode))" }
          Shot '01-apps-list-initial'
          # Let check-on-start resolve the seeded repo's version (ships real .exe assets).
          Start-Sleep 30
          $p.Refresh()
          if ($p.HasExited) { Shot 'exited-during-check'; throw "app exited during update check (code $($p.ExitCode))" }
          Shot '02-apps-list-after-check'
          $apps = Get-Content (Join-Path $env:LOCALAPPDATA 'ObtainiumPC\apps.json') -Raw
          "== seeded store after check =="; $apps
          $logs = Join-Path $env:LOCALAPPDATA 'ObtainiumPC\logs.jsonl'
          if (Test-Path $logs) { "== logs =="; Get-Content $logs | Select-Object -First 20 }

          # Page walkthrough: click each nav item via UIA + real mouse input,
          # screenshotting every page. The token field is a PasswordBox
          # (masked), so no screenshot can leak the seeded token.
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public class M { [DllImport("user32.dll")] public static extern void mouse_event(uint f, uint dx, uint dy, uint d, int e); }'
          $root = [System.Windows.Automation.AutomationElement]::RootElement
          $wcond = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ProcessIdProperty, $p.Id)
          $win = $root.FindFirst([System.Windows.Automation.TreeScope]::Children, $wcond)
          if ($win -eq $null) { throw 'main window not found for walkthrough' }
          $script:shotWin = $win
          function ClickNamed($name, $verifyName) {
            # Invoke/click, then (when a verification element is given) confirm
            # it appears, retrying the click - one stray click must not derail
            # the whole walkthrough.
            foreach ($attempt in 1..3) {
              $c = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, $name)
              $el = $win.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $c)
              if ($el -eq $null) {
                if ($attempt -eq 3) { throw "nav item '$name' not found" }
                Start-Sleep 1; continue
              }
              $invoked = $false
              try { $el.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke(); $invoked = $true } catch {}
              if (-not $invoked) {
                $r = $el.Current.BoundingRectangle
                [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point([int]($r.X + $r.Width/2), [int]($r.Y + $r.Height/2))
                Start-Sleep -Milliseconds 300
                [M]::mouse_event(0x02,0,0,0,0); [M]::mouse_event(0x04,0,0,0,0)
              }
              if (-not $verifyName) { return }
              foreach ($w in 1..6) {
                Start-Sleep 1
                $vc = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, $verifyName)
                if ($win.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $vc) -ne $null) { return }
              }
            }
            throw "clicking '$name' never produced '$verifyName'"
          }
          $pages = @(
            @('Add App', '03-add-app'),
            @('Update Health', '04-update-health'),
            @('Import / Export', '05-import-export'),
            @('Logs', '06-logs'),
            @('Settings', '07-settings'),
            @('Apps', '08-apps-final')
          )
          foreach ($pg in $pages) {
            ClickNamed $pg[0]
            Start-Sleep 3
            $p.Refresh()
            if ($p.HasExited) { Shot "exited-on-$($pg[1])"; throw "app exited navigating to $($pg[0]) (code $($p.ExitCode))" }
            Shot $pg[1]
          }

          # --- Interaction testing ---
          $root = [System.Windows.Automation.AutomationElement]::RootElement
          function ClickPartial($prefix, $scope) {
            $all = $scope.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)
            foreach ($el in $all) {
              $n = $el.Current.Name
              if ($n -and $n.StartsWith($prefix)) {
                $r = $el.Current.BoundingRectangle
                if ($r.Width -gt 10 -and $r.Height -gt 10) {
                  [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point([int]($r.X + $r.Width/2), [int]($r.Y + $r.Height/2))
                  Start-Sleep -Milliseconds 300
                  [M]::mouse_event(0x02,0,0,0,0); [M]::mouse_event(0x04,0,0,0,0)
                  return $el
                }
              }
            }
            Shot "missing-$($prefix -replace '[^\w]','_')"
            throw "element starting with '$prefix' not found"
          }
          function FindNamed($name, $scope) {
            $c = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, $name)
            return $scope.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $c)
          }
          # The list is virtualized and the viewport is small: realize an off-screen row by wheel-scrolling.
          function FindNamedScrolling($name, $scope) {
            $el = FindNamed $name $scope
            if ($el -ne $null) { return $el }
            $wr = $scope.Current.BoundingRectangle
            [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point([int]($wr.X + $wr.Width/2), [int]($wr.Y + $wr.Height/2))
            foreach ($k in 1..8) {
              [M]::mouse_event(0x0800,0,0,[uint32]4294967176,0)
              Start-Sleep -Milliseconds 400
              $el = FindNamed $name $scope
              if ($el -ne $null) { return $el }
            }
            return $null
          }

          function ClickPaneToggle($win) {
            # Guarded pane-toggle click: real toggles sit in the nav rail
            # BELOW the title bar, inside the window bounds. WinUI templates
            # expose phantom 'Open Navigation' nodes whose rects land on the
            # caption close button (run 40211348160 - an unguarded click
            # closed the app window), so candidates are rect-filtered.
            $wrect = $win.Current.BoundingRectangle
            $cands = @()
            foreach ($bn in 'Open Navigation','Close Navigation') {
              $cond = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, $bn)
              $cands += @($win.FindAll([System.Windows.Automation.TreeScope]::Descendants, $cond))
            }
            foreach ($c in $cands) {
              $r = $c.Current.BoundingRectangle
              $cx = $r.X + $r.Width/2; $cy = $r.Y + $r.Height/2
              $insideX = ($cx -gt ($wrect.X + 8)) -and ($cx -lt ($wrect.X + $wrect.Width - 8))
              $belowTitle = $cy -gt ($wrect.Y + 40)
              $saneSize = ($r.Width -ge 20 -and $r.Width -le 80 -and $r.Height -ge 20 -and $r.Height -le 80)
              if (-not ($insideX -and $belowTitle -and $saneSize)) { continue }
              [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point([int]$cx, [int]$cy)
              Start-Sleep -Milliseconds 300
              [M]::mouse_event(0x02,0,0,0,0); [M]::mouse_event(0x04,0,0,0,0)
              Start-Sleep 2
              return $true
            }
            return $false
          }
          function DumpNames($scope, $tag) {
            # Evidence for name-miss failures: what UIA actually sees.
            try {
              $all = $scope.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)
              $names = @()
              foreach ($el in $all) { $n = $el.Current.Name; if ($n) { $names += $n }; if ($names.Count -ge 40) { break } }
              "UIA names at ${tag}: $($names -join ' | ')"
            } catch { "UIA name dump failed at ${tag}: $($_.Exception.Message)" }
          }
          function AssertInsideWindow($name, $scope, $winEl) {
            # A control that exists in UIA but is clipped out of view must fail:
            # its bounding rectangle has to sit inside the window rectangle.
            $el = FindNamed $name $scope
            if ($el -eq $null) { throw "toolbar control '$name' not found" }
            $r = $el.Current.BoundingRectangle; $w = $winEl.Current.BoundingRectangle
            if ([double]::IsInfinity($r.X) -or [double]::IsNaN($r.X) -or $r.X -lt $w.X -or ($r.X + $r.Width) -gt ($w.X + $w.Width) -or $r.Width -le 0) {
              Shot "clipped-$($name -replace '[^\w]','_')"
              throw "toolbar control '$name' is outside the visible window ($($r.X),$($r.Width) vs $($w.X),$($w.Width))"
            }
            "toolbar control '$name' visible inside window"
          }
          function AssertAlive($tag) {
            $p.Refresh()
            if ($p.HasExited) { Shot "exited-$tag"; throw "app exited at $tag (code $($p.ExitCode))" }
          }

          # App detail page (click the app card).
          ClickPartial 'Notepad' $win | Out-Null
          Start-Sleep 3; AssertAlive 'detail'; Shot '09-app-detail'

          # The OS app-settings gear must be DISABLED for this unpackaged app.
          $gear = FindNamed 'App settings' $win
          if ($gear -eq $null) { throw 'gear button not found on detail page' }
          "gear IsEnabled = $($gear.Current.IsEnabled)"
          if ($gear.Current.IsEnabled) { throw 'OS app settings gear must be disabled for unpackaged apps' }

          # Download safe completion: Update downloads the asset; poll for the file.
          # The detail primary action reads 'Update' when a newer version is
          # available for an installed app, 'Install' when nothing is recorded
          # (upstream lib/pages/app.dart). The seed records 7.0, so expect
          # Update; accept Install to keep the harness honest either way.
          # Upstream always shows the asset picker on manual download
          # (confirmAppFileUrl evenIfSingleChoice: true).
          if ((FindNamed 'Update' $win) -ne $null) { ClickNamed 'Update' } else { ClickNamed 'Install' }
          Start-Sleep 3
          $dlg = FindNamed 'Choose a file' $root
          if ($dlg -eq $null) { Shot 'no-asset-picker'; throw 'asset picker dialog did not appear after Install' }
          $picked = $false
          foreach ($want in @('Installer.x64.exe', 'Installer.exe')) {
            $all = $dlg.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)
            foreach ($el in $all) {
              if ($el.Current.Name -like "*$want*" -and $el.Current.ControlType -eq [System.Windows.Automation.ControlType]::RadioButton) {
                $r = $el.Current.BoundingRectangle
                [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point([int]($r.X + $r.Width/2), [int]($r.Y + $r.Height/2))
                Start-Sleep -Milliseconds 300
                [M]::mouse_event(0x02,0,0,0,0); [M]::mouse_event(0x04,0,0,0,0)
                "picked asset: $($el.Current.Name)"
                $picked = $true
                break
              }
            }
            if ($picked) { break }
          }
          if (-not $picked) { Shot 'asset-not-found'; throw 'installer asset not found in picker' }
          Start-Sleep 1
          ClickNamed 'Download'
          # Progress panel may flash by on a fast runner; the downloaded file
          # below is the hard check, the panel sighting is logged best-effort.
          foreach ($i in 1..5) {
            Start-Sleep 1
            if ((FindNamed 'Download progress' $root) -ne $null) { "progress panel seen"; break }
          }
          $dlDir = Join-Path $env:USERPROFILE 'Downloads\ObtainiumPC'
          $file = $null
          foreach ($i in 1..40) {
            Start-Sleep 3
            $file = Get-ChildItem $dlDir -Filter '*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($file -and $file.Length -gt 1000000) { break }
          }
          AssertAlive 'download'; Shot '11-download-complete'
          if (-not $file) { throw 'download did not produce a file' }
          "downloaded: $($file.FullName) ($($file.Length) bytes)"

          # Real install: the app launched the NSIS wizard interactively
          # (visible window = the interactive-launch proof). Driving NSIS
          # pages via UIA proved flaky on the runner (Enter/focus timing),
          # so the harness closes the wizard and completes the SAME installer
          # silently (NSIS /S) purely to reach the installed state; the
          # detection assertions below are the actual feature under test.
          $regPath = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Notepad++'
          $setupWin = $null
          foreach ($i in 1..20) {
            $setupWin = FindNamed 'Notepad++ v8.9.8.1 Setup' $root
            if ($setupWin -eq $null) { $setupWin = FindNamed 'Installer Language' $root }
            if ($setupWin -ne $null) { break }
            Start-Sleep 2
          }
          $script:shotWin = $null  # capture the external installer full-screen
          if ($setupWin -eq $null) { Shot 'installer-never-launched'; throw 'app did not launch the installer interactively' }
          'interactive installer window confirmed'
          Shot '11a-installer-launched'
          Get-Process | Where-Object { $_.Name -like '*npp*Installer*' -or $_.MainWindowTitle -like '*Notepad++*Setup*' } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep 2
          Start-Process $file.FullName -ArgumentList '/S' -Wait
          $reg = Get-ItemProperty $regPath -ErrorAction SilentlyContinue
          if ($reg -eq $null) { Shot 'silent-install-failed'; throw 'silent install did not create the registry entry' }
          "registry DisplayVersion: $($reg.DisplayVersion)"
          Shot '11b-install-finished'
          $script:shotWin = $win
          # The app must now detect the installed version via registry.
          ClickNamed 'Detect installed version now'
          Start-Sleep 3
          AssertAlive 'detect'; Shot '11c-detected-installed'
          $installedText = $null
          $allEls2 = $win.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)
          foreach ($el in $allEls2) {
            if ($el.Current.Name -like 'Installed: *') { $installedText = $el.Current.Name; break }
          }
          "installed text: $installedText"
          $btnCond = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty, [System.Windows.Automation.ControlType]::Button)
          $allBtns = $win.FindAll([System.Windows.Automation.TreeScope]::Descendants, $btnCond)
          foreach ($be in $allBtns) { "button UIA: name=[$($be.Current.Name)] enabled=$($be.Current.IsEnabled)" }
          if ($installedText -notlike '*8.9.8.1*') { throw "detection did not surface the installed version (got: $installedText)" }
          Get-Process | Where-Object { $_.Name -like 'notepad++*' } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep 2

          # Per-app options page (last detail-page stop; verified nav).
          ClickNamed 'Options' 'Notepad++ options'
          Start-Sleep 2; AssertAlive 'options'; Shot '10-app-options'

          # Settings scrolled capture (best effort) and theme persistence.
          ClickNamed 'Settings' 'Theme'
          Start-Sleep 2
          try {
            $allEls = $win.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)
            foreach ($el in $allEls) {
              $sp = $null
              try { $sp = $el.GetCurrentPattern([System.Windows.Automation.ScrollPattern]::Pattern) } catch {}
              if ($sp -ne $null -and $sp.Current.VerticallyScrollable) {
                $sp.ScrollVertical([System.Windows.Automation.ScrollAmount]::LargeIncrement)
                $sp.ScrollVertical([System.Windows.Automation.ScrollAmount]::LargeIncrement)
                break
              }
            }
            Start-Sleep 2
          } catch { 'scroll capture unsupported: ' + $_.Exception.Message }
          Shot '07b-settings-scrolled'
          # Approved additions: Updates guards (default off, persisted) and the per-category
          # Skip update checks switch. Each switch is found by name, scrolled into view,
          # toggled on, verified in settings.json, then restored.
          function ScrollToName($name) {
            $el = FindNamed $name $win
            if ($el -eq $null) { return $null }
            try { $el.GetCurrentPattern([System.Windows.Automation.ScrollItemPattern]::Pattern).ScrollIntoView() } catch { 'scroll-into-view unsupported for ' + $name }
            Start-Sleep 1
            return $el
          }
          function ToggleByName($name) {
            $el = ScrollToName $name
            if ($el -eq $null) { return $null }
            $tp = $el.GetCurrentPattern([System.Windows.Automation.TogglePattern]::Pattern)
            $tp.Toggle()
            Start-Sleep 1
            return $tp
          }
          $setPath = Join-Path $env:LOCALAPPDATA 'ObtainiumPC\settings.json'
          $mEl = ScrollToName "Don't check on a metered connection"
          if ($mEl -eq $null) { Shot 'guards-missing'; throw "Settings has no metered-connection guard switch" }
          $bEl = FindNamed "Don't check on battery power" $win
          if ($bEl -eq $null) { Shot 'guards-missing'; throw "Settings has no battery guard switch" }
          if ($mEl.GetCurrentPattern([System.Windows.Automation.TogglePattern]::Pattern).Current.ToggleState -ne 'Off') { throw 'metered guard is not off by default' }
          $bEl2 = ScrollToName "Don't check on battery power"
          Shot '38-settings-update-guards'
          $tp = ToggleByName "Don't check on a metered connection"
          Shot '38b-settings-metered-guard-on'
          $json = Get-Content $setPath -Raw | ConvertFrom-Json
          if (-not $json.SkipBackgroundChecksOnMeteredConnection) { throw 'metered guard switch did not persist to settings.json' }
          $tp.Toggle(); Start-Sleep 1
          $json = Get-Content $setPath -Raw | ConvertFrom-Json
          if ($json.SkipBackgroundChecksOnMeteredConnection) { throw 'metered guard did not turn back off' }
          "update guards verified (default off, persists, restores)"
          $catName = 'Skip update checks: Smoke'
          # Categories sits far below Updates and is virtualized: page down until the row is realized.
          $pageSp = $null
          foreach ($el in $win.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)) {
            $sp = $null
            try { $sp = $el.GetCurrentPattern([System.Windows.Automation.ScrollPattern]::Pattern) } catch {}
            if ($sp -ne $null -and $sp.Current.VerticallyScrollable) { $pageSp = $sp; break }
          }
          foreach ($k in 1..40) {
            if ((FindNamed $catName $win) -ne $null) { break }
            if ($pageSp -ne $null) { $pageSp.ScrollVertical([System.Windows.Automation.ScrollAmount]::LargeIncrement) }
            Start-Sleep -Milliseconds 700
          }
          $cEl = ScrollToName $catName
          if ($cEl -eq $null) { Shot 'category-switch-missing'; throw 'Settings > Categories has no Skip update checks switch for the seeded category' }
          Shot '39-settings-category-skip-off'
          $tp = ToggleByName $catName
          Shot '39b-settings-category-skip-on'
          $json = Get-Content $setPath -Raw | ConvertFrom-Json
          if (@($json.CategoriesExcludedFromChecks) -notcontains 'Smoke') { throw 'category skip switch did not persist to settings.json' }
          $tp.Toggle(); Start-Sleep 1
          $json = Get-Content $setPath -Raw | ConvertFrom-Json
          if (@($json.CategoriesExcludedFromChecks) -contains 'Smoke') { throw 'category skip switch did not turn back off' }
          "category skip switch verified (persists, restores)"
          $comboType = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty, [System.Windows.Automation.ControlType]::ComboBox)
          $combos = $win.FindAll([System.Windows.Automation.TreeScope]::Descendants, $comboType)
          if ($combos.Count -eq 0) { throw 'no combo boxes on Settings page' }
          try { $combos[0].GetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern).Expand() } catch { ClickPartial $combos[0].Current.Name $win | Out-Null }
          Start-Sleep 2
          # ComboBox dropdown items live in a popup window: search from the desktop root.
          ClickPartial 'Dark' $root | Out-Null
          Start-Sleep 2
          Shot '12-settings-dark'
          # The switch is live (no restart): another page must render dark too.
          ClickNamed 'Logs'
          Start-Sleep 3; AssertAlive 'logs-dark-live'; Shot '12b-logs-dark-live'

          # Restart and verify the theme persisted.
          Stop-Process -Id $p.Id -Force
          Start-Sleep 3
          $p = Start-Process $exe -PassThru
          Start-Sleep 12; AssertAlive 'relaunch'
          $wcond2 = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ProcessIdProperty, $p.Id)
          $win2 = $root.FindFirst([System.Windows.Automation.TreeScope]::Children, $wcond2)
          if ($win2 -eq $null) { throw 'main window not found after relaunch' }
          $script:shotWin = $win2
          Shot '13-theme-persisted'
          $savedSettings = Get-Content (Join-Path $env:LOCALAPPDATA 'ObtainiumPC\settings.json') -Raw
          if ($savedSettings -notmatch '"Theme"\s*:\s*"dark"') { throw 'theme not persisted to settings.json' }
          'theme persisted in settings.json'

          # Arabic RTL: switch language via the Settings Language combo, verify
          # translated chrome + persistence, then switch back (reversibility).
          function ClickNamedIn($name, $scope) {
            # Retry: UIA lookups can race a page re-layout (one transient miss
            # after the health page refresh cost a full run).
            $el = $null
            foreach ($attempt in 1..6) {
              $navIds = @{ 'Apps'='Nav_apps'; 'التطبيقات'='Nav_apps'; 'Add App'='Nav_addapp'; 'Update Health'='Nav_updatehealth'; 'Import / Export'='Nav_importexport'; 'Logs'='Nav_logs'; 'Settings'='Nav_settings' }
              if ($navIds.ContainsKey($name)) {
                # Stable AutomationId (language independent, cannot collide with a page title).
                $ci = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::AutomationIdProperty, $navIds[$name])
                $el = $scope.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $ci)
                if ($el -ne $null) { break }
              }
              $c = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, $name)
              $el = $scope.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $c)
              if ($el -ne $null) { break }
              Start-Sleep 1
            }
            if ($el -eq $null) { Shot "missing-$($name -replace '[^\w]','_')"; throw "element '$name' not found" }
            try { $el.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke() } catch {
              $r = $el.Current.BoundingRectangle
              [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point([int]($r.X + $r.Width/2), [int]($r.Y + $r.Height/2))
              Start-Sleep -Milliseconds 300
              [M]::mouse_event(0x02,0,0,0,0); [M]::mouse_event(0x04,0,0,0,0)
            }
          }
          # Group headers only exist while the list has more than one source group (the
          # Android store groups are gone in the Windows-only seed), so toggling is optional.
          function ToggleGroupIfPresent($name, $scope) {
            if ((FindNamed $name $scope) -ne $null) { ClickNamedIn $name $scope }
          }
          ClickNamedIn 'Settings' $win2
          Start-Sleep 3
          $combos = $win2.FindAll([System.Windows.Automation.TreeScope]::Descendants, $comboType)
          if ($combos.Count -lt 2) { throw 'language combo not found on Settings page' }
          try { $combos[1].GetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern).Expand() } catch { ClickPartial $combos[1].Current.Name $win2 | Out-Null }
          Start-Sleep 2
          # The full locale list is virtualized; off-screen items are absent
          # from UIA. العربية is 3rd from the end: END, UP x2, ENTER.
          [System.Windows.Forms.SendKeys]::SendWait('{END}')
          Start-Sleep -Milliseconds 400
          [System.Windows.Forms.SendKeys]::SendWait('{UP}')
          Start-Sleep -Milliseconds 300
          [System.Windows.Forms.SendKeys]::SendWait('{UP}')
          Start-Sleep -Milliseconds 300
          [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
          Start-Sleep 4
          if ((FindNamed 'التطبيقات' $win2) -eq $null) { Shot 'arabic-nav-missing'; throw 'Arabic nav label missing after keyboard selection' }
          AssertAlive 'arabic-switch'
          $found = $false
          foreach ($w in 1..15) {
            Start-Sleep 1
            if ((FindNamed 'التطبيقات' $win2) -ne $null) { $found = $true; break }
          }
          if (-not $found) { Shot 'arabic-missing'; throw 'Arabic nav label not found after language switch' }
          Shot '15-arabic-rtl-settings'
          if (ClickPaneToggle $win2) {
            Shot '15b-arabic-rtl-nav-pane'
            Start-Sleep 1
            $null = ClickPaneToggle $win2
          } else { "WARNING: guarded pane toggle not found for 15b-arabic-rtl-nav-pane - pane pixel evidence missing" }
          $savedSettings = Get-Content (Join-Path $env:LOCALAPPDATA 'ObtainiumPC\settings.json') -Raw
          if ($savedSettings -notmatch '"Language"\s*:\s*"ar"') { throw 'language not persisted to settings.json' }
          'language persisted as ar'
          ClickNamedIn 'التطبيقات' $win2
          Start-Sleep 3
          AssertAlive 'arabic-apps'; Shot '16-arabic-rtl-apps'
          AssertInsideWindow 'تحديد' $win2 $win2
          AssertInsideWindow 'تصفية' $win2 $win2
          # 16b) Arabic source error: ImranR98/Obtainium releases are APK-only, so adding it raises the
          # Android-app-not-supported error. It must render in Arabic.
          Start-Process $exe -ArgumentList 'obtainium://add?url=https%3A%2F%2Fgithub.com%2FImranR98%2FObtainium'
          Start-Sleep 4
          AssertAlive 'arabic-error-add'
          $addBtnCond = New-Object System.Windows.Automation.AndCondition(
            (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, 'إضافة')),
            (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty, [System.Windows.Automation.ControlType]::Button)))
          $addBtn = $win2.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $addBtnCond)
          if ($addBtn -eq $null) { Shot 'arabic-error-add-button-missing'; throw 'Arabic Add button not found on Add App page' }
          try { $addBtn.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke() } catch { ClickNamedIn 'إضافة' $win2 }
          $errShown = $false
          foreach ($i in 1..30) {
            Start-Sleep 1
            foreach ($el in $win2.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)) {
              if ($el.Current.Name -like '*أندرويد*ويندوز*') { $errShown = $true; "arabic source error text: " + $el.Current.Name; break }
            }
            if ($errShown) { break }
          }
          Shot '16b-arabic-source-error'
          if (-not $errShown) { throw 'Arabic Android-not-supported error text not shown on Add App' }
          ClickNamedIn 'التطبيقات' $win2
          Start-Sleep 2
          ClickNamedIn 'الإعدادات' $win2
          Start-Sleep 3
          $combos = $win2.FindAll([System.Windows.Automation.TreeScope]::Descendants, $comboType)
          try { $combos[1].GetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern).Expand() } catch { ClickPartial $combos[1].Current.Name $win2 | Out-Null }
          Start-Sleep 2
          # Keyboard selection (virtualized list): English is index 1.
          [System.Windows.Forms.SendKeys]::SendWait('{HOME}')
          Start-Sleep -Milliseconds 400
          [System.Windows.Forms.SendKeys]::SendWait('{DOWN}')
          Start-Sleep -Milliseconds 300
          [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
          Start-Sleep 4
          AssertAlive 'english-switch'
          $found = $false
          foreach ($w in 1..15) {
            Start-Sleep 1
            if ((FindNamed 'Apps' $win2) -ne $null) { $found = $true; break }
          }
          if (-not $found) {
            # The page can be fully re-localized (Settings renders English)
            # while the collapsed nav pane's item names go stale in UIA (run
            # 40203139396: app alive, English UI, 'Apps' missing 15s). Dump
            # what UIA sees, refind the window, open the pane with a REAL
            # mouse click at an on-screen burger (Invoke on a stale node
            # silently no-ops; run 40206305872), shoot the open pane for
            # pixel evidence of the actual label language, then re-poll -
            # loudly, never silently.
            DumpNames $win2 'english-restore-first-poll'
            $win2 = $root.FindFirst([System.Windows.Automation.TreeScope]::Children, $wcond2)
            if (-not (ClickPaneToggle $win2)) { "WARNING: no guarded pane toggle candidate in english-restore recovery" }
            Shot 'english-restore-pane-open'
            foreach ($w in 1..10) {
              Start-Sleep 1
              if ((FindNamed 'Apps' $win2) -ne $null) { $found = $true; break }
            }
            if ($found) { "WARNING: English nav names needed pane-open recovery after the language restore (see the UIA dump above)" }
          }
          if (-not $found) { DumpNames $win2 'english-restore-final'; Shot 'english-missing'; throw 'English nav label not found after switching back' }
          Shot '17-back-to-english'
          if (ClickPaneToggle $win2) {
            Shot '17b-english-nav-pane'
            Start-Sleep 1
            $null = ClickPaneToggle $win2
          } else { "WARNING: guarded pane toggle not found for 17b-english-nav-pane - pane pixel evidence missing" }
          $savedSettings = Get-Content (Join-Path $env:LOCALAPPDATA 'ObtainiumPC\settings.json') -Raw
          if ($savedSettings -notmatch '"Language"\s*:\s*"en"') { throw 'language not persisted back to en' }
          'language reverted to en'
          ClickNamedIn 'Apps' $win2
          Start-Sleep 3

          # Smaller window: resize and validate the layout survives.
          $wcond2 = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ProcessIdProperty, $p.Id)
          $win2 = $root.FindFirst([System.Windows.Automation.TreeScope]::Children, $wcond2)
          if ($win2 -eq $null) { throw 'main window not found after relaunch' }
          Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public class W { [DllImport("user32.dll")] public static extern bool SetWindowPos(System.IntPtr h, System.IntPtr after, int x, int y, int cx, int cy, uint flags); }'
          [W]::SetWindowPos([IntPtr]$win2.Current.NativeWindowHandle, [IntPtr]::Zero, 100, 60, 700, 480, 0x4) | Out-Null
          Start-Sleep 3
          AssertAlive 'small-window'; Shot '14-small-window'

          # ---- obtainium:// deep links (single-instance redirect + interpretLink) ----
          # Registration was applied on startup; HKCU on the disposable runner only.
          $dlCmd = (Get-ItemProperty 'HKCU:\Software\Classes\obtainium\shell\open\command' -ErrorAction SilentlyContinue).'(default)'
          "deeplink command: $dlCmd"
          if ($dlCmd -notlike '*ObtainiumPC*') { Shot 'deeplink-not-registered'; throw 'obtainium:// not registered by the app' }

          # 1) add -> existing app: the tracked npp repo opens its detail page.
          Start-Process $exe -ArgumentList 'obtainium://add?url=https%3A%2F%2Fgithub.com%2Fnotepad-plus-plus%2Fnotepad-plus-plus'
          Start-Sleep 5
          AssertAlive 'deeplink-add-existing'
          $nppCond = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, 'Notepad++')
          if ($root.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $nppCond) -eq $null) { Shot 'deeplink-add-existing-missing'; throw 'deep-link add did not open the existing app detail page' }
          Shot '18-deeplink-add-existing'
          ClickNamedIn 'Apps' $win2
          Start-Sleep 2

          # 2) add -> new URL: Add App opens prefilled.
          Start-Process $exe -ArgumentList 'obtainium://add?url=https%3A%2F%2Fgithub.com%2FImranR98%2FObtainium'
          Start-Sleep 4
          AssertAlive 'deeplink-add-prefill'
          $editCond = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty, [System.Windows.Automation.ControlType]::Edit)
          $prefilled = $false
          foreach ($e in $root.FindAll([System.Windows.Automation.TreeScope]::Descendants, $editCond)) {
            try { if ($e.GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern).Current.Value -like '*ImranR98/Obtainium*') { $prefilled = $true } } catch {}
          }
          if (-not $prefilled) { Shot 'deeplink-prefill-missing'; throw 'deep-link add did not prefill Add App' }
          Shot '19-deeplink-add-prefill'
          ClickNamedIn 'Apps' $win2
          Start-Sleep 2

          # 2b) Shuck through the real Add-app flow. The installer is fetched from the GitHub
          # asset API (needs Accept: application/octet-stream), installed silently (NSIS /S,
          # per-user, disposable runner), then added through the UI so detection, the row
          # icon and the detail page are exercised end to end.
          $shuckExe = Join-Path $env:RUNNER_TEMP 'shuck-1.0.0-setup.exe'
          $shHeaders = @{ Accept = 'application/octet-stream'; 'User-Agent' = 'obtainium-pc-smoke' }
          if ($env:SMOKE_GH_TOKEN) { $shHeaders['Authorization'] = "Bearer $($env:SMOKE_GH_TOKEN)" }  # runner IPs share the anonymous API rate limit
          foreach ($try in 1..3) { try { Invoke-WebRequest -Uri 'https://api.github.com/repos/shuck-app/shuck/releases/assets/654113536' -Headers $shHeaders -OutFile $shuckExe; break } catch { if ($try -eq 3) { throw }; Start-Sleep 20 } }
          $shuckLen = (Get-Item $shuckExe).Length
          "shuck installer bytes: $shuckLen"
          if ($shuckLen -ne 6285430) { throw "shuck v1.0.0 installer size $shuckLen (expected 6285430)" }
          $sp = Start-Process $shuckExe -ArgumentList '/S' -PassThru
          if (-not $sp.WaitForExit(120000)) { throw 'shuck silent install timed out' }
          "shuck installer exit code: $($sp.ExitCode)"
          Start-Process $exe -ArgumentList 'obtainium://add?url=https%3A%2F%2Fgithub.com%2Fshuck-app%2Fshuck'
          Start-Sleep 4
          AssertAlive 'shuck-add-prefill'
          Shot '23-shuck-add-prefilled'
          ClickNamedIn 'Add' $win2
          Start-Sleep 15
          AssertAlive 'shuck-add'
          Shot '24-shuck-after-add'
          ClickNamedIn 'Apps' $win2
          Start-Sleep 4
          Shot '25-shuck-in-list'
          $shuckRow = $null
          foreach ($el in $root.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)) {
            if ($el.Current.Name -like 'shuck*' -or $el.Current.Name -like 'Shuck*') { $shuckRow = $el; "shuck row UIA name: [$($el.Current.Name)]"; break }
          }
          if ($shuckRow -eq $null) { Shot 'shuck-row-missing'; throw 'Shuck was not added to the apps list through the Add flow' }
          if ($shuckRow.Current.Name -like '*not installed*') { Shot 'shuck-not-detected'; throw 'Shuck is installed (registry) but the Add flow left it as not installed' }
          ClickPartial $shuckRow.Current.Name.Substring(0,5) $win2 | Out-Null
          Start-Sleep 4
          AssertAlive 'shuck-detail'
          Shot '26-shuck-detail'
          # Outdated installed app, real registry evidence: v1.0.0 is installed (registry), the
          # latest release is v1.0.1. The detail must show both versions, offer Update, and the
          # update flow (download -> interactive installer -> detection) must end at 1.0.1.
          $shReg = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*','HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like 'Shuck*' } | Select-Object -First 1
          "registry before update: $($shReg.DisplayName) $($shReg.DisplayVersion)"
          $inst0 = $null; $lat0 = $null
          foreach ($el in $win2.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)) {
            if ($el.Current.Name -like 'Installed: *') { $inst0 = $el.Current.Name }
            if ($el.Current.Name -like 'Latest: *') { $lat0 = $el.Current.Name }
          }
          "shuck before update: [$inst0] [$lat0]"
          if ($inst0 -notlike '*1.0.0*') { Shot 'shuck-outdated-installed-wrong'; throw "outdated app: installed version not detected as 1.0.0 (got: $inst0)" }
          if ($lat0 -notlike '*1.0.1*') { Shot 'shuck-outdated-latest-wrong'; throw "outdated app: latest not 1.0.1 (got: $lat0)" }
          $upd0 = FindNamed 'Update' $win2
          if ($upd0 -eq $null -or -not $upd0.Current.IsEnabled) { Shot 'shuck-update-disabled'; throw 'Update action is not enabled for an outdated installed app' }
          Shot '26b-shuck-outdated-detail'
          ClickNamedIn 'Update' $win2
          Start-Sleep 3
          $shDlg = FindNamed 'Choose a file' $root
          if ($shDlg -eq $null) { Shot 'shuck-no-picker'; throw 'asset picker did not appear for the Shuck update' }
          $shPicked = $false
          foreach ($el in $shDlg.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)) {
            if ($el.Current.Name -like '*Shuck_1.0.1_x64-setup.exe*' -and $el.Current.ControlType -eq [System.Windows.Automation.ControlType]::RadioButton) {
              $r = $el.Current.BoundingRectangle
              [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point([int]($r.X + $r.Width/2), [int]($r.Y + $r.Height/2))
              Start-Sleep -Milliseconds 300
              [M]::mouse_event(0x02,0,0,0,0); [M]::mouse_event(0x04,0,0,0,0)
              $shPicked = $true; break
            }
          }
          if (-not $shPicked) { DumpNames $shDlg 'shuck-picker'; Shot 'shuck-asset-not-found'; throw 'Shuck 1.0.1 installer not offered in the picker' }
          Shot '26c-shuck-update-picker'
          Start-Sleep 1
          ClickNamedIn 'Download' $root
          $shFile = $null
          foreach ($i in 1..40) {
            Start-Sleep 3
            $shFile = Get-ChildItem (Join-Path $env:USERPROFILE 'Downloads\ObtainiumPC') -Filter 'Shuck*1.0.1*setup*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($shFile -and $shFile.Length -gt 1000000) { break }
          }
          if (-not $shFile) { Shot 'shuck-update-no-download'; throw 'Shuck update download did not produce the 1.0.1 installer' }
          "shuck update downloaded: $($shFile.Name) ($($shFile.Length) bytes)"
          Start-Sleep 4
          $shInstalling = @(Get-Process | Where-Object { $_.Name -like 'Shuck*setup*' })
          "interactive installer processes launched by the app: $($shInstalling.Count)"
          if ($shInstalling.Count -eq 0) { Shot 'shuck-installer-not-launched'; throw 'the app did not launch the downloaded installer' }
          Get-Process | Where-Object { $_.Name -like 'Shuck*setup*' } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep 2
          $sp2 = Start-Process $shFile.FullName -ArgumentList '/S' -PassThru
          if (-not $sp2.WaitForExit(120000)) { throw 'shuck 1.0.1 silent install timed out' }
          $shReg2 = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*','HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like 'Shuck*' } | Select-Object -First 1
          "registry after update: $($shReg2.DisplayName) $($shReg2.DisplayVersion)"
          if ("$($shReg2.DisplayVersion)" -notlike '*1.0.1*') { throw "registry did not move to 1.0.1 after the update (got: $($shReg2.DisplayVersion))" }
          Get-Process | Where-Object { $_.Name -like 'shuck*' } | Stop-Process -Force -ErrorAction SilentlyContinue
          ClickNamedIn 'Detect installed version now' $win2
          Start-Sleep 3
          $inst1 = $null
          foreach ($el in $win2.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)) {
            if ($el.Current.Name -like 'Installed: *') { $inst1 = $el.Current.Name; break }
          }
          "shuck after update: [$inst1]"
          if ($inst1 -notlike '*1.0.1*') { Shot 'shuck-after-update-wrong'; throw "after the update the app did not detect 1.0.1 (got: $inst1)" }
          $upd1 = FindNamed 'Update' $win2
          if ($upd1 -ne $null -and $upd1.Current.IsEnabled) { Shot 'shuck-update-still-enabled'; throw 'Update stays enabled after the installed version caught up' }
          $sizeEl = $null
          foreach ($el in $win2.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)) {
            if ($el.Current.Name -like 'Download size: *') { $sizeEl = $el.Current.Name; break }
          }
          "shuck download size line: [$sizeEl]"
          Shot '26d-shuck-updated-detail'
          if ($sizeEl -eq $null) { throw 'detail page shows no download size for the just-downloaded release file' }
          AssertAlive 'shuck-update'
          ClickNamedIn 'Apps' $win2
          Start-Sleep 2

          # 3) app payload: confirmation dialog appears (then cancel; no import).
          $dlJson = '{"id":"deeplink-smoke-1","url":"https://github.com/sharkdp/bat","author":"sharkdp","name":"bat","additionalSettings":"{}"}'
          Start-Process $exe -ArgumentList ('obtainium://app/' + [uri]::EscapeDataString($dlJson))
          Start-Sleep 4
          $dlgCond = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, 'Import app')
          if ($root.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $dlgCond) -eq $null) { Shot 'deeplink-import-missing'; throw 'deep-link app payload did not show the import confirmation' }
          Shot '20-deeplink-import-dialog'
          $importCond = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, 'Import')
          $importBtn = $root.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $importCond)
          if ($importBtn -eq $null) { Shot 'deeplink-import-btn-missing'; throw 'import confirmation button missing' }
          $importBtn.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
          Start-Sleep 3
          $doneCond = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, 'Import complete')
          if ($root.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $doneCond) -eq $null) { Shot 'deeplink-import-noconfirm'; throw 'deep-link import did not complete' }
          $closeCond2 = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, 'Close')
          $closeBtn2 = $root.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $closeCond2)
          if ($closeBtn2 -ne $null) { try { $closeBtn2.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke() } catch {} }
          Start-Sleep 2
          ClickNamedIn 'Apps' $win2
          Start-Sleep 2
          $obtCond = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, 'bat')
          if ($root.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $obtCond) -eq $null) { Shot 'deeplink-imported-missing'; throw 'deep-link-imported app not in the list' }
          Shot '22-deeplink-imported'
          Start-Sleep 3
          $exportFile = Join-Path $env:LOCALAPPDATA 'ObtainiumPC\auto-export.json'
          if (-not (Test-Path $exportFile)) { Shot 'auto-export-missing'; throw 'auto-export file missing after the deep-link import' }
