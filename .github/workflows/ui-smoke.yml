            ('{{"Timestamp":"{0}","Level":1,"Message":"smoke seed info entry","Error":null}}' -f $nowLog),
            ('{{"Timestamp":"{0}","Level":2,"Message":"smoke seed warning entry","Error":null}}' -f $nowLog),
