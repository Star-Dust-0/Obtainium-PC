name: Toast feasibility diagnostic (manual)
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref to build'
        required: false
        default: 'diag/toast-feasibility'
permissions:
  contents: read
jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: microsoft/setup-msbuild@v2
      - name: Restore
        run: msbuild windows/ObtainiumPC.sln /t:Restore /p:Configuration=Release /p:Platform=x64
      - name: Build
        run: msbuild windows/ObtainiumPC.sln /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:SelfContained=true
      - name: Log source revision
        shell: pwsh
        run: 'git rev-parse HEAD'
      - name: Launch and capture
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force shots | Out-Null
          function Shot($name) {
            $b=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp=New-Object System.Drawing.Bitmap $b.Width,$b.Height
            $g=[System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen((New-Object System.Drawing.Point $b.X,$b.Y),[System.Drawing.Point]::Empty,(New-Object System.Drawing.Size $b.Width,$b.Height))
            $bmp.Save("shots/$name.png"); $g.Dispose(); $bmp.Dispose()
          }
          $env:OBT_TOAST_DIAG = '1'
          $exe = 'windows\ObtainiumPC\bin\x64\Release\net8.0-windows10.0.19041.0\win-x64\ObtainiumPC.exe'
          $p = Start-Process $exe -PassThru
          Start-Sleep 8; Shot 't08-plain-no-register'
          Start-Sleep 3; Shot 't11-plain-after-register'
          Start-Sleep 3; Shot 't14-progress-25'
          Start-Sleep 3; Shot 't17-progress-60'
          Start-Sleep 4; Shot 't21-end'
          "app alive: $(-not $p.HasExited)"
      - name: Preserve app logs
        if: always()
        shell: pwsh
        run: |
          $logs = Join-Path $env:LOCALAPPDATA 'ObtainiumPC\logs.jsonl'
          if (Test-Path $logs) { Copy-Item $logs shots\app-logs.jsonl }
          Get-Content $logs | Select-String 'toast diag' | ForEach-Object { $_.Line }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toast-diag
          path: shots/
