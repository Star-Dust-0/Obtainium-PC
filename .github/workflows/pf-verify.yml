name: Program Files install and migration (branch only)
on:
  push:
    branches: [ 'feat/program-files' ]
    paths: [ '.github/workflows/pf-verify.yml' ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pf:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: microsoft/setup-msbuild@v2
      - name: Build new app and installer
        shell: pwsh
        run: |
          msbuild windows/ObtainiumPC.sln /t:Restore /p:Configuration=Release /p:Platform=x64
          msbuild windows/ObtainiumPC.sln /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:SelfContained=true
          choco install innosetup --no-progress -y | Out-Null
          $build = "$PWD\windows\ObtainiumPC\bin\x64\Release\net8.0-windows10.0.19041.0\win-x64"
          New-Item -ItemType Directory -Force dist | Out-Null
          iscc /DMyAppVersion=1.0.1 "/DBuildDir=$build" "/O$PWD\dist" "/FSetup-new" windows\packaging\ObtainiumPC.iss
          Get-ChildItem dist | Format-Table Name, Length | Out-String
      - name: Old per-user v1.0, seed data
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots, old | Out-Null
          Invoke-WebRequest 'https://github.com/StarsDust01/Obtainium-PC/releases/download/v1.0/Obtainium-PC-v1.0-win-x64-Setup.exe' -OutFile old\Setup-v1.0.exe
          Start-Process old\Setup-v1.0.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          $pu = Join-Path $env:LOCALAPPDATA 'Programs\ObtainiumPC\ObtainiumPC.exe'
          "per-user v1.0 installed: $(Test-Path $pu)"
          $hk = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' | Where-Object { $_.DisplayName -eq 'Obtainium-PC' }
          "HKCU entry: $($hk.DisplayVersion) at $($hk.InstallLocation)"
          $data = Join-Path $env:LOCALAPPDATA 'ObtainiumPC'; New-Item -ItemType Directory -Force $data | Out-Null
          Set-Content (Join-Path $data 'settings.json') '{"FirstRunHandled":true,"UpdateIntervalMinutes":123,"Theme":2}'
          Set-Content (Join-Path $data 'apps.json') '[{"id":"seed-1","url":"https://github.com/BCUninstaller/Bulk-Crap-Uninstaller","author":"BCUninstaller","name":"Bulk-Crap-Uninstaller","installedVersion":"6.3","categories":[],"additionalSettings":"{}","apkUrls":"[]","otherAssetUrls":"[]","preferredApkIndex":0,"pinned":false,"disabled":false}]'
          $p = Start-Process $pu -PassThru; Start-Sleep 10; "old app running: $(-not $p.HasExited)"
      - name: Run the new installer through the real wizard
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing, UIAutomationClient, UIAutomationTypes
          Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public class M { [DllImport("user32.dll")] public static extern void mouse_event(uint f, uint dx, uint dy, uint d, int e); }'
          function Shot($name) {
            $b=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp=New-Object System.Drawing.Bitmap $b.Width,$b.Height
            $g=[System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location,[System.Drawing.Point]::Empty,$b.Size)
            $bmp.Save("shots/$name.png"); $g.Dispose(); $bmp.Dispose()
          }
          $root = [System.Windows.Automation.AutomationElement]::RootElement
          function SetupWin() { foreach ($w in $root.FindAll([System.Windows.Automation.TreeScope]::Children, [System.Windows.Automation.Condition]::TrueCondition)) { if ($w.Current.Name -like 'Setup - Obtainium-PC*') { return $w } }; return $null }
          function FindNamed($name, $scope) { return $scope.FindFirst([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, $name))) }
          Start-Process dist\Setup-new.exe
          $sw = $null; foreach ($i in 1..30) { Start-Sleep 2; $sw = SetupWin; if ($sw) { break } }
          if (-not $sw) { Shot 'pf-no-setup-window'; throw 'installer window never appeared' }
          Start-Sleep 2; Shot 'pf-01-wizard-first-page'
          # What does the destination edit say?
          foreach ($el in $sw.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)) { $n = $el.Current.Name; $v=''; try { $v = $el.GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern).Current.Value } catch {}; if ($n -match 'Program|Obtainium|Setup will|destination' -or $v -match 'Program|Obtainium') { "WIZARD: [$n] value=[$v]" } }
          $done = $false; $shots = 1
          foreach ($i in 1..80) {
            Start-Sleep 2
            $sw = SetupWin; if ($sw -eq $null) { if ($done) { break } else { continue } }
            foreach ($bn in 'Finish','Install','Next >','Next','OK','Yes') {
              $b = FindNamed $bn $sw
              if ($b -ne $null) {
                if ($bn -in 'Install','Finish') { $shots++; Shot ("pf-0$shots-before-$bn") }
                try { $b.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke() } catch { $r=$b.Current.BoundingRectangle; [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point([int]($r.X+$r.Width/2),[int]($r.Y+$r.Height/2)); Start-Sleep -Milliseconds 300; [M]::mouse_event(0x02,0,0,0,0); [M]::mouse_event(0x04,0,0,0,0) }
                "wizard: clicked $bn"
                if ($bn -eq 'Finish') { $done = $true }
                break
              }
            }
            if ($done) { break }
          }
          Start-Sleep 5
          if (-not $done) { Shot 'pf-wizard-incomplete'; throw 'wizard did not reach Finish' }
      - name: Verify migration
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing, UIAutomationClient, UIAutomationTypes
          function Shot($name) { $b=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds; $bmp=New-Object System.Drawing.Bitmap $b.Width,$b.Height; $g=[System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location,[System.Drawing.Point]::Empty,$b.Size); $bmp.Save("shots/$name.png"); $g.Dispose(); $bmp.Dispose() }
          $pf = Join-Path $env:ProgramFiles 'Obtainium-PC\ObtainiumPC.exe'
          "Program Files exe exists: $(Test-Path $pf)  version: $((Get-Item $pf -ErrorAction SilentlyContinue).VersionInfo.ProductVersion)"
          $hl = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*','HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -eq 'Obtainium-PC' }
          "HKLM entries: $(@($hl).Count) -> $($hl.DisplayVersion) at $($hl.InstallLocation) uninstall=$($hl.UninstallString)"
          $hk = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -eq 'Obtainium-PC' }
          "HKCU entries left: $(@($hk).Count)"
          "per-user folder left: $(Test-Path (Join-Path $env:LOCALAPPDATA 'Programs\ObtainiumPC'))"
          "start menu shortcuts: " + ((Get-ChildItem "$env:ProgramData\Microsoft\Windows\Start Menu\Programs","$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter 'Obtainium*' -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }) -join '; ')
          $data = Join-Path $env:LOCALAPPDATA 'ObtainiumPC'
          "settings kept: $(Get-Content (Join-Path $data 'settings.json') -Raw)"
          "apps kept: $((Get-Content (Join-Path $data 'apps.json') -Raw).Substring(0,80))"
          Get-Process ObtainiumPC -ErrorAction SilentlyContinue | ForEach-Object { "running process path: $($_.Path)" }
          $p = Start-Process $pf -PassThru; Start-Sleep 20; $p.Refresh(); "new app running: $(-not $p.HasExited)"
          Shot 'pf-10-app-from-program-files'
          $root = [System.Windows.Automation.AutomationElement]::RootElement
          $win = $root.FindFirst([System.Windows.Automation.TreeScope]::Children, (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ProcessIdProperty, $p.Id)))
          foreach ($el in $win.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)) { $n = $el.Current.Name; if ($n -match 'Bulk|Obtainium-PC|apps') { "UIA: $n" } }
          Get-Content (Join-Path $data 'apps.json') -Raw | ConvertFrom-Json | ForEach-Object { "id=$($_.id) name=$($_.name) installed=$($_.installedVersion)" }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
      - name: Uninstall from Program Files
        shell: pwsh
        run: |
          $u = Join-Path $env:ProgramFiles 'Obtainium-PC\unins000.exe'
          "uninstaller present: $(Test-Path $u)"
          Start-Process $u -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          Start-Sleep 3
          "folder after uninstall: $(Test-Path (Join-Path $env:ProgramFiles 'Obtainium-PC'))"
          "HKLM entry after uninstall: $(@(Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*','HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -eq 'Obtainium-PC' }).Count)"
          "user data kept after uninstall: $(Test-Path (Join-Path $env:LOCALAPPDATA 'ObtainiumPC\settings.json'))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pf-verify
          path: shots
